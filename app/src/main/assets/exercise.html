<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>错词练习 · 单词一扫光</title>
<style>
:root {
  --gold: #fbbf24;
  --green: #10b981;
  --blue: #38bdf8;
  --orange: #f97316;
  --red: #ef4444;
  --purple: #a78bfa;
  --bg-0: #0b1220;
  --bg-1: #0f172a;
  --bg-2: #1b2540;
  --line: rgba(148,163,184,.16);
  --txt: #e2e8f0;
  --txt-dim: #94a3b8;
  --txt-mute: #64748b;
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --ease-out: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg-0);
  color: var(--txt);
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
}

/* HUD */
.hud {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: linear-gradient(180deg, rgba(30,41,59,.98), rgba(15,23,42,.94));
  border-bottom: 1px solid var(--line);
  z-index: 20;
  min-height: 54px;
  flex-wrap: wrap;
}
.hud-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--gold);
  white-space: nowrap;
  flex: 0 0 auto;
  padding: 4px 10px;
  background: rgba(251,191,36,.12);
  border: 1px solid rgba(251,191,36,.3);
  border-radius: 8px;
}
.hud-stat {
  font-size: 12px;
  color: var(--txt-dim);
  white-space: nowrap;
  flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
  padding: 4px 8px;
  background: rgba(30,41,59,.55);
  border-radius: 8px;
}
.hud-stat b { font-size: 13px; font-weight: 900; }
.hud-stat.new b { color: #7dd3fc; }
.hud-stat.wrong b { color: #fca5a5; }
.hud-stat.done b { color: #6ee7b7; }
.hud-user {
  margin-left: auto;
  font-size: 13px;
  font-weight: 700;
  color: #e2e8f0;
  white-space: nowrap;
  max-width: 90px;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 0 0 auto;
  padding: 4px 10px;
  background: rgba(30,41,59,.55);
  border-radius: 8px;
}

/* 进度条 */
.progress-bar {
  flex: 0 0 auto;
  height: 4px;
  background: rgba(2,6,23,.7);
  position: relative;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #38bdf8, #a78bfa);
  transition: width .35s var(--ease-out);
  box-shadow: 0 0 12px rgba(56,189,248,.7);
}

/* 内容区 */
.content-area {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px;
}

/* 空状态 */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 20px;
  gap: 16px;
}
.empty-icon { font-size: 64px; filter: drop-shadow(0 4px 12px rgba(0,0,0,.4)); }
.empty-title { font-size: 18px; font-weight: 900; color: #f8fafc; }
.empty-desc { font-size: 14px; color: var(--txt-dim); line-height: 1.7; max-width: 320px; }
.btn-primary {
  padding: 12px 28px;
  border-radius: 12px;
  border: 1px solid rgba(56,189,248,.5);
  background: linear-gradient(180deg, rgba(56,189,248,.22), rgba(14,165,233,.16));
  color: #bae6fd;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  transition: transform .15s;
}
.btn-primary:active { transform: scale(.96); }

/* 队列结束页 */
.queue-end {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 20px;
  gap: 18px;
}
.queue-end-icon { font-size: 72px; filter: drop-shadow(0 6px 18px rgba(251,191,36,.5)); }
.queue-end-title { font-size: 22px; font-weight: 900; color: #f8fafc; }
.queue-end-desc { font-size: 14px; color: var(--txt-dim); line-height: 1.7; max-width: 320px; }
.queue-end-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; margin-top: 8px; }
.queue-end-actions button {
  padding: 13px 20px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  transition: transform .15s;
}
.queue-end-actions button:active { transform: scale(.96); }
.qe-primary {
  border: 1px solid rgba(56,189,248,.5);
  background: linear-gradient(180deg, rgba(56,189,248,.22), rgba(14,165,233,.16));
  color: #bae6fd;
}
.qe-ghost {
  border: 1px solid rgba(148,163,184,.28);
  background: rgba(148,163,184,.08);
  color: var(--txt-dim);
}

/* 测试题 */
.quiz-view {
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 560px;
  margin: 0 auto;
}
.question-card {
  background: linear-gradient(180deg, #1b2540 0%, #0f172a 100%);
  border: 1px solid rgba(148,163,184,.22);
  border-radius: 16px;
  padding: 20px 18px;
  box-shadow: 0 12px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
}
.question-label {
  font-size: 12px;
  color: var(--txt-mute);
  letter-spacing: .5px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.question-label::before {
  content: '';
  width: 3px;
  height: 12px;
  border-radius: 2px;
  background: var(--blue);
}
.question-label .status-tag {
  margin-left: auto;
  font-size: 10.5px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 6px;
  letter-spacing: .3px;
}
.question-label .status-tag.new {
  color: #7dd3fc;
  background: rgba(56,189,248,.15);
  border: 1px solid rgba(56,189,248,.35);
}
.question-label .status-tag.wrong {
  color: #fca5a5;
  background: rgba(239,68,68,.15);
  border: 1px solid rgba(239,68,68,.35);
}
.question-label .status-tag.done {
  color: #6ee7b7;
  background: rgba(16,185,129,.15);
  border: 1px solid rgba(16,185,129,.35);
}
.question-en {
  font-size: 17px;
  line-height: 1.8;
  color: #e8edf5;
  margin-bottom: 12px;
  word-break: break-word;
}
.question-en .blank {
  display: inline-block;
  border-bottom: 3px solid var(--blue);
  text-align: center;
  font-weight: 800;
  color: #f8fafc;
  padding: 0 12px;
  min-width: 100px;
  vertical-align: middle;
  min-height: 1.35em;
}
.question-cn {
  font-size: 14px;
  color: var(--txt-dim);
  line-height: 1.5;
}
.question-count {
  font-size: 12px;
  color: var(--txt-mute);
  text-align: right;
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
}

/* 选项 */
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.option-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border-radius: 12px;
  border: 1px solid rgba(148,163,184,.22);
  background: rgba(30,41,59,.55);
  color: var(--txt);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s var(--ease-out);
  text-align: left;
  min-height: 56px;
}
.option-btn:active:not(:disabled) { transform: scale(.98); }
.option-btn:not(:disabled):hover { background: rgba(30,41,59,.85); border-color: rgba(56,189,248,.4); }
.option-btn .opt-letter {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: rgba(56,189,248,.15);
  border: 1px solid rgba(56,189,248,.35);
  color: #7dd3fc;
  font-size: 14px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}
.option-btn .opt-text {

  min-width: 0;

}
.option-btn.correct {

  border-color: rgba(16,185,129,.6);
  color: #6ee7b7;
  cursor: default;
}
.option-btn.correct .opt-letter {
  background: rgba(16,185,129,.3);
  border-color: rgba(16,185,129,.7);
  color: #fff;
}
.option-btn.wrong {
  background: linear-gradient(135deg, rgba(239,68,68,.22), rgba(185,28,28,.14));
  border-color: rgba(239,68,68,.6);
  color: #fca5a5;
  cursor: default;
}
.option-btn.wrong .opt-letter {
  background: rgba(239,68,68,.3);
  border-color: rgba(239,68,68,.7);
  color: #fff;
}
.option-btn:disabled { cursor: default; }

/* 反馈 */
.feedback {
  display: none;
  padding: 14px 18px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.6;
  border: 1px solid transparent;
}
.feedback.show { display: block; }
.feedback.ok {

  color: #6ee7b7;
  border-color: rgba(16,185,129,.38);
}
.feedback.err {
  background: linear-gradient(135deg, rgba(239,68,68,.16), rgba(185,28,28,.1));
  color: #fca5a5;
  border-color: rgba(239,68,68,.38);
}
.feedback b { color: #fff; font-size: 16px; }

/* 导航 */
.nav {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.nav button {
  flex: 1;
  max-width: 200px;
  padding: 14px 20px;
  border-radius: 12px;
  border: 1px solid rgba(56,189,248,.45);
  background: linear-gradient(180deg, rgba(56,189,248,.16), rgba(14,165,233,.1));
  color: #bae6fd;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s var(--ease-out);
}
.nav button:disabled {
  opacity: .35;
  cursor: not-allowed;
}
.nav button:active:not(:disabled) { transform: scale(.96); }

/* 底部 */
.footer {
  flex: 0 0 auto;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  background: rgba(15,23,42,.96);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.home-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 10px 20px;
  border-radius: 999px;
  border: 1px solid rgba(148,163,184,.28);
  background: rgba(148,163,184,.08);
  color: var(--txt-dim);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
.home-btn:active { transform: scale(.95); }
.home-btn.danger { border-color: rgba(239,68,68,.4); color: #fca5a5; }
.home-btn.danger:active { background: rgba(239,68,68,.15); }

/* 确认弹窗 */
.modal-mask {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(2,6,23,.78);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .26s ease;
  padding: 24px;
}
.modal-mask.show { opacity: 1; pointer-events: auto; }
.modal-card {
  width: 100%;
  max-width: 340px;
  background: linear-gradient(180deg, #1b2540 0%, #0f172a 100%);
  border: 1px solid rgba(148,163,184,.3);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 24px 60px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08);
  transform: scale(.9) translateY(10px);
  opacity: 0;
  transition: transform .34s var(--ease-spring), opacity .26s ease;
  text-align: center;
}
.modal-mask.show .modal-card { transform: scale(1) translateY(0); opacity: 1; }
.modal-title { font-size: 19px; font-weight: 900; color: #f8fafc; margin-bottom: 12px; }
.modal-content { font-size: 14px; color: var(--txt-dim); line-height: 1.6; margin-bottom: 22px; }
.modal-actions { display: flex; gap: 12px; }
.modal-btn {
  flex: 1;
  padding: 13px 0;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s ease;
  border: none;
}
.modal-btn:active { transform: scale(.96); }
.modal-btn.cancel {
  background: rgba(148,163,184,.1);
  color: var(--txt-dim);
  border: 1px solid rgba(148,163,184,.3);
}
.modal-btn.confirm {
  background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
  color: #fff;
  box-shadow: 0 4px 16px rgba(239,68,68,.3);

.btn-skip-review {
  background: transparent;
  border: none;
  color: var(--txt-mute);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  text-decoration: underline;
  text-underline-offset: 4px;
  transition: color .2s;
  padding: 8px 16px;
}
.btn-skip-review:active {
  color: var(--txt-dim);
}
</style>
</head>

<script>
/* =========================================================
   0. 基础常量
   ========================================================= */
const _auth = localStorage.getItem('dd_auth') || 'guest';
const _userName = (localStorage.getItem('dd_name') || '同学').trim();

const GRADE_MAP = {
  basic: { data: (typeof WORDS_BASIC !== 'undefined' ? WORDS_BASIC : []), label: '基础' },
  core:  { data: (typeof WORDS_CORE  !== 'undefined' ? WORDS_CORE  : []), label: '核心' },
  extra: { data: (typeof WORDS_EXTRA !== 'undefined' ? WORDS_EXTRA : []), label: '拓展' }
};

const GAME_KEY = 'dd_vg10_' + _auth;
const EX_KEY   = 'dd_exercise_' + _auth;

/* =========================================================
   1. 存储读写
   ========================================================= */
function loadGameErrorLog() {
  try {
    const raw = localStorage.getItem(GAME_KEY);
    if (raw) {
      const j = JSON.parse(raw);
      return j.errorLog || {};
    }
  } catch (e) {}
  return {};
}

function loadExerciseState() {
  try {
    const raw = localStorage.getItem(EX_KEY);
    if (raw) {
      const j = JSON.parse(raw);
      return { items: j.items || {} };
    }
  } catch (e) {}
  return { items: {} };
}

function saveExerciseState(s) {
  try { localStorage.setItem(EX_KEY, JSON.stringify(s)); } catch (e) {}
}

/* ---------------------------------------------------------
   从游戏 errorLog 同步到 exerciseState
   - 游戏里出现但 exercise 里没有 → 新增为 new
   - 游戏里 lastAt 更新了（游戏里又错了） → 重置为 new
   - exercise 有但游戏里没了（重置游戏后） → 删除
   --------------------------------------------------------- */
function syncFromErrorLog() {
  const errorLog = loadGameErrorLog();
  const ex = loadExerciseState();
  let changed = false;

  for (const key in errorLog) {
    const info = errorLog[key];
    const lastAt = info.lastAt || 0;
    if (!ex.items[key]) {
      ex.items[key] = { status: 'new', doneAt: 0, lastErrorAt: lastAt };
      changed = true;
    } else {
      if (lastAt > (ex.items[key].lastErrorAt || 0)) {
        // 游戏里又错了，重置为新题（即使之前已经 done）
        ex.items[key].status = 'new';
        ex.items[key].doneAt = 0;
        ex.items[key].lastErrorAt = lastAt;
        changed = true;
      }
    }
  }

  for (const key in ex.items) {
    if (!errorLog[key]) {
      delete ex.items[key];
      changed = true;
    }
  }

  if (changed) saveExerciseState(ex);
  return ex;
}

/* =========================================================
   2. 词库反查
   ========================================================= */
function findWordByKey(key) {
  for (const tier of ['basic', 'core', 'extra']) {
    const pool = GRADE_MAP[tier].data;
    const found = pool.find(x => (x.w || '').toLowerCase() === key);
    if (found) return { word: found, tier: tier };
  }
  return null;
}

function getAllErrors() {
  const errorLog = loadGameErrorLog();
  const list = [];
  for (const key in errorLog) {
    const info = errorLog[key];
    const found = findWordByKey(key);
    if (!found) continue;
    if (!found.word.en || !found.word.en.trim()) continue;
    list.push({
      key: key,
      word: found.word,
      tier: found.tier,
      count: info.count || 1,
      lastAt: info.lastAt || 0
    });
  }
  return list;
}
/* 检查一个词是否有有效的错误输入 */
function isValidExerciseWord(key) {
  const errorLog = loadGameErrorLog();
  const entry = errorLog[key];
  if (!entry) return false;
  const inputs = entry.inputs;
  // 必须有 inputs，且是数组，且不为空
  if (!inputs || !Array.isArray(inputs) || inputs.length === 0) return false;
  return true;
}
/* =========================================================
   3. 挖空逻辑（复刻自 index.html）
   ========================================================= */
const IRREG = {
  found:'find',sent:'send',bought:'buy',became:'become',won:'win',stole:'steal',caught:'catch',
  fought:'fight',paid:'pay',overslept:'oversleep',got:'get',fell:'fall',made:'make',took:'take',
  gave:'give',did:'do',went:'go',was:'be',were:'be',am:'be',is:'be',are:'be',bled:'bleed',
  cancelled:'cancel',clapped:'clap',nodded:'nod',led:'lead',built:'build',held:'hold',kept:'keep',
  left:'leave',met:'meet',read:'read',said:'say',saw:'see',spoke:'speak',stood:'stand',
  taught:'teach',thought:'think',came:'come',ran:'run',sang:'sing',sat:'sit',swam:'swim',
  wrote:'write',ate:'eat',drank:'drink',drove:'drive',rode:'ride',threw:'throw',wore:'wear',
  broke:'break',chose:'choose',drew:'draw',flew:'fly',grew:'grow',knew:'know',showed:'show',
  told:'tell',understood:'understand',woke:'wake',spent:'spend',felt:'feel',lost:'lose',
  heard:'hear',hurt:'hurt',cut:'cut',put:'put',let:'let',sold:'sell',
  teeth:'tooth',feet:'foot',men:'man',women:'woman',children:'child',leaves:'leaf'
};

function wordVariants(w) {
  w = w.toLowerCase();
  const vs = [w];
  if (w.endsWith('y') && w.length > 1 && !'aeiou'.includes(w[w.length - 2])) {
    vs.push(w.slice(0, -1) + 'ies');
    vs.push(w.slice(0, -1) + 'ied');
  } else if (w.endsWith('e')) {
    vs.push(w + 'd');
    vs.push(w.slice(0, -1) + 'ing');
    vs.push(w + 's');
  } else {
    vs.push(w + 's'); vs.push(w + 'es'); vs.push(w + 'ed'); vs.push(w + 'ing');
  }
  if (w.length >= 3 && 'bcdfghjklmnpqrstvwxz'.includes(w[w.length - 1])
      && 'aeiou'.includes(w[w.length - 2]) && !'aeiou'.includes(w[w.length - 3])) {
    vs.push(w + w[w.length - 1] + 'ed');
    vs.push(w + w[w.length - 1] + 'ing');
  }
  for (const ir in IRREG) { if (IRREG[ir] === w) vs.push(ir); }
  return [...new Set(vs)];
}

function wordPat(w) {
  const wl = w.toLowerCase();
  if (wl === "sb's" || wl === "one's") return ["\\S+'s", '\\S+'];
  if (wl === 'sb' || wl === 'sb.') return ['\\S+'];
  if (wl === 'doing') return ['\\w+ing', '\\b' + w + '\\b'];
  return wordVariants(w).map(v => '\\b' + v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
}

function cartesian(arrays) {
  if (!arrays.length) return [[]];
  const f = arrays[0], rest = arrays.slice(1), rc = cartesian(rest), out = [];
  for (const x of f) for (const r of rc) out.push([x].concat(r));
  return out;
}

function phrasePats(w) {
  if (w.indexOf('...') >= 0) {
    const parts = w.split('...').map(s => s.trim()).filter(Boolean);
    const fp = parts[0].split(' ').map(wordPat);
    const lp = parts[parts.length - 1].split(' ').map(wordPat);
    const out = [];
    for (const fc of cartesian(fp)) for (const lc of cartesian(lp)) {
      out.push('\\b' + fc.join('\\s+') + '\\b(?:\\s+\\S+){0,2}\\s+\\b' + lc.join('\\s+') + '\\b');
    }
    return out;
  }
  const words = w.split(' ');
  if (words.length === 1) return wordPat(words[0]);
  const out = [];
  for (const combo of cartesian(words.map(wordPat))) out.push('\\b' + combo.join('\\s+') + '\\b');
  return out;
}

let _lastSeg = '';
let _lastSegFirst = false;

function makeBlank(en, word) {
  _lastSeg = ''; _lastSegFirst = false;
  const pats = phrasePats(word);
  for (const p of pats) {
    const re = new RegExp(p, 'i');
    const m = re.exec(en);
    if (m) {
      _lastSeg = m[0];
      _lastSegFirst = /^[\s"'()]*$/.test(en.slice(0, m.index));
      const bw = (m[0].length + 2) * 14 + 20;
      const reG = new RegExp(p, 'gi');
      return en.replace(reG, '<span class="blank" style="min-width:' + bw + 'px"></span>');
    }
  }
  return '';
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =========================================================
   4. 干扰项选择
/* ---------------------------------------------------------
   从当前词的历史错误输入里挑选干扰项
   ---------------------------------------------------------
   规则：
     - 最新 2 个错误输入必留
     - 第 3 个：剩余里出现次数最多的；次数相同取最近的
     - 总干扰项最多 3 个
     - 与正确词相同的输入过滤掉
   --------------------------------------------------------- */
function pickInputDistractors(inputs, correctText) {
  const correct = (correctText || '').toLowerCase().trim();
  const valid = (inputs || []).filter(x =>
    x && x.text && x.text.trim() && x.text !== correct
  );
  if (valid.length === 0) return [];

  const sorted = valid.slice().sort((a, b) => b.lastAt - a.lastAt);

  const picked = [];
  const pickedSet = new Set();

  // 最新 2 个
  for (let i = 0; i < Math.min(2, sorted.length); i++) {
    picked.push(sorted[i]);
    pickedSet.add(sorted[i].text);
  }

  // 第 3 个：剩余里次数最多的；次数相同取最近
  if (picked.length < 3) {
    const remaining = sorted.filter(x => !pickedSet.has(x.text));
    if (remaining.length > 0) {
      const maxCount = remaining.reduce((m, x) => Math.max(m, x.count), 0);
      const top = remaining.filter(x => x.count === maxCount);
      top.sort((a, b) => b.lastAt - a.lastAt);
      picked.push(top[0]);
    }
  }

  return picked;
}

/* =========================================================
   5. 构建题目
   ========================================================= */
function buildQuestion(key, allErrors) {
  const found = findWordByKey(key);
  if (!found) return null;
  const w = found.word;
  if (!w.en || !w.en.trim()) return null;

  const blankHtml = makeBlank(w.en, w.w);
  if (!blankHtml || !_lastSeg) return null;

  // 从当前词自己的 errorLog.inputs 里取干扰项
  const errorLog = loadGameErrorLog();
  const entry = errorLog[key];
  const inputs = (entry && entry.inputs) ? entry.inputs : [];

  const distractors = pickInputDistractors(inputs, w.w);
  if (distractors.length === 0) return null;   // 没有错误输入 → 不出题

  const optionsRaw = [
    { text: w.w, correct: true },
    ...distractors.map(d => ({ text: d.text, correct: false }))
  ];

  const options = shuffleArr(optionsRaw);
  const letters = ['A', 'B', 'C', 'D'];
  options.forEach((o, i) => { o.letter = letters[i]; });

  return {
    key: key,
    word: w,
    tier: found.tier,
    enHtml: blankHtml,
    cn: w.cn || '',
    options: options
  };
}

/* =========================================================
   6. 构建队列
   -----------------------------------------------------
   队列顺序：
     shuffle(new + wrong)  →  前段
     done 按 doneAt 升序   →  后段
   ========================================================= */
function buildQueue(exState) {
  const errorLog = loadGameErrorLog();
  const news = [], wrongs = [], dones = [];

  for (const key in exState.items) {
    const item = exState.items[key];
    if (!errorLog[key]) continue;
    if (!isValidExerciseWord(key)) continue; 
    if (item.status === 'new') news.push(key);
    else if (item.status === 'wrong') wrongs.push(key);
    else if (item.status === 'done') dones.push(key);
  }

  dones.sort((a, b) => (exState.items[a].doneAt || 0) - (exState.items[b].doneAt || 0));

  const front = shuffleArr([...news, ...wrongs]);
  return [...front, ...dones];
}

/* =========================================================
   7. DOM 引用
   ========================================================= */
const el = {
  empty:        document.getElementById('emptyState'),
  quiz:         document.getElementById('quizView'),
  queueEnd:     document.getElementById('queueEnd'),
  progressFill: document.getElementById('progressFill'),
  statNew:      document.getElementById('statNew'),
  statWrong:    document.getElementById('statWrong'),
  statDone:     document.getElementById('statDone'),
  hudUser:      document.getElementById('hudUser'),
  questionEn:   document.getElementById('questionEn'),
  questionCn:   document.getElementById('questionCn'),
  questionCount:document.getElementById('questionCount'),
  statusTag:    document.getElementById('statusTag'),
  options:      document.getElementById('options'),
  feedback:     document.getElementById('feedback'),
 // btnPrev:      document.getElementById('btnPrev'),
  btnNext:      document.getElementById('btnNext'),
  btnSkipReview:document.getElementById('btnSkipReview'), // ← 新增
  queueEndDesc: document.getElementById('queueEndDesc'),
  btnRestart:   document.getElementById('btnRestart'),
  btnReset:     document.getElementById('btnReset'),
  modalMask:    document.getElementById('modalMask'),
  modalTitle:   document.getElementById('modalTitle'),
  modalContent: document.getElementById('modalContent'),
  modalCancel:  document.getElementById('modalCancel'),
  modalConfirm: document.getElementById('modalConfirm')
};

/* =========================================================
   8. 状态
   ========================================================= */
const state = {
  allErrors: [],     // 全部错误词（用于生成干扰项）
  questions: [],     // 队列：每题 {key, word, tier, enHtml, cn, options, answer, pickedIdx, initStatus}
  current: 0
};

/* =========================================================
   9. HUD 统计
   ========================================================= */
function updateHUDStats() {
  const ex = loadExerciseState();
  let nNew = 0, nWrong = 0, nDone = 0;
  for (const k in ex.items) {
     // ↓↓↓ 新增这一行：没有错误输入的词不参与统计
    if (!isValidExerciseWord(k)) continue;
    const st = ex.items[k].status;
    if (st === 'new') nNew++;
    else if (st === 'wrong') nWrong++;
    else if (st === 'done') nDone++;
  }
  el.statNew.textContent = nNew;
  el.statWrong.textContent = nWrong;
  el.statDone.textContent = nDone;
  el.hudUser.textContent = _userName;
}

function updateProgress() {
  const total = state.questions.length;
  const done = state.questions.filter(q => q.answer !== null).length;
  el.progressFill.style.width = total ? (done / total * 100) + '%' : '0%';
}

/* =========================================================
   10. 渲染题目
   ========================================================= */
function renderQuestion() {
  if (!state.questions.length) return;
  const q = state.questions[state.current];

  el.questionEn.innerHTML = q.enHtml;
  el.questionCn.textContent = q.cn;
  el.questionCount.textContent = '第 ' + (state.current + 1) + ' / ' + state.questions.length + ' 题';

  // 状态标签：显示题目进入本轮时的状态
  el.statusTag.className = 'status-tag ' + q.initStatus;
  if (q.initStatus === 'new') el.statusTag.textContent = '新题';
  else if (q.initStatus === 'wrong') el.statusTag.textContent = '错题';
  else if (q.initStatus === 'done') el.statusTag.textContent = '已掌握';

  // 选项
  el.options.innerHTML = q.options.map((opt, i) => {
    return '<button class="option-btn" data-idx="' + i + '">' +
      '<span class="opt-letter">' + opt.letter + '</span>' +
      '<span class="opt-text">' + escapeHtml(opt.text) + '</span>' +
    '</button>';
  }).join('');

  el.options.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => onOptionClick(parseInt(btn.dataset.idx, 10)));
  });

  // 反馈
  el.feedback.className = 'feedback';
  el.feedback.innerHTML = '';

  // 已答状态回放
  if (q.answer !== null) {
    showAnswerState();
  }

  updateNav();
  updateProgress();
  if (el.btnSkipReview) {
    if (q.initStatus === 'done') {
      el.btnSkipReview.style.display = 'inline-block';
    } else {
      el.btnSkipReview.style.display = 'none';
    }
  }
}

function showAnswerState() {
  const q = state.questions[state.current];
  const btns = el.options.querySelectorAll('.option-btn');

  btns.forEach((btn, i) => {
    btn.disabled = true;
    const opt = q.options[i];
    if (opt.correct) {
      btn.classList.add('correct');
    } else if (q.answer === false && i === q.pickedIdx) {
      btn.classList.add('wrong');
    }
  });

  if (q.answer === true) {
    el.feedback.className = 'feedback show ok';
    el.feedback.innerHTML = '✓ 答对了！正确答案：<b>' + escapeHtml(q.word.w) + '</b>';
  } else if (q.answer === false) {
    el.feedback.className = 'feedback show err';
    el.feedback.innerHTML = '✗ 答错了。正确答案是 <b>' + escapeHtml(q.word.w) + '</b>';
  }
}

/* =========================================================
   11. 答题
   ========================================================= */
function onOptionClick(idx) {
  const q = state.questions[state.current];
  if (q.answer !== null) return;

  const picked = q.options[idx];
  q.answer = !!picked.correct;
  q.pickedIdx = idx;

  // 写入 exerciseState
  const ex = loadExerciseState();
  if (ex.items[q.key]) {
    if (picked.correct) {
      ex.items[q.key].status = 'done';
      ex.items[q.key].doneAt = Date.now();
    } else {
      ex.items[q.key].status = 'wrong';
    }
    saveExerciseState(ex);
  }

  if (picked.correct) {
    beep(660, .09, 'sine', .08);
    beep(990, .14, 'sine', .08, .08);
  } else {
    beep(220, .12, 'sawtooth', .09);
    beep(160, .18, 'sawtooth', .09, .11);
  }

  showAnswerState();
  updateHUDStats();
  updateNav();
  updateProgress();
  sfxClick();
}

/* =========================================================
   12. 导航
   ========================================================= */
function updateNav() {
  const q = state.questions[state.current];
  const isLast = state.current === state.questions.length - 1;
  const isAnswered = q && q.answer !== null;

  if (!isAnswered) {
    el.btnNext.disabled = true;
    el.btnNext.textContent = '请先选择答案';
    return;
  }

  if (isLast) {
    const allAnswered = state.questions.every(x => x.answer !== null);
    el.btnNext.disabled = !allAnswered;
    el.btnNext.textContent = allAnswered ? '完成本轮' : '下一题 →';
  } else {
    el.btnNext.disabled = false;
    el.btnNext.textContent = '下一题 →';
  }
}


el.btnNext.addEventListener('click', () => {
  const q = state.questions[state.current];
  if (!q || q.answer === null) return;

  const isLast = state.current === state.questions.length - 1;
  const allAnswered = state.questions.every(x => x.answer !== null);

  // 如果已经是最后一题且全答完了，直接去结算
  if (isLast && allAnswered) {
    showQueueEnd();
    sfxClick();
    return;
  }

  // ====== 拦截逻辑 ======
  // 如果还没到最后一题，且下一题是“已掌握”的题，且当前题不是“已掌握”
  const nextQ = state.questions[state.current + 1];
  if (nextQ && nextQ.initStatus === 'done' && q.initStatus !== 'done') {
    // 统计后面一共有多少道复习题
    let doneCount = 0;
    for (let i = state.current + 1; i < state.questions.length; i++) {
      if (state.questions[i].initStatus === 'done') doneCount++;
    }

    // 弹出拦截提示
    openModal(
      '新题与错题已全部做完',
      '后面还有 ' + doneCount + ' 道已掌握的旧题。<br>要继续复习吗？',
      () => {
        // 点击“继续复习”，进入下一题
        state.current++;
        renderQuestion();
        sfxClick();
        document.querySelector('.content-area').scrollTop = 0;
      },
      '继续复习',
      () => {
        // 点击“结束本轮”，直接去结算
        showQueueEnd();
        sfxClick();
        document.querySelector('.content-area').scrollTop = 0;
      },
      '结束本轮'
    );
    return;
  }

  // ====== 正常下一题 ======
  if (!isLast) {
    state.current++;
    renderQuestion();
    sfxClick();
    document.querySelector('.content-area').scrollTop = 0;
  }
});

// ====== 提前结束复习按钮 ======
el.btnSkipReview.addEventListener('click', () => {
  showQueueEnd();
  sfxClick();
  document.querySelector('.content-area').scrollTop = 0;
});

/* =========================================================
   13. 队列结束页
   ========================================================= */
function showQueueEnd() {
  el.quiz.style.display = 'none';
  el.queueEnd.style.display = 'flex';
  el.queueEnd.scrollIntoView({ block: 'center' });

  const correct = state.questions.filter(q => q.answer === true).length;
  const wrong = state.questions.filter(q => q.answer === false).length;
  el.queueEndDesc.textContent =
    '本轮共 ' + state.questions.length + ' 题，答对 ' + correct + ' 题，答错 ' + wrong + ' 题。';

  // 统计真正的“新题”数量（此时刚刚做错的题已经变成 wrong 状态了，不会混入这里）
  const ex = loadExerciseState();
  let newCount = 0;
  for (const k in ex.items) {
    if (ex.items[k].status === 'new' && isValidExerciseWord(k)) newCount++;
  }

  if (newCount > 0) {
    el.btnRestart.textContent = '继续练习（还有 ' + newCount + ' 道新题）';
  } else if (wrong > 0) {
    el.btnRestart.textContent = '再试一遍错题';
  } else {
    el.btnRestart.textContent = '重新复习一轮';
  }
}

/* =========================================================
   14. 构建本轮
   ========================================================= */
function buildRound() {
  // 1. 从游戏 errorLog 同步
  const ex = syncFromErrorLog();

  // 2. 全部错误词（用于生成干扰项）
  state.allErrors = getAllErrors();

  // 3. 构建队列
  const queueKeys = buildQueue(ex);

  // 4. 构建题目
  state.questions = [];
  for (const key of queueKeys) {
    const q = buildQuestion(key, state.allErrors);
    if (!q) continue;
    q.answer = null;
    q.pickedIdx = -1;
    q.initStatus = (ex.items[key] && ex.items[key].status) || 'new';
    state.questions.push(q);
  }

  state.current = 0;
}

/* =========================================================
   15. 启动
   ========================================================= */
function startExercise() {
  buildRound();
  updateHUDStats();
  updateProgress();

  if (!state.questions.length) {
    el.empty.style.display = 'flex';
    el.quiz.style.display = 'none';
    el.queueEnd.style.display = 'none';
    el.progressFill.style.width = '0%';
    return;
  }

  el.empty.style.display = 'none';
  el.queueEnd.style.display = 'none';
  el.quiz.style.display = 'flex';
  renderQuestion();
}

el.btnRestart.addEventListener('click', () => {
  startExercise();
  sfxClick();
  document.querySelector('.content-area').scrollTop = 0;
});

/* =========================================================
   16. 重置题库
   ========================================================= */
function openModal(title, content, onConfirm, confirmText = '确定', onCancel = null, cancelText = '取消') {
  el.modalTitle.textContent = title;
  el.modalContent.innerHTML = content;
  el.modalMask.classList.add('show');

  el.modalConfirm.textContent = confirmText;
  el.modalCancel.textContent = cancelText;

  const handleConfirm = () => {
    el.modalMask.classList.remove('show');
    el.modalConfirm.removeEventListener('click', handleConfirm);
    el.modalCancel.removeEventListener('click', handleCancel);
    if (onConfirm) onConfirm();
  };
  const handleCancel = () => {
    el.modalMask.classList.remove('show');
    el.modalConfirm.removeEventListener('click', handleConfirm);
    el.modalCancel.removeEventListener('click', handleCancel);
    if (onCancel) onCancel();
  };

  el.modalConfirm.addEventListener('click', handleConfirm);
  el.modalCancel.addEventListener('click', handleCancel);
}

el.btnReset.addEventListener('click', () => {
  openModal(
    '重置题库',
    '将清空练习进度，所有错词重新变为新题。<br><span style="color:#fca5a5;font-size:12px">游戏里的错词记录不会被删除。</span>',
    () => {
      try { localStorage.removeItem(EX_KEY); } catch (e) {}
      startExercise();
    }
  );
});

/* =========================================================
   17. 音效
   ========================================================= */
let _actx = null;
function ac() {
  if (!_actx) {
    try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (_actx && _actx.state === 'suspended') _actx.resume();
  return _actx;
}
function beep(freq, dur, type, vol, delay) {
  const c = ac(); if (!c) return;
  const d = delay || 0;
  try {
    const t = c.currentTime + d;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .07, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
function sfxClick() { beep(1150, .03, 'triangle', .05); }

document.addEventListener('click', function once() {
  ac();
  document.removeEventListener('click', once);
});

/* =========================================================
   18. 启动
   ========================================================= */
startExercise();
</script>
