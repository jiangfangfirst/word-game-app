<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
if(!localStorage.getItem('dd_auth')){ location.href='login.html'; }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词学习 · 单词一扫光</title>
<style>
:root {
  --gold: #fbbf24;
  --green: #10b981;
  --blue: #38bdf8;
  --orange: #f97316;
  --red: #ef4444;
  --purple: #a78bfa;
  --bg-0: #0b1220;
  --bg-1: #0f172a;
  --bg-2: #1b2540;
  --line: rgba(148,163,184,.16);
  --txt: #e2e8f0;
  --txt-dim: #94a3b8;
  --txt-mute: #64748b;
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --ease-out: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg-0);
  color: var(--txt);
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
}
body.sheet-open .content-area { overflow: hidden; }

/* ================= HUD ================= */
.hud {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: linear-gradient(180deg, rgba(30,41,59,.98), rgba(15,23,42,.94));
  border-bottom: 1px solid var(--line);
  z-index: 20;
  min-height: 54px;
  overflow-x: auto;
  scrollbar-width: none;
}
.hud::-webkit-scrollbar { display: none; }
.hud-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--gold);
  white-space: nowrap;
  flex: 0 0 auto;
  padding: 4px 10px;
  background: rgba(251,191,36,.12);
  border: 1px solid rgba(251,191,36,.3);
  border-radius: 8px;
}
.hud-stat {
  font-size: 13px;
  color: var(--txt-dim);
  white-space: nowrap;
  flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
  padding: 4px 10px;
  background: rgba(30,41,59,.55);
  border-radius: 8px;
}
.hud-stat b { color: #f8fafc; font-size: 14px; font-weight: 900; }
.hud-stat.streak b { color: #fdba74; }
.hud-stat.today b { color: #7dd3fc; }
.hud-stat.pending b { color: #fbbf24; }
.hud-user {
  margin-left: auto;
  font-size: 13px;
  font-weight: 700;
  color: #e2e8f0;
  white-space: nowrap;
  max-width: 90px;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 0 0 auto;
  padding: 4px 10px;
  background: rgba(30,41,59,.55);
  border-radius: 8px;
}

/* ================= 模式 Tab ================= */
.mode-tabs {
  flex: 0 0 auto;
  display: flex;
  gap: 4px;
  padding: 10px 14px 8px;
  background: rgba(15,23,42,.9);
  border-bottom: 1px solid var(--line);
}
.mode-tab {
  flex: 1;
  padding: 10px 6px;
  border: 1px solid rgba(148,163,184,.18);
  border-radius: 10px;
  background: rgba(30,41,59,.55);
  color: var(--txt-dim);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: all .18s var(--ease-out);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.mode-tab:active { transform: scale(.96); }
.mode-tab.active {
  background: rgba(56,189,248,.14);
  border-color: rgba(56,189,248,.55);
  color: #7dd3fc;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
}

/* ================= 筛选条（新） ================= */
.filter-bar {
  flex: 0 0 auto;
  display: flex;
  gap: 8px;
  padding: 10px 14px;
  background: rgba(15,23,42,.9);
  border-bottom: 1px solid var(--line);
}
.filter-bar-btn {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid rgba(148,163,184,.22);
  background: rgba(30,41,59,.55);
  color: var(--txt);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
  text-align: left;
  min-width: 0;
}
.filter-bar-btn:active { transform: scale(.98); }
.filter-bar-btn .fb-icon {
  font-size: 11px;
  color: var(--txt-dim);
  flex: 0 0 auto;
  transition: transform .15s;
}
.filter-bar-btn .fb-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: .2px;
}
.shuffle-btn {
  flex: 0 0 auto;
  width: 48px;
  height: 46px;
  border-radius: 12px;
  border: 1px solid rgba(148,163,184,.22);
  background: rgba(30,41,59,.55);
  color: var(--txt-dim);
  font-size: 20px;
  cursor: pointer;
  font-family: inherit;
  transition: all .25s var(--ease-spring);
  display: flex;
  align-items: center;
  justify-content: center;
}
.shuffle-btn:active { transform: scale(.92) rotate(180deg); }

/* ================= 内容区 ================= */
.content-area {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  position: relative;
}
.view { display: none; padding: 12px 14px; min-height: 100%; }
.view.active { display: block; }

/* ================= 词表 ================= */
.search-wrap { margin-bottom: 12px; }
.search-input {
  width: 100%;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid rgba(148,163,184,.22);
  background: rgba(30,41,59,.7);
  color: var(--txt);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
.search-input::placeholder { color: var(--txt-mute); }
.search-input:focus { border-color: rgba(56,189,248,.55); }

.word-list { display: flex; flex-direction: column; gap: 8px; }
.word-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  background: rgba(30,41,59,.55);
  border: 1px solid rgba(148,163,184,.1);
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.word-row:active { background: rgba(30,41,59,.9); border-color: rgba(56,189,248,.3); }
.word-row-left { flex: 0 0 auto; min-width: 96px; max-width: 46%; }
.word-row-w {
  font-size: 16px;
  font-weight: 700;
  color: #f1f5f9;
  display: block;
  word-break: break-all;
  line-height: 1.25;
}
.word-row-p {
  font-size: 11px;
  color: var(--txt-mute);
  display: block;
  margin-top: 2px;
  font-family: "Lucida Sans Unicode", sans-serif;
}
.word-row-m {
  flex: 1;
  font-size: 14px;
  color: #cbd5e1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.word-row-status {
  flex: 0 0 auto;
  font-size: 15px;
  line-height: 1;
}
.word-row.status-mastered { border-color: rgba(16,185,129,.2); }
.word-row.status-review { border-color: rgba(167,139,250,.28); }
.word-row.status-known { border-color: rgba(56,189,248,.22); }

.empty-tip {
  padding: 40px 20px;
  text-align: center;
  color: var(--txt-mute);
  font-size: 14px;
  line-height: 1.6;
}

/* ================= 闪卡 ================= */
.card-view-wrap {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: calc(100vh - 300px);
  justify-content: center;
  padding: 8px 0;
}
.card-progress {
  text-align: center;
  font-size: 13px;
  color: var(--txt-dim);
  font-variant-numeric: tabular-nums;
}
.flashcard {
  width: 100%;
  max-width: 420px;
  height: 320px;
  margin: 0 auto;
  perspective: 1200px;
  cursor: pointer;
}
.flashcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.22,1,.36,1);
}
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
.flashcard-front,
.flashcard-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 20px;
  border: 1px solid rgba(148,163,184,.22);
  background: linear-gradient(180deg, #1b2540 0%, #0f172a 100%);
  box-shadow: 0 20px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}
.flashcard-back {
  transform: rotateY(180deg);
  background: linear-gradient(180deg, #14213e 0%, #0a1322 100%);
  border-color: rgba(56,189,248,.28);
}
.fc-word {
  font-size: 40px;
  font-weight: 900;
  color: #f8fafc;
  letter-spacing: 1px;
  word-break: break-all;
  line-height: 1.2;
  margin-bottom: 12px;
}
.fc-hint {
  font-size: 13px;
  color: var(--txt-mute);
  letter-spacing: .5px;
}
.fc-meaning {
  font-size: 26px;
  font-weight: 800;
  color: #7dd3fc;
  margin-bottom: 20px;
  line-height: 1.3;
}
.fc-example {
  font-size: 16px;
  color: #e2e8f0;
  line-height: 1.5;
  margin-bottom: 8px;
}
.fc-example-cn {
  font-size: 13px;
  color: var(--txt-dim);
  line-height: 1.5;
}
.card-actions {
  display: flex;
  gap: 12px;
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
}
.card-btn {
  flex: 1;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid rgba(148,163,184,.22);
  background: rgba(30,41,59,.7);
  color: var(--txt-dim);
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
.card-btn:active { transform: scale(.96); }
.card-btn.unknown {
  border-color: rgba(239,68,68,.32);
  color: #fca5a5;
  background: rgba(239,68,68,.08);
}
.card-btn.known {
  border-color: rgba(16,185,129,.4);
  color: #6ee7b7;
  background: rgba(16,185,129,.1);
}

/* ================= 拼写 ================= */
.spell-wrap { max-width: 560px; margin: 0 auto; padding: 4px 0; }
.spell-progress {
  text-align: center;
  font-size: 13px;
  color: var(--txt-dim);
  font-variant-numeric: tabular-nums;
  margin-bottom: 12px;
}
.spell-q {
  background: rgba(2,6,23,.42);
  border: 1px solid rgba(148,163,184,.12);
  border-radius: 16px;
  padding: 20px;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  margin-bottom: 14px;
}
.sq-cn {
  font-size: 22px;
  font-weight: 800;
  color: #f8fafc;
  margin-bottom: 8px;
  line-height: 1.3;
}
.sq-en {
  font-size: 15px;
  color: var(--txt-dim);
  line-height: 1.7;
  word-break: break-word;
}
.sq-en .blank {
  display: inline-block;
  border-bottom: 3px solid var(--green);
  text-align: center;
  font-weight: 800;
  color: #f8fafc;
  padding: 0 10px;
  min-width: 90px;
  vertical-align: middle;
  min-height: 1.35em;
  letter-spacing: .5px;
}
.sq-en .blank .caret {
  display: inline-block;
  width: 3px;
  height: 1em;
  background: var(--green);
  vertical-align: -2px;
  margin-left: 2px;
  border-radius: 1px;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.spell-toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
.spell-toolbar button {
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid rgba(56,189,248,.32);
  background: rgba(56,189,248,.1);
  color: #7dd3fc;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.spell-toolbar button:active { transform: scale(.95); }
.spell-fb {
  min-height: 0;
  margin-bottom: 0;
  padding: 0 14px;
  border-radius: 10px;
  border: 1px solid transparent;
  font-size: 14px;
  line-height: 1.5;
  opacity: 0;
  overflow: hidden;
  transition: opacity .25s, margin-top .25s, padding .25s;
}
.spell-fb.show {
  opacity: 1;
  padding: 12px 14px;
  margin-top: 8px;
  margin-bottom: 8px;
}
.spell-fb.ok {
  color: #6ee7b7;
  background: rgba(16,185,129,.12);
  border-color: rgba(16,185,129,.35);
}
.spell-fb.err {
  color: #fca5a5;
  background: rgba(239,68,68,.12);
  border-color: rgba(239,68,68,.35);
}
.spell-fb b { color: #fff; }

.keyboard { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
.key {
  position: relative;
  height: 46px;
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(51,65,85,.94), rgba(30,41,59,.98));
  color: #e2e8f0;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(148,163,184,.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 2px 0 rgba(0,0,0,.42);
  transition: transform .08s, background .15s;
  font-family: inherit;
  padding: 0;
}
.key:active {
  transform: translateY(2px);
  background: linear-gradient(180deg, rgba(56,189,248,.42), rgba(30,64,110,.96));
  color: #fff;
}
.key.del { color: #fca5a5; }
.key.space { grid-column: span 2; font-size: 14px; color: var(--txt-dim); }
.key.confirm {
  grid-column: span 5;
  background: linear-gradient(180deg, #38bdf8 0%, #0ea5e9 52%, #0369a1 100%);
  color: #fff;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 2px;
}

/* ================= 选择题 ================= */
.choice-wrap { max-width: 560px; margin: 0 auto; padding: 4px 0; }
.choice-progress {
  text-align: center;
  font-size: 13px;
  color: var(--txt-dim);
  font-variant-numeric: tabular-nums;
  margin-bottom: 12px;
}
.choice-question {
  background: rgba(2,6,23,.42);
  border: 1px solid rgba(148,163,184,.12);
  border-radius: 16px;
  padding: 24px 20px;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  margin-bottom: 14px;
}
.cq-label {
  font-size: 12px;
  color: var(--txt-mute);
  margin-bottom: 10px;
  letter-spacing: 1px;
}
.cq-text {
  font-size: 26px;
  font-weight: 900;
  color: #f8fafc;
  line-height: 1.3;
  word-break: break-word;
}
.cq-text.cn { font-size: 22px; font-weight: 800; }
.choice-options { display: flex; flex-direction: column; gap: 10px; }
.choice-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid rgba(148,163,184,.22);
  background: rgba(30,41,59,.6);
  color: var(--txt);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: all .15s;
  width: 100%;
}
.choice-option:active { transform: scale(.98); }
.choice-option .opt-label {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(148,163,184,.18);
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}
.choice-option .opt-text { flex: 1; min-width: 0; word-break: break-word; }
.choice-option.correct {
  background: rgba(16,185,129,.16);
  border-color: rgba(16,185,129,.65);
  color: #6ee7b7;
  pointer-events: none;
}
.choice-option.correct .opt-label { background: rgba(16,185,129,.9); color: #fff; }
.choice-option.wrong {
  background: rgba(239,68,68,.14);
  border-color: rgba(239,68,68,.55);
  color: #fca5a5;
  pointer-events: none;
}
.choice-option.wrong .opt-label { background: rgba(239,68,68,.9); color: #fff; }
.choice-option.dimmed { opacity: .35; pointer-events: none; }

/* ================= 底部 ================= */
.footer {
  flex: 0 0 auto;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  background: rgba(15,23,42,.96);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.home-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid rgba(148,163,184,.28);
  background: rgba(148,163,184,.08);
  color: var(--txt-dim);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
.home-btn:active { transform: scale(.95); }
.game-btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 999px;
  border: 1px solid rgba(251,191,36,.42);
  background: linear-gradient(180deg, rgba(251,191,36,.18), rgba(217,119,6,.18));
  color: #fde68a;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
  letter-spacing: .3px;
}
.game-btn:active { transform: scale(.97); }
.game-btn:disabled { opacity: .35; cursor: not-allowed; }
.game-btn b { color: #fbbf24; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }

/* ================= 详情 modal ================= */
.detail-mask {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(2,6,23,.82);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .26s ease;
}
.detail-mask.show { opacity: 1; pointer-events: auto; }
.detail-card {
  position: relative;
  width: 100%;
  max-width: 380px;
  background: linear-gradient(180deg, #1b2540 0%, #0f172a 100%);
  border: 1px solid rgba(148,163,184,.22);
  border-radius: 22px;
  padding: 26px 22px 22px;
  box-shadow: 0 24px 60px rgba(0,0,0,.82), inset 0 1px 0 rgba(255,255,255,.06);
  transform: scale(.92) translateY(10px);
  opacity: 0;
  transition: transform .34s var(--ease-spring), opacity .26s ease;
  text-align: center;
}
.detail-mask.show .detail-card { transform: scale(1) translateY(0); opacity: 1; }
.detail-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(148,163,184,.25);
  background: rgba(148,163,184,.08);
  color: var(--txt-dim);
  font-size: 16px;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
}
.detail-close:active { transform: scale(.9); }
.detail-word {
  font-size: 34px;
  font-weight: 900;
  color: #f8fafc;
  margin-bottom: 4px;
  word-break: break-all;
  letter-spacing: .5px;
}
.detail-phonetic {
  font-size: 14px;
  color: var(--txt-mute);
  font-family: "Lucida Sans Unicode", sans-serif;
  margin-bottom: 14px;
}
.detail-speak {
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid rgba(56,189,248,.4);
  background: rgba(56,189,248,.1);
  color: #7dd3fc;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  margin-bottom: 18px;
}
.detail-speak:active { transform: scale(.95); }
.detail-meaning {
  font-size: 20px;
  font-weight: 800;
  color: #7dd3fc;
  margin-bottom: 16px;
  line-height: 1.35;
}
.detail-example {
  padding: 14px 16px;
  border-radius: 12px;
  background: rgba(2,6,23,.5);
  border: 1px solid rgba(148,163,184,.1);
  margin-bottom: 16px;
  text-align: left;
}
.de-en { font-size: 15px; color: #e2e8f0; line-height: 1.55; margin-bottom: 6px; }
.de-cn { font-size: 13px; color: var(--txt-dim); line-height: 1.5; }
.detail-status {
  font-size: 13px;
  color: var(--txt-dim);
  margin-bottom: 16px;
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(30,41,59,.5);
  line-height: 1.5;
}
.detail-status.mastered {

<script>
/* =========================================================
   0. 基础常量与存储
   ========================================================= */
const _auth = localStorage.getItem('dd_auth') || 'guest';
const _userName = (localStorage.getItem('dd_name') || '同学').trim();

const GRADE_MAP = {
  basic: { data: (typeof WORDS_BASIC !== 'undefined' ? WORDS_BASIC : []), label: '基础', type: 'blue' },
  core:  { data: (typeof WORDS_CORE  !== 'undefined' ? WORDS_CORE  : []), label: '核心', type: 'orange' },
  extra: { data: (typeof WORDS_EXTRA !== 'undefined' ? WORDS_EXTRA : []), label: '拓展', type: 'red' }
};

const TIERS = ['basic', 'core', 'extra'];
const TIER_LABEL = { basic: '基础', core: '核心', extra: '拓展' };
const FILTER_LABEL = {
  all: '全部',
  new: '生词本',
  review: '复习仓',
  known: '待验证',
  mastered: '已掌握'
};
const STATUS_ICON = { new: '⚪', review: '🔁', known: '🎯', mastered: '⭐' };

const GAME_KEY = 'dd_vg10_' + _auth;
const STUDY_KEY = 'dd_study_' + _auth;

function loadGameStore() {
  try {
    const raw = localStorage.getItem(GAME_KEY);
    if (raw) {
      const j = JSON.parse(raw);
      return {
        level: j.level || 1,
        mastered: j.mastered || { basic: [], core: [], extra: [] },
        review: j.review || { basic: [], core: [], extra: [] },
        items: j.items || { speaker: 0, highlight: 0, firstLetter: 0 },
        speakerMilestone: j.speakerMilestone || 0,
        totalKills: j.totalKills || 0,
        bestHp: j.bestHp || 100
      };
    }
  } catch (e) {}
  return {
    level: 1,
    mastered: { basic: [], core: [], extra: [] },
    review: { basic: [], core: [], extra: [] },
    items: { speaker: 0, highlight: 0, firstLetter: 0 },
    speakerMilestone: 0,
    totalKills: 0,
    bestHp: 100
  };
}
function saveGameStoreItems(items) {
  try {
    const raw = localStorage.getItem(GAME_KEY);
    let j = {};
    if (raw) { try { j = JSON.parse(raw); } catch (e) {} }
    j.items = items;
    localStorage.setItem(GAME_KEY, JSON.stringify(j));
  } catch (e) {}
}

function loadStudy() {
  try {
    const raw = localStorage.getItem(STUDY_KEY);
    if (raw) {
      const j = JSON.parse(raw);
      return {
        known: j.known || [],
        stats: j.stats || {},
        itemMilestone: j.itemMilestone || 0,
        lastFilter: j.lastFilter || 'new',
        lastTier: j.lastTier || 'basic'
      };
    }
  } catch (e) {}
  return { known: [], stats: {}, itemMilestone: 0, lastFilter: 'new', lastTier: 'basic' };
}
function saveStudy(s) {
  try { localStorage.setItem(STUDY_KEY, JSON.stringify(s)); } catch (e) {}
}

/* =========================================================
   1. 工具函数
   ========================================================= */
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function splitMeanings(m) {
  if (!m) return [];
  return m.split(/[；;]/).map(x => x.trim()).filter(Boolean);
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}
function dateStr(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

/* =========================================================
   2. 音效
   ========================================================= */
let _actx = null;
function ac() {
  if (!_actx) {
    try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (_actx && _actx.state === 'suspended') _actx.resume();
  return _actx;
}
function beep(freq, dur, type, vol, delay) {
  const c = ac(); if (!c) return;
  const d = delay || 0;
  try {
    const t = c.currentTime + d;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .07, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
function sfxKey()  { beep(1500, .035, 'square', .04); }
function sfxFlip() { beep(900, .05, 'triangle', .05); }
function sfxGood() { beep(660, .09, 'sine', .08); beep(990, .14, 'sine', .08, .08); }
function sfxBad()  { beep(220, .12, 'sawtooth', .07); beep(160, .16, 'sawtooth', .07, .1); }
function sfxReward() {
  beep(523, .1, 'triangle', .08);
  beep(784, .12, 'triangle', .08, .1);
  beep(1047, .18, 'triangle', .08, .22);
}

/* =========================================================
   3. 洗牌池（每个 tier 独立、惰性初始化）
   ========================================================= */
const shuffledPools = {};

function getShuffledPool(tier) {
  if (!shuffledPools[tier]) {
    shuffledPools[tier] = shuffle(GRADE_MAP[tier].data);
  }
  return shuffledPools[tier];
}
function reshuffleWords() {
  shuffledPools[currentTier] = shuffle(GRADE_MAP[currentTier].data);
  refreshContent();
  updateFilterBar();
  showToast('🔀', '已换一批', '单词顺序已打乱', '#38bdf8');
}

/* =========================================================
   4. 状态计算
   ========================================================= */
function getWordStatus(word, tier) {
  const s = loadGameStore();
  const st = loadStudy();
  const key = (word.w || '').toLowerCase();
  if ((s.mastered[tier] || []).some(x => x.toLowerCase() === key)) return 'mastered';
  if ((s.review[tier] || []).some(x => x.toLowerCase() === key)) return 'review';
  if ((st.known || []).some(x => x === key)) return 'known';
  return 'new';
}

function filterWords(tier, filter, search) {
  const pool = getShuffledPool(tier);
  const s = loadGameStore();
  const st = loadStudy();
  const mastered = (s.mastered[tier] || []).map(x => x.toLowerCase());
  const review = (s.review[tier] || []).map(x => x.toLowerCase());
  const known = st.known || [];
  const q = (search || '').trim().toLowerCase();

  return pool.filter(w => {
    const key = (w.w || '').toLowerCase();
    if (q) {
      const inW = key.includes(q);
      const inM = (w.m || '').toLowerCase().includes(q);
      if (!inW && !inM) return false;
    }
    switch (filter) {
      case 'all': return true;
      case 'new': return !mastered.includes(key) && !known.includes(key);
      case 'review': return review.includes(key);
      case 'known': return known.includes(key);
      case 'mastered': return mastered.includes(key);
      default: return true;
    }
  });
}

function getFilteredWords() {
  return filterWords(currentTier, currentFilter, currentSearch);
}
function countFiltered(tier, filter) {
  return filterWords(tier, filter, '').length;
}

function calcStreak(stats) {
  const today = todayStr();
  let streak = 0;
  let d = new Date();
  const todayHas = stats[today] && stats[today].newWords && stats[today].newWords.length > 0;
  if (!todayHas) d.setDate(d.getDate() - 1);
  let guard = 0;
  while (guard++ < 3650) {
    const ds = dateStr(d);
    const day = stats[ds];
    if (day && day.newWords && day.newWords.length > 0) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  return streak;
}

/* =========================================================
   5. HUD 更新
   ========================================================= */
function updateFilterBar() {
  const count = getFilteredWords().length;
  document.getElementById('filterBarText').textContent =
    TIER_LABEL[currentTier] + ' · ' + FILTER_LABEL[currentFilter] + ' · ' + count + ' 词';
}

function updateHUD() {
  const st = loadStudy();
  const today = todayStr();
  const todayLearned = (st.stats[today] && st.stats[today].newWords) ? st.stats[today].newWords.length : 0;
  const streak = calcStreak(st.stats);
  const pending = (st.known || []).length;

  document.getElementById('hudStreak').textContent = streak;
  document.getElementById('hudToday').textContent = todayLearned;
  document.getElementById('hudPending').textContent = pending;
  document.getElementById('hudUser').textContent = _userName;

  const vb = document.getElementById('verifyBtn');
  if (vb) {
    vb.disabled = pending === 0;
    vb.innerHTML = '🎮 去游戏检验 <b>' + pending + '</b> 个词';
  }

}

/* =========================================================
   11. 拼写视图
   ========================================================= */
const IRREG = {
  found:'find',sent:'send',bought:'buy',became:'become',won:'win',stole:'steal',caught:'catch',
  fought:'fight',paid:'pay',overslept:'oversleep',got:'get',fell:'fall',made:'make',took:'take',
  gave:'give',did:'do',went:'go',was:'be',were:'be',am:'be',is:'be',are:'be',bled:'bleed',
  cancelled:'cancel',clapped:'clap',nodded:'nod',led:'lead',built:'build',held:'hold',kept:'keep',
  left:'leave',met:'meet',read:'read',said:'say',saw:'see',spoke:'speak',stood:'stand',
  taught:'teach',thought:'think',came:'come',ran:'run',sang:'sing',sat:'sit',swam:'swim',
  wrote:'write',ate:'eat',drank:'drink',drove:'drive',rode:'ride',threw:'throw',wore:'wear',
  broke:'break',chose:'choose',drew:'draw',flew:'fly',grew:'grow',knew:'know',showed:'show',
  told:'tell',understood:'understand',woke:'wake',spent:'spend',felt:'feel',lost:'lose',
  heard:'hear',hurt:'hurt',cut:'cut',put:'put',let:'let',sold:'sell',
  teeth:'tooth',feet:'foot',men:'man',women:'woman',children:'child',leaves:'leaf'
};
function wordVariants(w) {
  w = w.toLowerCase();
  const vs = [w];
  if (w.endsWith('y') && w.length > 1 && !'aeiou'.includes(w[w.length - 2])) {
    vs.push(w.slice(0, -1) + 'ies');
    vs.push(w.slice(0, -1) + 'ied');
  } else if (w.endsWith('e')) {
    vs.push(w + 'd');
    vs.push(w.slice(0, -1) + 'ing');
    vs.push(w + 's');
  } else {
    vs.push(w + 's'); vs.push(w + 'es'); vs.push(w + 'ed'); vs.push(w + 'ing');
  }
  if (w.length >= 3 && 'bcdfghjklmnpqrstvwxz'.includes(w[w.length - 1])
      && 'aeiou'.includes(w[w.length - 2]) && !'aeiou'.includes(w[w.length - 3])) {
    vs.push(w + w[w.length - 1] + 'ed');
    vs.push(w + w[w.length - 1] + 'ing');
  }
  for (const ir in IRREG) { if (IRREG[ir] === w) vs.push(ir); }
  return [...new Set(vs)];
}
function wordPat(w) {
  const wl = w.toLowerCase();
  if (wl === "sb's" || wl === "one's") return ["\\S+'s", '\\S+'];
  if (wl === 'sb' || wl === 'sb.') return ['\\S+'];
  if (wl === 'doing') return ['\\w+ing', '\\b' + w + '\\b'];
  return wordVariants(w).map(v => '\\b' + v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
}
function cartesian(arrays) {
  if (!arrays.length) return [[]];
  const f = arrays[0], rest = arrays.slice(1), rc = cartesian(rest), out = [];
  for (const x of f) for (const r of rc) out.push([x].concat(r));
  return out;
}
function phrasePats(w) {
  if (w.indexOf('...') >= 0) {
    const parts = w.split('...').map(s => s.trim()).filter(Boolean);
    const fp = parts[0].split(' ').map(wordPat);
    const lp = parts[parts.length - 1].split(' ').map(wordPat);
    const out = [];
    for (const fc of cartesian(fp)) for (const lc of cartesian(lp)) {
      out.push('\\b' + fc.join('\\s+') + '\\b(?:\\s+\\S+){0,2}\\s+\\b' + lc.join('\\s+') + '\\b');
    }
    return out;
  }
  const words = w.split(' ');
  if (words.length === 1) return wordPat(words[0]);
  const out = [];
  for (const combo of cartesian(words.map(wordPat))) {
    out.push('\\b' + combo.join('\\s+') + '\\b');
  }
  return out;
}
let _lastSeg = '';
let _lastSegFirst = false;
function makeBlank(en, word) {
  _lastSeg = ''; _lastSegFirst = false;
  const pats = phrasePats(word);
  for (const p of pats) {
    const re = new RegExp(p, 'i');
    const m = re.exec(en);
    if (m) {
      _lastSeg = m[0];
      _lastSegFirst = /^[\s"'()]*$/.test(en.slice(0, m.index));
      const bw = (m[0].length + 2) * 14 + 20;
      const reG = new RegExp(p, 'gi');
      return en.replace(reG, '<span class="blank" id="blankSpace" style="min-width:' + bw + 'px"></span>');
    }
  }
  const bw2 = (word.length + 2) * 14 + 20;
  return en + ' <span class="blank" id="blankSpace" style="min-width:' + bw2 + 'px"></span>';
}
function stripW(w) {
  if (w.length <= 4) return w;
  if (w.endsWith('ying')) return w.slice(0, -3) + 'y';
  if (w.endsWith('ies')) return w.slice(0, -3) + 'y';
  if (w.endsWith('es')) return w.slice(0, -2);
  if (w.endsWith('ed')) return w.slice(0, -2);
  if (w.endsWith('ing')) return w.slice(0, -3);
  if (w.endsWith('s')) return w.slice(0, -1);
  return w;
}
function canonical(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/).filter(Boolean)
    .map(w => IRREG[w] || stripW(w)).join(' ');
}
function isCorrect(typed, w, seg) {
  const tn = (typed || '').toLowerCase().replace(/\s+/g, ' ').trim();
  if (!tn) return false;
  const wn = (w || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const sn = (seg || '').toLowerCase().replace(/\s+/g, ' ').trim();
  if (tn === wn || tn === sn) return true;
  return canonical(tn) === canonical(wn) || canonical(tn) === canonical(sn);
}

function startSpell() {

function renderSpell() {

function updateSpellBlank() {
  const b = document.getElementById('blankSpace');
  if (!b) return;
  if (!spellTyped) {
    b.innerHTML = '<span class="caret"></span>';
    return;
  }
  const ok = isCorrect(spellTyped, spellWord.w, spellSeg);

  b.style.color = ok ? '#10b981' : '#f8fafc';
}

function renderKeyboard() {
  const rows = ['abcdefg', 'hijklmn', 'opqrstu', 'vwxyz'];
  let html = '';
  rows.forEach(r => {
    r.split('').forEach(l => {
      html += '<button class="key" data-key="' + l + '">' + l + '</button>';
    });
  });
  html += '<button class="key space" data-key=" ">空格</button>';
  html += '<button class="key del" data-act="del">⌫</button>';
  html += '<button class="key confirm" data-act="ok">确认</button>';
  document.getElementById('keyboard').innerHTML = html;

  document.querySelectorAll('#keyboard [data-key]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (spellAnswered) return;
      pressSpellChar(btn.dataset.key);
    });
  });
  document.querySelector('#keyboard [data-act="del"]').addEventListener('click', () => {
    if (spellAnswered) return;
    spellTyped = spellTyped.slice(0, -1);
    updateSpellBlank();
    sfxKey();
  });
  document.querySelector('#keyboard [data-act="ok"]').addEventListener('click', () => {
    if (spellAnswered) return;
    submitSpell();
  });
}

function pressSpellChar(ch) {
  if (!spellWord) return;
  const maxLen = spellWord.w.length + 2;
  if (spellTyped.length >= maxLen) return;
  if (ch === ' ') spellTyped += ' ';
  else if (!spellTyped && _lastSegFirst) spellTyped += ch.toUpperCase();
  else spellTyped += ch.toLowerCase();
  updateSpellBlank();
  sfxKey();
}

function submitSpell() {
  if (!spellWord) return;
  const ok = isCorrect(spellTyped, spellWord.w, spellSeg);
  const fb = document.getElementById('spellFb');
  if (ok) {
    spellAnswered = true;
    sfxGood();
    fb.className = 'spell-fb ok show';
    fb.innerHTML = '✓ 正确！<b>' + escapeHtml(spellWord.w) + '</b>';
    const st = loadStudy();
    const t = todayStr();
    if (!st.stats[t]) st.stats[t] = { newWords: [], cards: 0, spell: 0, choice: 0 };
    st.stats[t].spell = (st.stats[t].spell || 0) + 1;
    saveStudy(st);
    setTimeout(() => {
      spellIdx++;
      if (spellIdx >= spellList.length) {
        spellList = shuffle(getFilteredWords());
        spellIdx = 0;
      }
      renderSpell();
    }, 1200);
  } else {
    sfxBad();
    fb.className = 'spell-fb err show';
    fb.innerHTML = '✗ 再试一次　答案：<b>' + escapeHtml(spellWord.w) + '</b>';
  }
}

function skipSpell() {
  if (!spellWord) return;
  const fb = document.getElementById('spellFb');

  fb.innerHTML = '答案：<b>' + escapeHtml(spellWord.w) + '</b>';

   ========================================================= */
function startChoice() {
  choiceList = shuffle(getFilteredWords());
  choiceIdx = 0;
  choiceLocked = false;
  if (choiceTimer) { clearTimeout(choiceTimer); choiceTimer = null; }
  if (!choiceList.length) {
    document.getElementById('choiceQuestion').innerHTML = '<div class="empty-tip">这个筛选下没有单词 🎉</div>';
    document.getElementById('choiceOptions').innerHTML = '';
    document.getElementById('choiceProgress').textContent = '0 / 0';
    return;
  }
  renderChoice();
}

function pickDistractors(correctWord, tier, n) {
  const pool = GRADE_MAP[tier].data;
  const correctMeanings = splitMeanings(correctWord.m);
  const correctW = (correctWord.w || '').toLowerCase();

  const candidates = pool.filter(w => {
    if ((w.w || '').toLowerCase() === correctW) return false;
    const m = splitMeanings(w.m);
    const overlap = m.some(x => correctMeanings.some(y => y.includes(x) || x.includes(y)));
    return !overlap;
  });

  const st = loadStudy();
  const known = st.known || [];
  const fresh = candidates.filter(w => !known.includes((w.w || '').toLowerCase()));
  const src = fresh.length >= n ? fresh : candidates;
  return shuffle(src).slice(0, n);
}

function renderChoice() {
  if (!choiceList.length) return;
  if (choiceIdx >= choiceList.length) choiceIdx = 0;
  choiceLocked = false;
  if (choiceTimer) { clearTimeout(choiceTimer); choiceTimer = null; }

  const w = choiceList[choiceIdx];
  const direction = Math.random() < 0.6 ? 'en2cn' : 'cn2en';
  const distractors = pickDistractors(w, currentTier, 3);

  const all = [w].concat(distractors);
  if (all.length < 4) return;

  const meaningOf = (x) => splitMeanings(x.m)[0] || x.m || '';
  const questionText = direction === 'en2cn' ? w.w : meaningOf(w);
  const questionLabel = direction === 'en2cn' ? '选出正确的中文意思' : '选出正确的英文单词';

  const correctDisplay = direction === 'en2cn' ? meaningOf(w) : w.w;
  const distractorsDisplay = distractors.map(d => direction === 'en2cn' ? meaningOf(d) : d.w);
  const options = shuffle([{ text: correctDisplay, correct: true }].concat(
    distractorsDisplay.map(t => ({ text: t, correct: false }))
  ));

  document.getElementById('choiceProgress').textContent = (choiceIdx + 1) + ' / ' + choiceList.length;
  document.getElementById('choiceQuestion').innerHTML =
    '<div class="cq-label">' + questionLabel + '</div>' +
    '<div class="cq-text' + (direction === 'en2cn' ? '' : ' cn') + '">' + escapeHtml(questionText) + '</div>';

  const optsHtml = options.map((o, i) => {
    const letter = String.fromCharCode(65 + i);
    return '<button class="choice-option" data-idx="' + i + '"' +
      ' data-correct="' + (o.correct ? '1' : '0') + '">' +
      '<span class="opt-label">' + letter + '</span>' +
      '<span class="opt-text">' + escapeHtml(o.text) + '</span>' +
      '</button>';
  }).join('');
  document.getElementById('choiceOptions').innerHTML = optsHtml;

  document.querySelectorAll('.choice-option').forEach(btn => {
    btn.addEventListener('click', () => {
      if (choiceLocked) return;
      submitChoice(parseInt(btn.dataset.idx, 10));
    });
  });

  choiceData = { word: w, direction: direction, options: options };
}

function submitChoice(idx) {
  if (!choiceData || choiceLocked) return;
  choiceLocked = true;
  const isRight = choiceData.options[idx] && choiceData.options[idx].correct;
  const buttons = document.querySelectorAll('.choice-option');

  buttons.forEach((btn, i) => {
    const correct = choiceData.options[i].correct;
    if (correct) btn.classList.add('correct');
    else if (i === idx && !isRight) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });

  const st = loadStudy();
  const t = todayStr();
  if (!st.stats[t]) st.stats[t] = { newWords: [], cards: 0, spell: 0, choice: 0 };
  st.stats[t].choice = (st.stats[t].choice || 0) + 1;
  saveStudy(st);

  if (isRight) {
    sfxGood();
    choiceTimer = setTimeout(() => {
      choiceIdx++;
      if (choiceIdx >= choiceList.length) {
        choiceList = shuffle(getFilteredWords());
        choiceIdx = 0;
      }
      renderChoice();
    }, 900);
  } else {
    sfxBad();
    choiceTimer = setTimeout(() => {
      choiceIdx++;
      if (choiceIdx >= choiceList.length) {
        choiceList = shuffle(getFilteredWords());
        choiceIdx = 0;
      }
      renderChoice();
    }, 1500);
  }
}

  if (status === 'known') {
    const btn = document.createElement('button');
    btn.className = 'detail-btn danger';
    btn.textContent = '撤销「已认识」标记';
    btn.onclick = () => {
      unmarkWordKnown(word, tier);
      closeDetail();
    };
    actions.appendChild(btn);
  } else if (status !== 'mastered') {
    const btn = document.createElement('button');
    btn.className = 'detail-btn primary';
    btn.textContent = '🎯 我认识这个单词';
    btn.onclick = () => {
      markWordKnown(word, tier);
      closeDetail();
    };
    actions.appendChild(btn);
  } else {
    const tip = document.createElement('div');
    tip.className = 'detail-btn';
    tip.style.cursor = 'default';
    tip.style.color = 'var(--txt-mute)';
    tip.textContent = '已在游戏里验证过，无需再标记';
    actions.appendChild(tip);
  }

  document.getElementById('detailMask').classList.add('show');
}

function closeDetail() {
  document.getElementById('detailMask').classList.remove('show');
  detailWord = null;
}
document.getElementById('detailMask').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});
function speakDetail() {
  if (detailWord) speak(detailWord.word.w);
}

/* =========================================================
   14. 标记认识 / 取消
   ========================================================= */
function markWordKnown(word, tier) {
  const st = loadStudy();
  const key = (word.w || '').toLowerCase();
  if (st.known.includes(key)) return;
  st.known.push(key);
  const t = todayStr();
  if (!st.stats[t]) st.stats[t] = { newWords: [], cards: 0, spell: 0, choice: 0 };
  if (!st.stats[t].newWords.includes(key)) st.stats[t].newWords.push(key);
  saveStudy(st);

  updateHUD();
  checkItemReward();

  if (currentMode === 'list') renderList();
}

function unmarkWordKnown(word, tier) {
  const st = loadStudy();
  const key = (word.w || '').toLowerCase();
  const idx = st.known.indexOf(key);
  if (idx > -1) {
    st.known.splice(idx, 1);
    saveStudy(st);
    updateHUD();
    if (currentMode === 'list') renderList();
  }
}

function checkItemReward() {
  const st = loadStudy();
  const known = st.known || [];
  let milestone = st.itemMilestone || 0;
  let gained = 0;
  while (known.length >= milestone + 5) {
    milestone += 5;
    gained++;
  }
  if (gained > 0) {
    const s = loadGameStore();
    const types = ['speaker', 'highlight', 'firstLetter'];
    const names = { speaker: '🎺 喇叭', highlight: '⌨️ 键盘高亮', firstLetter: '💡 首字母提示' };
    const picked = [];
    for (let i = 0; i < gained; i++) {
      const t = types[Math.floor(Math.random() * types.length)];
      s.items[t] = (s.items[t] || 0) + 1;
      picked.push(names[t]);
    }
    saveGameStoreItems(s.items);
    st.itemMilestone = milestone;
    saveStudy(st);
    sfxReward();
    showToast('🎁', '学习奖励！', '获得 ' + picked.join(' + '), '#fbbf24');
  }
}

/* 方案 A：清理已被游戏验证的待验证词 */
function syncPendingVerify() {
  const st = loadStudy();
  const g = loadGameStore();
  const verified = new Set();
  ['basic', 'core', 'extra'].forEach(t => {
    (g.mastered[t] || []).forEach(x => verified.add((x || '').toLowerCase()));
    (g.review[t] || []).forEach(x => verified.add((x || '').toLowerCase()));
  });
  const before = st.known.length;
  st.known = st.known.filter(w => !verified.has(w));
  if (st.known.length !== before) saveStudy(st);
}

function showToast(emoji, title, desc, color) {
  const wrap = document.getElementById('toastWrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.borderColor = color + '80';
  el.innerHTML =
    '<span class="toast-icon">' + emoji + '</span>' +
    '<span class="toast-text">' +
      '<b style="color:' + color + '">' + title + '</b>' +
      '<span>' + desc + '</span>' +
    '</span>';
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3900);
}

/* =========================================================
   15. 跳转
   ========================================================= */
function backToGame() {
  sessionStorage.removeItem('dd_pending_verify');
  location.href = 'index.html';
}
function goToGame() {
  const st = loadStudy();
  const known = st.known || [];
  if (known.length > 0) {
    try { sessionStorage.setItem('dd_pending_verify', JSON.stringify(known)); } catch (e) {}
  }
  location.href = 'index.html';
}

/* =========================================================
   16. 键盘事件（拼写输入）
   ========================================================= */
document.addEventListener('keydown', ev => {
  if (currentMode !== 'spell') return;
  if (!spellWord || spellAnswered) return;
  if (ev.key === 'Backspace') {
    ev.preventDefault();
    spellTyped = spellTyped.slice(0, -1);
    updateSpellBlank(); sfxKey();
  } else if (ev.key === 'Enter') {
    ev.preventDefault();
    submitSpell();
  } else if (ev.key === ' ') {
    ev.preventDefault();
    pressSpellChar(' ');
  } else if (/^[a-zA-Z]$/.test(ev.key)) {
    pressSpellChar(ev.key);
  }
});

document.addEventListener('click', function once() {
  ac();
  document.removeEventListener('click', once);
});

/* =========================================================
   17. 事件绑定与初始化
   ========================================================= */
document.querySelectorAll('.mode-tab').forEach(btn => {
  btn.addEventListener('click', () => switchMode(btn.dataset.mode));
});

(function init() {
  syncPendingVerify();

  const st = loadStudy();
  currentTier = st.lastTier || 'basic';
  currentFilter = st.lastFilter || 'new';

  updateHUD();
  updateReviewTip();
  renderList();
})();
</script>
