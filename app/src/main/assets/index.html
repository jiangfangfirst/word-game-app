<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词夺宝 · 单词一扫光</title>
<style>
:root {
  --gold: #fbbf24;
  --gold-2: #f59e0b;
  --gold-deep: #d97706;
  --green: #10b981;
  --green-2: #059669;
  --blue: #38bdf8;
  --blue-2: #0ea5e9;
  --blue-deep: #0369a1;
  --orange: #f97316;
  --red: #ef4444;
  --purple: #a78bfa;
  --bg-0: #0b1220;
  --bg-1: #0f172a;
  --bg-2: #1b2540;
  --line: rgba(148,163,184,.16);
  --txt: #e2e8f0;
  --txt-dim: #94a3b8;
  --txt-mute: #64748b;
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --ease-out: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg-0);
  color: var(--txt);
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* ================= HUD ================= */
.hud {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  background: linear-gradient(180deg, rgba(30,41,59,.98), rgba(15,23,42,.94));
  border-bottom: 1px solid var(--line);
  z-index: 20;
  min-height: 46px;
}
.level-badge {
  font-size: 13px; font-weight: 800; color: var(--gold);
  background: rgba(251,191,36,.12);
  border: 1px solid rgba(251,191,36,.32);
  border-radius: 8px; padding: 5px 10px; white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  transition: color .3s, background .3s, border-color .3s;
}
.level-badge.review {
  color: #c4b5fd;
  background: rgba(167,139,250,.14);
  border-color: rgba(167,139,250,.42);
}
.lv-total {
  font-size: 10px;
  font-weight: 600;
  color: rgba(251,191,36,.6);
  margin-left: 2px;
  letter-spacing: .1px;
}
.level-badge.review .lv-total { color: rgba(196,181,253,.65); }

.rank-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: auto;
  margin-right: 6px;
  min-height: 22px;
}
.rank-badge .user-name {
  font-size: 12px;
  font-weight: 700;
  color: #e2e8f0;
  letter-spacing: .3px;
  line-height: 1;
  padding-right: 8px;
  margin-right: 2px;
  border-right: 1px solid rgba(148,163,184,.24);
  white-space: nowrap;
  max-width: 96px;
  overflow: hidden;
  text-overflow: ellipsis;
  display: inline-block;
}
.rank-item {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  line-height: 1;
}
.rank-item i {
  font-style: normal;
  font-size: 13px;
  line-height: 1;
  filter: drop-shadow(0 0 6px rgba(251,191,36,.4));
}
.rank-item .rank-num {
  font-size: 10px;
  font-weight: 800;
  color: #cbd5e1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.2px;
}
.rank-item.sun .rank-num { color: #fde68a; }
.rank-item.moon .rank-num { color: #bae6fd; }
.rank-item.star .rank-num { color: #fcd34d; }

.enemy-count {
  font-size: 11px;
  color: var(--txt-dim);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.enemy-count b { color: #f87171; font-size: 13px; }

/* ================= 竞技场 ================= */
.arena {
  flex: 1 1 auto; position: relative; overflow: hidden;
  background: linear-gradient(180deg, #1e1b4b 0%, #312e81 34%, #3b0764 68%, #0f172a 100%);
  transition: background .5s ease;
}
.arena.bg-1 { background: linear-gradient(180deg, #042f2e 0%, #134e4a 34%, #0f766e 66%, #021716 100%); }
.arena.bg-2 { background: linear-gradient(180deg, #2e1065 0%, #4c1d95 34%, #7e22ce 66%, #1a0b33 100%); }
.arena.bg-3 { background: linear-gradient(180deg, #450a0a 0%, #7f1d1d 34%, #9a3412 66%, #1c0a0a 100%); }
.arena.bg-4 { background: linear-gradient(180deg, #082f49 0%, #0c4a6e 34%, #0369a1 66%, #041a29 100%); }
.arena.bg-5 { background: linear-gradient(180deg, #1a2e05 0%, #365314 34%, #4d7c0f 66%, #0b1503 100%); }

.arena::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .85;
  background-image:
    radial-gradient(1.5px 1.5px at 18% 14%, rgba(255,255,255,.75) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 44% 7%, rgba(255,255,255,.5) 50%, transparent 50%),
    radial-gradient(1px 1px at 69% 19%, rgba(255,255,255,.6) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 86% 11%, rgba(255,255,255,.5) 50%, transparent 50%),
    radial-gradient(1px 1px at 10% 29%, rgba(255,255,255,.4) 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 58% 27%, rgba(255,255,255,.5) 50%, transparent 50%),
    radial-gradient(1px 1px at 33% 21%, rgba(255,255,255,.45) 50%, transparent 50%),
    radial-gradient(1px 1px at 77% 33%, rgba(255,255,255,.4) 50%, transparent 50%);
}
.ground {
  position: absolute; left: 0; right: 0; bottom: 0; height: 14%;
  background: linear-gradient(180deg, rgba(49,46,129,.9) 0%, #1e1b4b 55%, #0c0a18 100%);
  border-top: 1px solid rgba(139,92,246,.3);
}
.ground::after {
  content: ''; position: absolute; top: -2px; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(167,139,250,.65), transparent);
}
.path-line {
  position: absolute;
  left: 50%; top: 6%; bottom: 6%; width: 2px;
  background-image: linear-gradient(180deg, rgba(167,139,250,.5) 50%, transparent 50%);
  background-size: 2px 14px;
  transform: translateX(-50%);
  opacity: .35;
  pointer-events: none;
  animation: pathFlow 1.4s linear infinite;
}
@keyframes pathFlow {
  from { background-position-y: 0; }
  to { background-position-y: -14px; }
}

/* ================= Ready / Go ================= */
.ready-overlay {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 34%;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s ease;
}
.ready-overlay.show { opacity: 1; }
.ready-word {
  font-size: clamp(46px, 13vw, 84px);
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(135deg, #38bdf8, #a78bfa, #f472b6);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 8px 28px rgba(56,189,248,.55));
  animation: readyIn .6s cubic-bezier(.34,1.56,.64,1);
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}
.ready-word.go {
  background: linear-gradient(135deg, #fbbf24, #f97316, #ef4444);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 8px 28px rgba(251,191,36,.65));
  animation: goIn .55s cubic-bezier(.34,1.56,.64,1);
}
@keyframes readyIn {
  0% { transform: scale(.4); opacity: 0; }
  60% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes goIn {
  0% { transform: scale(.6) translateY(10px); opacity: 0; }
  55% { transform: scale(1.2) translateY(0); opacity: 1; }
  100% { transform: scale(1.05); opacity: 1; }
}

/* ================= 规则面板 ================= */
.rules-panel {
  position: absolute;
  left: 50%;
  bottom: 23%;
  transform: translateX(-50%);
  z-index: 15;
  display: flex;
  flex-direction: column;
  gap: 5px;
  align-items: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .45s ease;
  max-width: 90%;
}
.rules-panel.show { opacity: 1; }
.rule-line {
  font-size: 11.5px;
  font-weight: 600;
  color: rgba(226,232,240,.9);
  background: rgba(15,23,42,.82);
  border: 1px solid rgba(148,163,184,.22);
  border-radius: 8px;
  padding: 4px 12px;
  white-space: nowrap;
  letter-spacing: .2px;
  opacity: 0;
  animation: ruleIn .42s ease-out forwards;
  box-shadow: 0 2px 10px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.05);
  line-height: 1.4;
}
.rule-line.gold {
  color: rgba(251,191,36,.95);
  border-color: rgba(251,191,36,.34);
  background: rgba(30,24,10,.82);
}
.rule-line.blue {
  color: rgba(125,211,252,.95);
  border-color: rgba(56,189,248,.34);
  background: rgba(8,25,42,.82);
}
@keyframes ruleIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= 宝箱 ================= */
.chest {
  position: absolute;
  width: 78px;
  height: 78px;
  margin-left: -39px;
  top: -100px;
  z-index: 50;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: top, transform, opacity;
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto;
  transition: top .9s cubic-bezier(.34,1.56,.64,1);
}
.chest-icon {
  position: relative;
  font-size: 46px;
  line-height: 1;
  filter: drop-shadow(0 0 16px rgba(251,191,36,.9)) drop-shadow(0 4px 10px rgba(0,0,0,.6));
  z-index: 2;
  transition: transform .15s ease;
}
.chest-aura {
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(251,191,36,.45) 0%, rgba(251,191,36,0) 68%);
  opacity: 0;
  transition: opacity .4s ease;
  pointer-events: none;
}
.chest-ring {
  position: absolute;
  inset: 2px;
  border-radius: 50%;
  border: 2px dashed rgba(251,191,36,.8);
  opacity: 0;
  pointer-events: none;
  transition: opacity .4s ease;
}

.chest.dropping {
  animation: none;
}
.chest.landed {
  animation: chestBob 1.5s ease-in-out infinite;
}
.chest.landed .chest-aura {
  opacity: 1;
  animation: chestAuraPulse 1.4s ease-in-out infinite;
}
.chest.landed .chest-ring {
  opacity: .85;
  animation: chestRingSpin 3s linear infinite;
}
.chest.landed .chest-icon {
  animation: chestIconGlow 1.6s ease-in-out infinite;
}
@keyframes chestBob {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-10px) scale(1.02); }
}
@keyframes chestAuraPulse {
  0%,100% { transform: scale(1); opacity: .7; }
  50% { transform: scale(1.2); opacity: 1; }
}
@keyframes chestRingSpin {
  to { transform: rotate(360deg); }
}
@keyframes chestIconGlow {
  0%,100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(251,191,36,.8)) drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
  50% { transform: scale(1.08); filter: drop-shadow(0 0 24px rgba(251,191,36,1)) drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
}

.chest.opened {
  animation: none;
  pointer-events: none;
  cursor: default;
}
.chest.opened .chest-ring,
.chest.opened .chest-aura {
  animation: none;
  opacity: 0;
  transition: opacity .2s;
}
.chest.opened .chest-icon {
  animation: chestShake .38s ease-in-out;
}
@keyframes chestShake {
  0%,100% { transform: rotate(0) scale(1); }
  20% { transform: rotate(-10deg) scale(1.15); }
  40% { transform: rotate(10deg) scale(1.22); }
  60% { transform: rotate(-8deg) scale(1.28); }
  80% { transform: rotate(8deg) scale(1.35); }
}

.chest.fadeout {
  opacity: 0;
  transition: opacity .55s ease, top .9s ease;
}

.chest.burst {
  animation: chestBurstAnim .5s cubic-bezier(.22,1,.36,1) forwards;
  pointer-events: none;
}
@keyframes chestBurstAnim {
  0% { transform: scale(1); opacity: 1; filter: brightness(1); }
  40% { transform: scale(1.5); opacity: 1; filter: brightness(2.4); }
  100% { transform: scale(2.8); opacity: 0; filter: brightness(3.2); }
}

.burst-star {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  filter: drop-shadow(0 0 10px currentColor);
  animation: burstFly 1.05s cubic-bezier(.22,1,.36,1) forwards;
  will-change: transform, opacity;
}
@keyframes burstFly {
  0% { transform: translate(-50%,-50%) scale(0) rotate(0deg); opacity: 0; }
  18% { transform: translate(-50%,-50%) scale(1.3) rotate(30deg); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.4) rotate(240deg); opacity: 0; }
}

/* ================= 玩家 ================= */
.player {
  position: absolute;
  left: 50%; bottom: 12%;
  margin-left: calc(clamp(26px, 7vw, 42px) / -2);
  line-height: 1;
  z-index: 12;
  filter: drop-shadow(0 0 14px rgba(56,189,248,.6));
  transition: bottom .75s var(--ease-spring);
  animation: playerIdle 1.8s ease-in-out infinite;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}
@keyframes playerIdle {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-5px) scale(1.04); }
}
.player-emoji {
  font-size: clamp(26px, 7vw, 42px);
  line-height: 1;
  display: block;
}
.player::after {
  content: '';
  position: absolute;
  left: 50%; top: -14px;
  margin-left: -7px;
  width: 0; height: 0;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-bottom: 10px solid rgba(56,189,248,.75);
  animation: arrowUp 1s ease-in-out infinite;
}
@keyframes arrowUp {
  0%,100% { transform: translateY(0); opacity: .55; }
  50% { transform: translateY(-6px); opacity: 1; }
}

.shield-aura {
  position: absolute;
  left: 50%; top: 50%;
  width: 78px; height: 78px;
  margin: -39px 0 0 -39px;
  border-radius: 50%;
  border: 2px solid rgba(56,189,248,.85);
  box-shadow: 0 0 26px rgba(56,189,248,.9), inset 0 0 20px rgba(56,189,248,.5);
  display: none;
  pointer-events: none;
  animation: auraPulse 1.2s ease-in-out infinite;
}
.player.shielded .shield-aura { display: block; }
@keyframes auraPulse {
  0%,100% { transform: scale(1); opacity: .72; }
  50% { transform: scale(1.14); opacity: 1; }
}

.shield-timer {
  position: absolute;
  left: 50%;
  top: -6px;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 800;
  color: #7dd3fc;
  background: rgba(15,23,42,.92);
  border: 1px solid rgba(56,189,248,.5);
  border-radius: 999px;
  padding: 1px 5px;
  letter-spacing: .1px;
  box-shadow: 0 1px 6px rgba(0,0,0,.5), 0 0 10px rgba(56,189,248,.35);
  white-space: nowrap;
  display: none;
  pointer-events: none;
  z-index: 3;
  font-variant-numeric: tabular-nums;
  line-height: 1.3;
}
.player.shielded .shield-timer { display: block; }

.item-bag {
  position: absolute;
  left: calc(100% - 2px);
  bottom: 4px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  pointer-events: none;
  z-index: 4;
}
.item-chip {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px 5px;
  border-radius: 6px;
  background: rgba(15,23,42,.92);
  border: 1px solid rgba(56,189,248,.42);
  font-size: 10px;
  font-weight: 800;
  color: #7dd3fc;
  box-shadow: 0 1px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  animation: itemPop .35s var(--ease-spring);
  line-height: 1;
  white-space: nowrap;
}
.item-chip b {
  color: #fbbf24;
  font-size: 10px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
@keyframes itemPop {
  from { transform: scale(.4); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.player-status {
  position: absolute;
  left: 50%;
  top: 100%;
  transform: translateX(-50%);
  margin-top: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  pointer-events: none;
  z-index: 2;
}
.timer-badge {
  font-size: 10px;
  font-weight: 800;
  color: #7dd3fc;
  background: rgba(15,23,42,.92);
  border: 1px solid rgba(56,189,248,.42);
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
  letter-spacing: .3px;
  box-shadow: 0 2px 10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.player-hp {
  width: 108px;
  height: 9px;
  border-radius: 5px;
  background: rgba(2,6,23,.8);
  border: 1px solid rgba(148,163,184,.34);
  overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.5);
}
.player-hp-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #ef4444, #f97316, #22c55e);
  background-size: 108px 100%;
  transition: width .28s var(--ease-out);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
}

.treasure {
  position: absolute;
  left: 50%; bottom: 88%;
  margin-left: calc(clamp(26px, 7vw, 42px) / -2);
  font-size: clamp(26px, 7vw, 42px);
  line-height: 1;
  z-index: 11;
  filter: drop-shadow(0 0 14px rgba(251,191,36,.75));
  animation: treasureGlow 1.6s ease-in-out infinite;
}
@keyframes treasureGlow {
  0%,100% { filter: drop-shadow(0 0 10px rgba(251,191,36,.55)); transform: scale(1); }
  50% { filter: drop-shadow(0 0 24px rgba(251,191,36,1)); transform: scale(1.1); }
}

/* ================= 敌人 ================= */
.enemy {
  position: absolute;
  width: clamp(46px, 13vw, 68px);
  height: clamp(46px, 13vw, 68px);
  margin-left: calc(clamp(46px, 13vw, 68px) / -2);
  margin-bottom: calc(clamp(46px, 13vw, 68px) / -2);
  z-index: 10;
  cursor: pointer;
  transition: transform .12s;
  will-change: left, bottom;
}
.enemy:active { transform: scale(.9); }
.enemy-orb {
  width: 100%; height: 100%;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(20px, 5.5vw, 30px);
  animation: floatY 1.6s ease-in-out infinite;
  position: relative;
}
@keyframes floatY {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.enemy.mystery::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 2px dashed rgba(251,191,36,.85);
  animation: mysteryGlow 1.4s ease-in-out infinite;
  pointer-events: none;
  z-index: 1;
}
@keyframes mysteryGlow {
  0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,0); opacity: .62; }
  50% { box-shadow: 0 0 16px 3px rgba(251,191,36,.55); opacity: 1; }
}

.enemy-tag {
  position: absolute;
  left: 50%;
  bottom: -7px;
  transform: translateX(-50%);
  font-size: clamp(8px, 2.2vw, 10px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: .1px;
  padding: 2px 5px;
  border-radius: 4px;
  white-space: nowrap;
  max-width: 76px;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}
.enemy.blue .enemy-tag {
  color: #dff3ff;
  background: rgba(7,89,133,.88);
  border: 1px solid rgba(125,211,252,.55);
  box-shadow: 0 1px 4px rgba(0,0,0,.45);
}
.enemy.orange .enemy-tag {
  color: #ffe9d4;
  background: rgba(154,52,18,.9);
  border: 1px solid rgba(253,186,116,.55);
  box-shadow: 0 1px 4px rgba(0,0,0,.45);
}
.enemy.red .enemy-tag {
  color: #ffe0e0;
  background: rgba(127,29,29,.92);
  border: 1px solid rgba(252,165,165,.55);
  box-shadow: 0 1px 4px rgba(0,0,0,.45);
}

.enemy.blue .enemy-orb {
  background: radial-gradient(circle at 34% 30%, #7dd3fc, #0ea5e9 55%, #075985);
  box-shadow: 0 0 18px rgba(56,189,248,.75), inset 0 -5px 10px rgba(0,0,0,.35);
  border: 2px solid rgba(186,230,253,.6);
  animation: floatY 1.6s ease-in-out infinite, blueBreathe 1.4s ease-in-out infinite;
}
@keyframes blueBreathe {
  0%,100% { box-shadow: 0 0 14px rgba(56,189,248,.6), inset 0 -5px 10px rgba(0,0,0,.35); }
  50% { box-shadow: 0 0 28px rgba(56,189,248,1), inset 0 -5px 10px rgba(0,0,0,.35); }
}
.enemy.orange .enemy-orb {
  background: radial-gradient(circle at 34% 30%, #fdba74, #f97316 55%, #9a3412);
  box-shadow: 0 0 20px rgba(249,115,22,.8), inset 0 -5px 10px rgba(0,0,0,.35);
  border: 2px solid rgba(254,215,170,.6);
  animation: floatY 1.6s ease-in-out infinite, orangePulse 1s ease-in-out infinite;
}
@keyframes orangePulse {
  0%,100% { box-shadow: 0 0 20px rgba(249,115,22,.8), inset 0 -5px 10px rgba(0,0,0,.35); }
  50% { box-shadow: 0 0 32px rgba(249,115,22,1), inset 0 -5px 10px rgba(0,0,0,.35); }
}
.enemy.red .enemy-orb {
  background: radial-gradient(circle at 34% 30%, #fca5a5, #ef4444 55%, #7f1d1d);
  box-shadow: 0 0 22px rgba(239,68,68,.85), inset 0 -5px 10px rgba(0,0,0,.35);
  border: 2px solid rgba(254,202,202,.6);
  animation: floatY 1.6s ease-in-out infinite, redBreathe 1.3s ease-in-out infinite;
}
@keyframes redBreathe {
  0%,100% { box-shadow: 0 0 22px rgba(239,68,68,.85), inset 0 -5px 10px rgba(0,0,0,.35); }
  50% { box-shadow: 0 0 36px rgba(239,68,68,1), inset 0 -5px 10px rgba(0,0,0,.35); }
}
.enemy.red.aiming .enemy-orb {
  animation: floatY 1.6s ease-in-out infinite, aimPulse .4s ease-in-out infinite;
  filter: brightness(1.35);
}
@keyframes aimPulse {
  0%,100% { box-shadow: 0 0 22px rgba(239,68,68,.85); }
  50% { box-shadow: 0 0 42px rgba(239,68,68,1); }
}
.enemy.die { pointer-events: none; animation: dieBreak .42s forwards; }
@keyframes dieBreak {
  0% { transform: scale(1); opacity: 1; }
  40% { transform: scale(1.4); opacity: .95; filter: brightness(2.2); }
  100% { transform: scale(0); opacity: 0; }
}
.enemy.hit .enemy-orb { animation: hitShake .26s; }
@keyframes hitShake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.aim-line {
  position: absolute;
  height: 2px;
  pointer-events: none;
  z-index: 5;
  transform-origin: 0 50%;
  animation: aimBlink .5s ease-in-out infinite;
  border-radius: 1px;
}
.aim-line.aim-blue   { background: linear-gradient(90deg, rgba(56,189,248,.7), rgba(56,189,248,0)); }
.aim-line.aim-orange { background: linear-gradient(90deg, rgba(249,115,22,.8), rgba(249,115,22,0)); }
.aim-line.aim-red    { background: linear-gradient(90deg, rgba(239,68,68,.9), rgba(239,68,68,0)); height: 2.5px; }
@keyframes aimBlink {
  0%,100% { opacity: .22; }
  50% { opacity: .7; }
}

.proj {
  position: absolute;
  width: 13px; height: 13px;
  margin-left: -6px; margin-bottom: -6px;
  border-radius: 50%;
  z-index: 8;
  pointer-events: none;
}
.proj.blue {
  background: radial-gradient(circle at 35% 32%, #bae6fd, #0ea5e9 60%, #075985);
  box-shadow: 0 0 16px rgba(56,189,248,1);
}
.proj.orange {
  background: radial-gradient(circle at 35% 32%, #fed7aa, #f97316 60%, #9a3412);
  box-shadow: 0 0 16px rgba(249,115,22,1);
  width: 15px; height: 15px;
  margin-left: -7px; margin-bottom: -7px;
}
.proj.red {
  background: radial-gradient(circle at 35% 32%, #fecaca, #ef4444 60%, #7f1d1d);
  box-shadow: 0 0 20px rgba(239,68,68,1);
  width: 16px; height: 16px;
  margin-left: -8px; margin-bottom: -8px;
}
.proj::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: 26px; height: 26px;
  margin: -13px 0 0 -13px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.35) 0%, transparent 70%);
  animation: projGlow .5s ease-in-out infinite;
}
@keyframes projGlow {
  0%,100% { transform: scale(.8); opacity: .5; }
  50% { transform: scale(1.4); opacity: 1; }
}

.shield-shatter {
  position: fixed;
  width: 20px; height: 20px;
  margin: -10px 0 0 -10px;
  border-radius: 50%;
  border: 2px solid rgba(56,189,248,.92);
  box-shadow: 0 0 14px rgba(56,189,248,.8), inset 0 0 10px rgba(56,189,248,.5);
  pointer-events: none;
  z-index: 30;
  animation: shatterRing .5s ease-out forwards;
}
@keyframes shatterRing {
  0% { transform: scale(.4); opacity: 1; }
  100% { transform: scale(3.2); opacity: 0; }
}

.dmg-pop, .heal-pop {
  position: absolute; font-size: 15px; font-weight: 800;
  pointer-events: none; z-index: 30;
  text-shadow: 0 2px 6px rgba(0,0,0,.85);
  animation: popRise .9s ease-out forwards;
  font-variant-numeric: tabular-nums;
}
.dmg-pop { color: #f87171; }
.heal-pop { color: #4ade80; }
@keyframes popRise {
  0% { transform: translateY(0) scale(.6); opacity: 0; }
  25% { transform: translateY(-14px) scale(1.15); opacity: 1; }
  100% { transform: translateY(-54px) scale(1); opacity: 0; }
}
.dmg-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 998;
  background: rgba(220,38,38,0);
}
.dmg-overlay.flash { animation: redFlash .5s ease-in-out; }
@keyframes redFlash {
  0%,100% { background: rgba(220,38,38,0); }
  35% { background: rgba(220,38,38,.35); }
}
.particle {
  position: fixed; pointer-events: none; z-index: 999;
  font-size: 16px; animation: partFly 1s ease-out forwards;
}
@keyframes partFly {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
}

.buff-bar {
  position: absolute;
  left: 10px;
  top: 10px;
  z-index: 40;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}
.buff-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .2px;
  background: rgba(15,23,42,.92);
  border: 1px solid rgba(56,189,248,.45);
  color: #7dd3fc;
  box-shadow: 0 3px 12px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
  white-space: nowrap;
  animation: chipIn .3s var(--ease-spring);
  font-variant-numeric: tabular-nums;
}
.buff-chip.slow {
  border-color: rgba(167,139,250,.5);
  color: #c4b5fd;
}
.buff-chip i {
  font-style: normal;
  font-size: 12px;
  line-height: 1;
}
@keyframes chipIn {
  from { transform: translateX(-14px) scale(.85); opacity: 0; }
  to { transform: translateX(0) scale(1); opacity: 1; }
}

.toast-wrap {
  position: absolute;
  left: 50%;
  top: 15%;
  transform: translateX(-50%);
  z-index: 45;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  width: max-content;
  max-width: 92%;
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 15px;
  border-radius: 13px;
  background: linear-gradient(180deg, rgba(30,41,59,.98), rgba(15,23,42,.98));
  border: 1px solid rgba(251,191,36,.5);
  box-shadow: 0 10px 30px rgba(0,0,0,.62), 0 0 26px rgba(251,191,36,.22), inset 0 1px 0 rgba(255,255,255,.1);
  animation: toastIn .42s var(--ease-spring), toastOut .42s ease-in 4.2s forwards;
  white-space: nowrap;
}
@keyframes toastIn {
  0% { transform: translateY(-14px) scale(.8); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes toastOut {
  to { transform: translateY(-12px) scale(.92); opacity: 0; }
}
.toast-icon {
  font-size: 18px;
  line-height: 1;
  filter: drop-shadow(0 0 8px rgba(251,191,36,.55));
}
.toast-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.toast-text b {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .3px;
  line-height: 1.2;
}
.toast-text span {
  font-size: 10px;
  color: var(--txt-dim);
  line-height: 1.2;
}

.footer {
  flex: 0 0 auto;
  padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px));
  font-size: 11px;
  color: var(--txt-mute);
  text-align: center;
  background: rgba(15,23,42,.96);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.review-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid rgba(167,139,250,.42);
  background: rgba(167,139,250,.12);
  color: #c4b5fd;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all .18s var(--ease-out);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}
.review-btn:hover {
  background: rgba(167,139,250,.22);
  border-color: rgba(167,139,250,.68);
  color: #ddd6fe;
}
.review-btn:active { transform: scale(.95); }
.review-btn b {
  color: #fbbf24;
  font-size: 12px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

.home-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid rgba(56,189,248,.42);
  background: rgba(56,189,248,.12);
  color: #7dd3fc;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all .18s var(--ease-out);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}
.home-btn:hover {
  background: rgba(56,189,248,.22);
  border-color: rgba(56,189,248,.68);
  color: #bae6fd;
}
.home-btn:active { transform: scale(.95); }

/* =========================================================
   挑战弹窗
   ========================================================= */
.modal-mask {
  position: fixed; inset: 0; z-index: 500;
  background: radial-gradient(circle at 50% 100%, rgba(30,27,75,.6) 0%, rgba(2,6,23,.84) 62%);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .26s ease;
}
.modal-mask.show { opacity: 1; pointer-events: auto; }

.modal {
  position: relative;
  width: 100%; max-width: 560px;
  max-height: 92vh;
  overflow-y: auto;
  background: linear-gradient(180deg, #1b2540 0%, #0f172a 52%, #0b1220 100%);
  border-radius: 24px 24px 0 0;
  border: 1px solid rgba(148,163,184,.22);
  border-bottom: none;
  padding: 8px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -24px 70px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06);
  transform: translateY(100%);
  transition: transform .34s var(--ease-out);
  scrollbar-width: none;
}
.modal::-webkit-scrollbar { display: none; }
.modal-mask.show .modal { transform: translateY(0); }

.modal::before {
  content: '';
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  width: 74%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(56,189,248,.65), rgba(167,139,250,.65), transparent);
  pointer-events: none;
}
.modal::after {
  content: '';
  position: absolute; top: -30px; left: 50%;
  transform: translateX(-50%);
  width: 260px; height: 120px;
  background: radial-gradient(ellipse at center, rgba(129,140,248,.16) 0%, transparent 70%);
  pointer-events: none;
}

.modal-grip {
  width: 40px; height: 4px; border-radius: 2px;
  background: rgba(148,163,184,.3);
  margin: 4px auto 14px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
}

.modal-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  position: relative;
}

.word-avatar {
  position: relative;
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex: 0 0 auto;
  animation: avatarFloat 2.4s ease-in-out infinite;
}
@keyframes avatarFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.word-avatar.blue {
  background: radial-gradient(circle at 34% 30%, #7dd3fc, #0ea5e9 55%, #075985);
  box-shadow: 0 0 16px rgba(56,189,248,.7), inset 0 -4px 8px rgba(0,0,0,.35);
  border: 2px solid rgba(186,230,253,.6);
}
.word-avatar.orange {
  background: radial-gradient(circle at 34% 30%, #fdba74, #f97316 55%, #9a3412);
  box-shadow: 0 0 18px rgba(249,115,22,.75), inset 0 -4px 8px rgba(0,0,0,.35);
  border: 2px solid rgba(254,215,170,.6);
}
.word-avatar.red {
  background: radial-gradient(circle at 34% 30%, #fca5a5, #ef4444 55%, #7f1d1d);
  box-shadow: 0 0 18px rgba(239,68,68,.8), inset 0 -4px 8px rgba(0,0,0,.35);
  border: 2px solid rgba(254,202,202,.6);
}

.word-meaning {
  flex: 1;
  min-width: 0;
  font-size: 16px;
  font-weight: 800;
  color: #f1f5f9;
  line-height: 1.35;
  letter-spacing: .2px;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.item-btn {
  position: relative;
  width: 32px; height: 32px;
  border-radius: 9px;
  border: 1px solid rgba(56,189,248,.4);
  background: rgba(56,189,248,.12);
  color: #7dd3fc;
  font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .18s var(--ease-out);
  font-family: inherit;
  flex: 0 0 auto;
  padding: 0;
}
.item-btn:hover {
  background: rgba(56,189,248,.24);
  border-color: rgba(56,189,248,.7);
  transform: scale(1.06);
}
.item-btn:active { transform: scale(.9); }
.item-btn .item-count {
  position: absolute;
  top: -5px; right: -5px;
  min-width: 15px; height: 15px;
  padding: 0 3px;
  border-radius: 8px;
  background: #fbbf24;
  color: #1f1300;
  font-size: 9px;
  font-weight: 900;
  line-height: 15px;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.5);
  font-variant-numeric: tabular-nums;
}
.item-btn.hl-btn {
  border-color: rgba(251,191,36,.45);
  background: rgba(251,191,36,.14);
  color: #fbbf24;
}
.item-btn.hl-btn:hover {
  background: rgba(251,191,36,.26);
  border-color: rgba(251,191,36,.72);
}

.word-pause-hint {
  font-size: 9px;
  color: rgba(148,163,184,.55);
  letter-spacing: .1px;
  line-height: 1.42;
  text-align: right;
  white-space: nowrap;
  font-weight: 400;
  flex: 0 0 auto;
}

.modal-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid rgba(148,163,184,.25);
  background: rgba(148,163,184,.08);
  color: var(--txt-dim);
  font-size: 15px;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex: 0 0 auto;
  transition: all .22s var(--ease-out);
  font-family: inherit;
}
.modal-close:hover {
  background: rgba(239,68,68,.18);
  color: #fca5a5;
  border-color: rgba(239,68,68,.42);
  transform: rotate(90deg);
}
.modal-close:active { transform: rotate(90deg) scale(.9); }

.phon-bubble {
  position: absolute;
  top: 88px;
  left: 50%;
  transform: translateX(-50%) translateY(-6px);
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(56,189,248,.16);
  border: 1px solid rgba(56,189,248,.45);
  color: #7dd3fc;
  font-size: 13px;
  font-family: "Lucida Sans Unicode", "Segoe UI", sans-serif;
  letter-spacing: .3px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .28s ease, transform .28s ease;
  z-index: 10;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,.5), 0 0 18px rgba(56,189,248,.3);
  font-weight: 600;
}
.phon-bubble.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.q-area {
  margin-top: 2px;
  background: rgba(2,6,23,.42);
  border: 1px solid rgba(148,163,184,.1);
  border-radius: 16px;
  padding: 20px 18px;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: inset 0 2px 10px rgba(0,0,0,.28);
  position: relative;
  overflow: hidden;
}
.q-area::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(148,163,184,.18), transparent);
}
.q-en {
  font-size: clamp(16px, 4.4vw, 20px);
  line-height: 1.9;
  color: #e8edf5;
  margin-bottom: 10px;
  word-break: break-word;
  letter-spacing: .2px;
}
.q-cn {
  font-size: clamp(13px, 3.6vw, 14px);
  color: var(--txt-dim);
  margin-bottom: 2px;
}

.blank {
  display: inline-block;
  border-bottom: 2px solid var(--green);
  text-align: center;
  font-weight: 800;
  color: #f8fafc;
  padding: 0 10px;
  min-width: 90px;
  vertical-align: middle;
  min-height: 1.35em;
  letter-spacing: .6px;
  transition: color .15s, border-color .15s;
}
.blank .caret {
  display: inline-block;
  width: 2px;
  height: 1em;
  background: var(--green);
  vertical-align: -2px;
  margin-left: 1px;
  border-radius: 1px;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.feedback {
  margin-top: 14px;
  padding: 11px 15px;
  border-radius: 11px;
  font-size: 13px;
  line-height: 1.6;
  display: none;
}
.feedback.ok, .feedback.err {
  display: block;
  animation: fbIn .3s var(--ease-spring);
}
@keyframes fbIn {
  from { transform: translateY(8px) scale(.97); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}
.feedback.ok {
  background: linear-gradient(135deg, rgba(16,185,129,.16), rgba(5,150,105,.1));
  color: #6ee7b7;
  border: 1px solid rgba(16,185,129,.38);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}
.feedback.err {
  background: linear-gradient(135deg, rgba(239,68,68,.16), rgba(185,28,28,.1));
  color: #fca5a5;
  border: 1px solid rgba(239,68,68,.38);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}
.feedback b { color: #fff; font-size: 14px; letter-spacing: .3px; }

.keyboard {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-top: 18px;
}
.key {
  position: relative;
  height: 44px;
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(51,65,85,.94), rgba(30,41,59,.98));
  color: #e2e8f0;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(148,163,184,.12);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.1),
    inset 0 -1px 0 rgba(0,0,0,.2),
    0 2px 0 rgba(0,0,0,.42),
    0 3px 6px rgba(0,0,0,.25);
  transition: transform .08s ease, box-shadow .08s ease, background .15s ease, color .15s ease, border-color .15s ease;
  font-family: inherit;
  overflow: hidden;
}
.key:active {
  transform: translateY(2px);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.06),
    inset 0 1px 6px rgba(0,0,0,.35),
    0 0 0 rgba(0,0,0,.42);
  background: linear-gradient(180deg, rgba(56,189,248,.42), rgba(30,64,110,.96));
  color: #fff;
  border-color: rgba(56,189,248,.35);
}

.key.hint {
  background: linear-gradient(180deg, rgba(251,191,36,.55), rgba(180,83,9,.85));
  color: #fff;
  border-color: rgba(251,191,36,.72);
  text-shadow: 0 1px 2px rgba(0,0,0,.35);
  animation: keyHintPulse 1.2s ease-in-out infinite;
}
@keyframes keyHintPulse {
  0%,100% { 
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 8px rgba(251,191,36,.4), 0 2px 0 rgba(0,0,0,.4); 
  }
  50% { 
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 18px rgba(251,191,36,.75), 0 2px 0 rgba(0,0,0,.4); 
  }
}
.key.hint:active {
  background: linear-gradient(180deg, rgba(251,191,36,.75), rgba(180,83,9,.95));
}

.key.del {
  background: linear-gradient(180deg, rgba(51,65,85,.94), rgba(30,41,59,.98));
  color: #fca5a5;
  font-size: 17px;
  border: 1px solid rgba(239,68,68,.28);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -1px 0 rgba(0,0,0,.22),
    0 2px 0 rgba(0,0,0,.42),
    0 3px 6px rgba(0,0,0,.25);
}
.key.del:active {
  background: linear-gradient(180deg, rgba(239,68,68,.62), rgba(127,29,29,.95));
  color: #fff;
  border-color: rgba(239,68,68,.62);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.15),
    inset 0 1px 6px rgba(0,0,0,.3),
    0 0 0 rgba(0,0,0,.42);
}

.key.space {
  grid-column: span 2;
  font-size: 12px;
  font-weight: 700;
  color: var(--txt-dim);
  letter-spacing: 1px;
  background: linear-gradient(180deg, rgba(41,54,73,.85), rgba(24,33,48,.95));
}

.key.confirm {
  grid-column: span 6;
  background: linear-gradient(180deg, #38bdf8 0%, #0ea5e9 52%, #0369a1 100%);
  color: #fff;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 2px;
  border: 1px solid rgba(125,211,252,.42);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.42),
    inset 0 -2px 8px rgba(7,45,80,.3),
    0 2px 0 rgba(3,45,80,.9),
    0 6px 20px rgba(56,189,248,.32);
  text-shadow: 0 1px 2px rgba(0,0,0,.32);
}
.key.confirm:active {
  transform: translateY(2px);
  background: linear-gradient(180deg, #0ea5e9 0%, #0369a1 100%);
  border-color: rgba(125,211,252,.35);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 2px 8px rgba(7,45,80,.35),
    0 1px 0 rgba(3,45,80,.9);
}
.key.confirm::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 10px;
  background: linear-gradient(110deg, transparent 34%, rgba(255,255,255,.35) 50%, transparent 66%);
  background-size: 220% 100%;
  background-position: 160% 0;
  animation: shineSweep 3.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes shineSweep {
  0%, 55% { background-position: 160% 0; }
  100% { background-position: -60% 0; }
}

/* =========================================================
   结算弹窗
   ========================================================= */
.result-mask {
  position: fixed; inset: 0; z-index: 600;
  background: radial-gradient(circle at 50% 42%, rgba(30,27,75,.62) 0%, rgba(2,6,23,.9) 72%);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 22px;
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
}
.result-mask.show { opacity: 1; pointer-events: auto; }

.result-card {
  position: relative;
  width: 100%;
  max-width: 362px;
  background: linear-gradient(180deg, #1b2540 0%, #0f172a 58%, #0b1220 100%);
  border: 1px solid rgba(251,191,36,.3);
  border-radius: 24px;
  padding: 30px 24px 24px;
  text-align: center;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.82), 0 0 70px rgba(251,191,36,.14), inset 0 1px 0 rgba(255,255,255,.08);
  transform: scale(.9) translateY(14px);
  opacity: 0;
  transition: transform .46s var(--ease-spring), opacity .32s ease;
}
.result-mask.show .result-card { transform: scale(1) translateY(0); opacity: 1; }
.result-card.lose {
  border-color: rgba(239,68,68,.36);
  box-shadow: 0 30px 80px rgba(0,0,0,.82), 0 0 70px rgba(239,68,68,.18), inset 0 1px 0 rgba(255,255,255,.08);
}
.result-rays {
  position: absolute;
  left: 50%; top: -14%;
  width: 400px; height: 400px;
  margin-left: -200px;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(251,191,36,.13) 0deg 7deg, transparent 7deg 21deg);
  animation: raysSpin 26s linear infinite;
  pointer-events: none;
  opacity: .75;
  -webkit-mask-image: radial-gradient(circle, #000 16%, transparent 68%);
  mask-image: radial-gradient(circle, #000 16%, transparent 68%);
}
.result-card.lose .result-rays {
  background: repeating-conic-gradient(from 0deg, rgba(239,68,68,.11) 0deg 7deg, transparent 7deg 21deg);
}
@keyframes raysSpin { to { transform: rotate(360deg); } }

.result-icon-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
}
.result-icon-glow {
  position: absolute;
  width: 130px; height: 130px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(251,191,36,.45) 0%, transparent 64%);
  animation: glowPulse 2.6s ease-in-out infinite;
}
.result-card.lose .result-icon-glow {
  background: radial-gradient(circle, rgba(239,68,68,.42) 0%, transparent 64%);
}
@keyframes glowPulse {
  0%,100% { transform: scale(1); opacity: .65; }
  50% { transform: scale(1.18); opacity: 1; }
}
.result-icon {
  position: relative;
  font-size: 58px;
  line-height: 1;
  filter: drop-shadow(0 6px 18px rgba(251,191,36,.55));
}
.result-card.lose .result-icon { filter: drop-shadow(0 6px 18px rgba(239,68,68,.55)); }
.result-mask.show .result-icon {
  animation: iconPop .62s var(--ease-spring) .14s both;
}
@keyframes iconPop {
  0% { transform: scale(0) rotate(-28deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.result-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
  padding: 4px 13px;
  border-radius: 999px;
  margin-bottom: 9px;
  background: rgba(251,191,36,.13);
  color: var(--gold);
  border: 1px solid rgba(251,191,36,.36);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
}
.result-card.lose .result-badge {
  background: rgba(239,68,68,.13);
  color: #fca5a5;
  border-color: rgba(239,68,68,.36);
}

.result-title {
  font-size: 19px;
  font-weight: 900;
  margin-bottom: 12px;
  color: #f8fafc;
  letter-spacing: .3px;
}
.result-card.lose .result-title { color: #fecaca; }

.result-stars {
  display: flex;
  justify-content: center;
  gap: 7px;
  margin-bottom: 18px;
  min-height: 26px;
}
.result-star {
  font-size: 23px;
  line-height: 1;
  filter: drop-shadow(0 0 9px rgba(251,191,36,.75));
}
.result-mask.show .result-star {
  animation: starPop .5s var(--ease-spring) both;
}
.result-star.off {
  filter: grayscale(1) brightness(.36);
  opacity: .55;
}
@keyframes starPop {
  0% { transform: scale(0) rotate(-40deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.result-stats {
  display: flex;
  gap: 9px;
  margin-bottom: 20px;
}
.result-stat {
  flex: 1;
  background: linear-gradient(180deg, rgba(148,163,184,.1), rgba(148,163,184,.04));
  border-radius: 12px;
  padding: 11px 6px 9px;
  border: 1px solid rgba(148,163,184,.16);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}
.result-mask.show .result-stat {
  animation: statIn .42s var(--ease-out) both;
}
.result-stat:nth-child(1) { animation-delay: .34s; }
.result-stat:nth-child(2) { animation-delay: .44s; }
.result-stat:nth-child(3) { animation-delay: .54s; }
@keyframes statIn {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.result-stat b {
  display: block;
  font-size: 21px;
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 3px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
}
.result-card.lose .result-stat b { color: #f87171; }
.result-stat span {
  font-size: 10px;
  color: var(--txt-mute);
  letter-spacing: .5px;
}

.result-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn-primary {
  position: relative;
  padding: 14px;
  border: none;
  border-radius: 13px;
  background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 48%, #d97706 100%);
  color: #1f1300;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
  overflow: hidden;
  font-family: inherit;
  border: 1px solid rgba(255,224,140,.4);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -2px 8px rgba(120,53,15,.35),
    0 2px 0 rgba(146,64,14,.9),
    0 8px 26px rgba(245,158,11,.36);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 13px;
  background: linear-gradient(110deg, transparent 34%, rgba(255,255,255,.5) 50%, transparent 66%);
  background-size: 220% 100%;
  background-position: 160% 0;
  animation: shineSweep 3.2s ease-in-out infinite;
  pointer-events: none;
}
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:active {
  transform: translateY(2px);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 2px 8px rgba(120,53,15,.4),
    0 1px 0 rgba(146,64,14,.9);
}
.result-card.lose .btn-primary {
  background: linear-gradient(180deg, #f97316 0%, #ef4444 55%, #dc2626 100%);
  color: #fff;
  border-color: rgba(254,202,202,.4);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -2px 8px rgba(127,29,29,.4),
    0 2px 0 rgba(127,29,29,.9),
    0 8px 26px rgba(239,68,68,.4);
}
.result-card.lose .btn-primary:active {
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 2px 8px rgba(127,29,29,.5),
    0 1px 0 rgba(127,29,29,.9);
}

.btn-ghost {
  padding: 12px;
  border: 1px solid rgba(148,163,184,.28);
  border-radius: 13px;
  background: rgba(148,163,184,.06);
  color: var(--txt-dim);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .5px;
  cursor: pointer;
  font-family: inherit;
  transition: all .18s var(--ease-out);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}
.btn-ghost:hover {
  background: rgba(148,163,184,.13);
  color: #cbd5e1;
  border-color: rgba(148,163,184,.45);
}
.btn-ghost:active { transform: scale(.985); }

/* =========================================================
   开场画面
   ========================================================= */
.splash-mask {
  position: fixed; inset: 0; z-index: 700;
  background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0b1220 70%);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.splash-mask.hide { display: none; }
.splash-card { text-align: center; max-width: 360px; width: 100%; }
.splash-title {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6, #38bdf8);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: flowText 5s linear infinite;
  margin-bottom: 9px;
}
@keyframes flowText {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}
.splash-sub {
  font-size: 12px;
  color: var(--txt-mute);
  margin-bottom: 28px;
  letter-spacing: .8px;
}

.enemy-legend {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 22px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(30,41,59,.6);
  border: 1px solid rgba(148,163,184,.14);
  border-radius: 13px;
  padding: 11px 15px;
  text-align: left;
  transition: border-color .2s, background .2s;
}
.legend-item:hover {
  background: rgba(30,41,59,.85);
  border-color: rgba(148,163,184,.28);
}
.legend-orb {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex: 0 0 auto;
  position: relative;
}
.legend-orb.blue   { background: radial-gradient(circle at 34% 30%, #7dd3fc, #0ea5e9 55%, #075985); box-shadow: 0 0 12px rgba(56,189,248,.7); }
.legend-orb.orange { background: radial-gradient(circle at 34% 30%, #fdba74, #f97316 55%, #9a3412); box-shadow: 0 0 12px rgba(249,115,22,.7); }
.legend-orb.red    { background: radial-gradient(circle at 34% 30%, #fca5a5, #ef4444 55%, #7f1d1d); box-shadow: 0 0 12px rgba(239,68,68,.7); }
.legend-text b {
  display: block;
  font-size: 13px;
  color: var(--txt);
  margin-bottom: 3px;
  font-weight: 800;
}
.legend-text span { font-size: 11px; color: var(--txt-mute); }

.splash-tip {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(251,191,36,.07);
  border: 1px solid rgba(251,191,36,.26);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 22px;
  text-align: left;
}
.splash-tip-ring {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px dashed rgba(251,191,36,.85);
  flex: 0 0 auto;
  animation: ringGlow 1.4s ease-in-out infinite;
}
@keyframes ringGlow {
  0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,0); opacity: .62; }
  50% { box-shadow: 0 0 14px 3px rgba(251,191,36,.55); opacity: 1; }
}
.splash-tip span {
  font-size: 11px;
  color: rgba(251,191,36,.88);
  line-height: 1.5;
}

.splash-start {
  position: relative;
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  background: linear-gradient(180deg, #f59e0b 0%, #d97706 55%, #b45309 100%);
  color: #fff;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 2px;
  cursor: pointer;
  overflow: hidden;
  font-family: inherit;
  border: 1px solid rgba(255,224,140,.35);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -2px 8px rgba(120,53,15,.35),
    0 2px 0 rgba(146,64,14,.9),
    0 8px 26px rgba(245,158,11,.36);
  transition: transform .12s, box-shadow .12s, filter .12s;
}
.splash-start::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: linear-gradient(110deg, transparent 34%, rgba(255,255,255,.45) 50%, transparent 66%);
  background-size: 220% 100%;
  background-position: 160% 0;
  animation: shineSweep 3.4s ease-in-out infinite;
  pointer-events: none;
}
.splash-start:hover { filter: brightness(1.06); }
.splash-start:active {
  transform: translateY(2px);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,.3),
    inset 0 2px 8px rgba(120,53,15,.4),
    0 1px 0 rgba(146,64,14,.9);
}
.splash-reset {
  margin-top: 14px;
  background: none;
  border: none;
  color: #475569;
  font-size: 11px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
  font-family: inherit;
  transition: color .2s;
}
.splash-reset:hover { color: var(--txt-dim); }

/* 退出登录 */
.splash-logout {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 8px;
  background: none;
  border: none;
  color: #64748b;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: .3px;
  transition: color .2s, transform .2s;
}
.splash-logout span {
  font-size: 10px;
  opacity: .75;
}
.splash-logout:hover { color: #f87171; }
.splash-logout:active { transform: scale(.96); }
</style>
</head>
<body>

<!-- ============ HUD ============ -->
<div class="hud">
  <div class="level-badge" id="levelBadge">
    <span id="levelPrefix">第</span> <span id="levelNum">1</span> 关
    <span class="lv-total">/ 共 <span id="totalLevels">20</span> 关</span>
  </div>
  <div class="rank-badge" id="rankBadge"></div>
  <div class="enemy-count">本关剩 <b id="enemyLeft">20</b></div>
</div>

<!-- ============ 竞技场 ============ -->
<div class="arena" id="arena">
  <div class="path-line"></div>
  <div class="ground"></div>
  <div id="entityLayer"></div>

  <div class="buff-bar" id="buffBar"></div>
  <div class="toast-wrap" id="toastWrap"></div>
  <div class="ready-overlay" id="readyOverlay"></div>
  <div class="rules-panel" id="rulesPanel"></div>

  <div class="treasure" id="treasure">🏆</div>

  <div class="player" id="player">
    <div class="shield-aura"></div>
    <span class="shield-timer" id="shieldTimer">30s</span>
    <span class="player-emoji">🧑‍🚀</span>
    <div class="item-bag" id="itemBag"></div>
    <div class="player-status">
      <span class="timer-badge" id="timerBadge">用时0秒</span>
      <div class="player-hp"><div class="player-hp-fill" id="playerHpFill"></div></div>
    </div>
  </div>
</div>

<div class="footer">
  <button class="home-btn" onclick="backHome()" aria-label="返回首页">
    <span>🏠 返回首页</span>
  </button>
  <button class="review-btn" onclick="startReview()" aria-label="打开复习仓">
    <span>📚 复习仓</span>
    <b id="reviewCount">0</b>
  </button>
</div>

<!-- ============ 挑战弹窗 ============ -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox">
    <div class="modal-grip"></div>

    <div class="modal-top">
      <div class="word-avatar blue" id="wordAvatar">
        <span id="avatarEmoji">👾</span>
      </div>
      <div class="word-meaning" id="wordMeaning">保护</div>
      <button class="item-btn" id="speakerBtn" onclick="useSpeaker()" style="display:none" aria-label="播放读音">
        🎺<span class="item-count" id="speakerCount">0</span>
      </button>
      <button class="item-btn hl-btn" id="highlightBtn" onclick="useHighlight()" style="display:none" aria-label="高亮字母">
        ⌨️<span class="item-count" id="highlightCount">0</span>
      </button>
      <div class="word-pause-hint">敌人暂停攻击中<br>请放心填单词</div>
      <button class="modal-close" onclick="closeChallenge()" aria-label="关闭">✕</button>
    </div>

    <div class="phon-bubble" id="phonBubble"></div>

    <div class="q-area" id="qArea"></div>

    <div class="feedback" id="fb"></div>

    <div class="keyboard" id="keyboard"></div>
  </div>
</div>

<!-- ============ 开场 ============ -->
<div class="splash-mask" id="splashMask">
  <div class="splash-card">
    <div class="splash-title">单词夺宝</div>
    <div class="splash-sub">多多好学出品 @2026 版权所有</div>

    <div class="enemy-legend">
      <div class="legend-item">
        <div class="legend-orb blue">👾</div>
        <div class="legend-text"><b>蓝色 · 基础单词</b><span>快箭骚扰 · 伤害最低（4）　击破回血 +6</span></div>
      </div>
      <div class="legend-item">
        <div class="legend-orb orange">👹</div>
        <div class="legend-text"><b>橙色 · 核心单词</b><span>中速火球 · 伤害中等（6）　击破回血 +10</span></div>
      </div>
      <div class="legend-item">
        <div class="legend-orb red">💀</div>
        <div class="legend-text"><b>红色 · 拓展单词</b><span>慢箭狙击 · 伤害最高（8）　击破回血 +14</span></div>
      </div>
    </div>

    <div class="splash-tip">
      <div class="splash-tip-ring"></div>
      <span>带金色虚线圈的单词藏有惊喜或意外，游戏途中还会随机掉落宝箱。</span>
    </div>

    <button class="splash-start" onclick="startGame()">开始闯关</button>
    <button class="splash-reset" onclick="resetProgress()">重置进度</button>
    <button class="splash-logout" onclick="logout()">
      <span>⏻</span> 退出登录
    </button>
  </div>
</div>

<!-- ============ 结算 ============ -->
<div class="result-mask" id="resultMask">
  <div class="result-card" id="resultCard">
    <div class="result-rays"></div>

    <div class="result-icon-wrap">
      <div class="result-icon-glow"></div>
      <div class="result-icon" id="resultIcon">🏆</div>
    </div>

    <div class="result-badge" id="resultBadge">完美通关</div>
    <div class="result-title" id="resultTitle">第 1 关 · 夺宝成功</div>
    <div class="result-stars" id="resultStars"></div>

    <div class="result-stats">
      <div class="result-stat"><b id="rsKill">0</b><span>击破</span></div>
      <div class="result-stat"><b id="rsAcc">0%</b><span>正确率</span></div>
      <div class="result-stat"><b id="rsHp">100</b><span>剩余血量</span></div>
    </div>

    <div class="result-actions">
      <button class="btn-primary" id="resultMainBtn">下一关</button>
      <button class="btn-ghost" id="resultSubBtn">重玩本关</button>
    </div>
  </div>

const IRREG = {
  found:'find',sent:'send',bought:'buy',became:'become',won:'win',stole:'steal',caught:'catch',
  fought:'fight',paid:'pay',overslept:'oversleep',got:'get',fell:'fall',made:'make',took:'take',
  gave:'give',did:'do',went:'go',was:'be',were:'be',am:'be',is:'be',are:'be',bled:'bleed',
  cancelled:'cancel',clapped:'clap',nodded:'nod',led:'lead',built:'build',held:'hold',kept:'keep',
  left:'leave',met:'meet',read:'read',said:'say',saw:'see',spoke:'speak',stood:'stand',
  taught:'teach',thought:'think',came:'come',ran:'run',sang:'sing',sat:'sit',swam:'swim',
  wrote:'write',ate:'eat',drank:'drink',drove:'drive',rode:'ride',threw:'throw',wore:'wear',
  broke:'break',chose:'choose',drew:'draw',flew:'fly',grew:'grow',knew:'know',showed:'show',
  told:'tell',understood:'understand',woke:'wake',spent:'spend',felt:'feel',lost:'lose',
  heard:'hear',hurt:'hurt',cut:'cut',put:'put',let:'let',sold:'sell',
  teeth:'tooth',feet:'foot',men:'man',women:'woman',children:'child',leaves:'leaf'
};

function wordVariants(w) {
  w = w.toLowerCase();
  const vs = [w];
  if (w.endsWith('y') && w.length > 1 && !'aeiou'.includes(w[w.length - 2])) {
    vs.push(w.slice(0, -1) + 'ies');
    vs.push(w.slice(0, -1) + 'ied');
  } else if (w.endsWith('e')) {
    vs.push(w + 'd');
    vs.push(w.slice(0, -1) + 'ing');
    vs.push(w + 's');
  } else {
    vs.push(w + 's');
    vs.push(w + 'es');
    vs.push(w + 'ed');
    vs.push(w + 'ing');
  }
  if (w.length >= 3 && 'bcdfghjklmnpqrstvwxz'.includes(w[w.length - 1])
      && 'aeiou'.includes(w[w.length - 2]) && !'aeiou'.includes(w[w.length - 3])) {
    vs.push(w + w[w.length - 1] + 'ed');
    vs.push(w + w[w.length - 1] + 'ing');
  }
  for (const ir in IRREG) { if (IRREG[ir] === w) vs.push(ir); }
  return [...new Set(vs)];
}

function wordPat(w) {
  const wl = w.toLowerCase();
  if (wl === "sb's" || wl === "one's") return ["\\S+'s", '\\S+'];
  if (wl === 'sb' || wl === 'sb.') return ['\\S+'];
  if (wl === 'doing') return ['\\w+ing', '\\b' + w + '\\b'];
  return wordVariants(w).map(v => '\\b' + v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
}

function cartesian(arrays) {
  if (!arrays.length) return [[]];
  const f = arrays[0], rest = arrays.slice(1), rc = cartesian(rest), out = [];
  for (const x of f) for (const r of rc) out.push([x].concat(r));
  return out;
}

function phrasePats(w) {
  if (w.indexOf('...') >= 0) {
    const parts = w.split('...').map(s => s.trim()).filter(Boolean);
    const fp = parts[0].split(' ').map(wordPat);
    const lp = parts[parts.length - 1].split(' ').map(wordPat);
    const out = [];
    for (const fc of cartesian(fp)) for (const lc of cartesian(lp)) {
      out.push('\\b' + fc.join('\\s+') + '\\b(?:\\s+\\S+){0,2}\\s+\\b' + lc.join('\\s+') + '\\b');
    }
    return out;
  }
  const words = w.split(' ');
  if (words.length === 1) return wordPat(words[0]);
  const out = [];
  for (const combo of cartesian(words.map(wordPat))) {
    out.push('\\b' + combo.join('\\s+') + '\\b');
  }
  return out;
}

let _lastSeg = '';
let _lastSegFirst = false;

function makeBlank(en, word) {
  _lastSeg = '';
  _lastSegFirst = false;
  const pats = phrasePats(word);
  for (const p of pats) {
    const re = new RegExp(p, 'i');
    const m = re.exec(en);
    if (m) {
      _lastSeg = m[0];
      _lastSegFirst = /^[\s"'()]*$/.test(en.slice(0, m.index));
      const bw = (m[0].length + 2) * 14 + 20;
      const reG = new RegExp(p, 'gi');
      return en.replace(reG, '<span class="blank" id="blankSpace" style="min-width:' + bw + 'px"></span>');
    }
  }
  const bw2 = (word.length + 2) * 14 + 20;
  return en + ' <span class="blank" id="blankSpace" style="min-width:' + bw2 + 'px"></span>';
}

function stripW(w) {
  if (w.length <= 4) return w;
  if (w.endsWith('ying')) return w.slice(0, -3) + 'y';
  if (w.endsWith('ies')) return w.slice(0, -3) + 'y';
  if (w.endsWith('es')) return w.slice(0, -2);
  if (w.endsWith('ed')) return w.slice(0, -2);
  if (w.endsWith('ing')) return w.slice(0, -3);
  if (w.endsWith('s')) return w.slice(0, -1);
  return w;
}

function canonical(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ')
    .split(/\s+/).filter(Boolean)
    .map(w => IRREG[w] || stripW(w)).join(' ');
}

function isCorrect(typed, w, seg) {
  const tn = (typed || '').toLowerCase().replace(/\s+/g, ' ').trim();
  if (!tn) return false;
  const wn = (w || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const sn = (seg || '').toLowerCase().replace(/\s+/g, ' ').trim();
  if (tn === wn || tn === sn) return true;
  return canonical(tn) === canonical(wn) || canonical(tn) === canonical(sn);
}

/* =========================================================
   3. 音效系统
   ========================================================= */
let _actx = null;
function ac() {
  if (!_actx) {
    try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (_actx && _actx.state === 'suspended') _actx.resume();
  return _actx;
}

function beep(freq, dur, type, vol, delay) {
  const c = ac(); if (!c) return;
  const d = delay || 0;
  try {
    const t = c.currentTime + d;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .07, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}

function sweep(f1, f2, dur, type, vol) {
  const c = ac(); if (!c) return;
  try {
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || .06, t + .02);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickWords(pool, tier, n) {
  const mastered = (loadStore().mastered[tier] || []);
  const fresh = pool.filter(w => !mastered.includes((w.w || '').toLowerCase()));
  const a = shuffle(fresh);
  const result = [];
  while (result.length < n && a.length) result.push(a.pop());

  if (!result.length) {
    const b = shuffle(pool);
    while (result.length < n && b.length) result.push(b.pop());
  }
  return result;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function placeEnemies(list) {
  const cols = [12, 31, 50, 69, 88];
  const rows = [78, 66, 54, 42];

  list.forEach((e, i) => {
    const r = Math.floor(i / 5);
    const c = i % 5;
    const cfg = ENEMY_CFG[e.type];

    e.id = i;
    e.x = cols[c];
    e.y = rows[r % rows.length];
    e.homeX = e.x;
    e.homeY = e.y;

    e.alive = true;
    e.el = null;
    e.aimLine = null;

    e.speed = cfg.speed * (0.85 + Math.random() * 0.35);
    e.tx = e.x;
    e.ty = e.y;
    e.wanderTimer = 0;

    e.fireTimer = cfg.fireMin * (0.5 + Math.random() * 0.8);
    e.nextAimed = Math.random() < cfg.aimProb;
    e.aimingPlayer = false;
  });
}

function buildLevel(levelNum) {
  const blueWords   = pickWords(GRADE_MAP.basic.data, 'basic', COMPOSITION.blue);
  const orangeWords = pickWords(GRADE_MAP.core.data,  'core',  COMPOSITION.orange);
  const redWords    = pickWords(GRADE_MAP.extra.data, 'extra', COMPOSITION.red);

  const list = [];
  blueWords.forEach(w   => list.push({ word: w, type: 'blue',   tier: 'basic',  mystery: false }));
  orangeWords.forEach(w => list.push({ word: w, type: 'orange', tier: 'core',   mystery: false }));
  redWords.forEach(w    => list.push({ word: w, type: 'red',    tier: 'extra',  mystery: false }));

  const mixed = shuffle(list);

  const mysteryCount = Math.min(6, Math.max(3, Math.round(mixed.length * MYSTERY_RATE)));
  const mysteryIdx = new Set();
  while (mysteryIdx.size < mysteryCount && mysteryIdx.size < mixed.length) {
    mysteryIdx.add(Math.floor(Math.random() * mixed.length));
  }
  mysteryIdx.forEach(i => { mixed[i].mystery = true; });

  placeEnemies(mixed);
  return mixed;
}

function buildReviewLevel(levelNum, items) {
  const start = (levelNum - 1) * TOTAL_PER_LEVEL;
  const slice = items.slice(start, start + TOTAL_PER_LEVEL);
  if (!slice.length) return [];

  const list = slice.map(x => ({
    word: x.word,
    type: x.type,
    tier: x.tier,
    mystery: false
  }));

  const mixed = shuffle(list);
  placeEnemies(mixed);
  return mixed;
}

function pickReplacementWord(tier, oldWord) {
  const pool = (GRADE_MAP[tier] && GRADE_MAP[tier].data) || [];
  if (!pool.length) return null;

  const mastered = (loadStore().mastered[tier] || []);
  const used = new Set();
  G.enemies.forEach(en => {
    if (en.alive && en.word && en.word.w) used.add(en.word.w.toLowerCase());
  });
  used.add((oldWord || '').toLowerCase());

  const candidates = pool.filter(w => {
    const k = (w.w || '').toLowerCase();
    return !used.has(k) && !mastered.includes(k);
  });

  if (candidates.length) {
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  const fallback = pool.filter(w => !used.has((w.w || '').toLowerCase()));
  if (fallback.length) {
    return fallback[Math.floor(Math.random() * fallback.length)];
  }
  return null;
}

function pickReplacementWordReview(currentWord) {
  const items = getReviewItems();
  const cur = (currentWord || '').toLowerCase();
  const candidates = items.filter(x => (x.word.w || '').toLowerCase() !== cur);
  if (!candidates.length) return null;
  return candidates[Math.floor(Math.random() * candidates.length)].word;
}

function syncEntities() {
  const W = arena.clientWidth || 1;
  const H = arena.clientHeight || 1;
  const px = PLAYER_X / 100 * W;
  const py = (1 - PLAYER_Y / 100) * H;

  for (const e of G.enemies) {
    if (!e.el) continue;
    if (!e.alive) {
      e.el.style.display = 'none';
      if (e.aimLine) e.aimLine.style.display = 'none';
      continue;
    }

    e.el.style.left = e.x + '%';
    e.el.style.bottom = e.y + '%';
    e.el.classList.toggle('aiming', e.aimingPlayer);

    if (e.aimLine) {
      if (e.aimingPlayer) {
        const ex = e.x / 100 * W;
        const ey = (1 - e.y / 100) * H;
        const lx = px - ex, ly = py - ey;
        const len = Math.hypot(lx, ly);
        const ang = Math.atan2(ly, lx) * 180 / Math.PI;
        e.aimLine.style.left = ex + 'px';
        e.aimLine.style.top = ey + 'px';
        e.aimLine.style.width = len + 'px';
        e.aimLine.style.transform = 'rotate(' + ang + 'deg)';
        e.aimLine.style.display = 'block';
      } else {
        e.aimLine.style.display = 'none';
      }
    }
  }

  for (const p of G.projectiles) {
    if (!p.el) continue;
    p.el.style.left = p.x + '%';
    p.el.style.bottom = p.y + '%';
  }
}

function formatTime(ms) {
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return m > 0 ? ('用时' + m + '分' + s + '秒') : ('用时' + s + '秒');
}

function updateTimerDisplay() {
  const sec = Math.floor(G.elapsed / 1000);
  if (sec === _lastTimerSec) return;
  _lastTimerSec = sec;
  const el = document.getElementById('timerBadge');
  if (el) el.textContent = formatTime(G.elapsed);
}

function updateBuffBar() {
  const now = performance.now();
  const items = [];
  if (now < G.shieldUntil) {
    items.push({ cls: '', icon: '🛡️', text: '护盾 ' + Math.ceil((G.shieldUntil - now) / 1000) + 's' });
  }
  if (now < G.slowUntil) {
    items.push({ cls: 'slow', icon: '🐢', text: '敌缓 ' + Math.ceil((G.slowUntil - now) / 1000) + 's' });
  }

  const playerEl = document.getElementById('player');
  if (playerEl) playerEl.classList.toggle('shielded', now < G.shieldUntil);

  const st = document.getElementById('shieldTimer');
  if (st) {
    if (now < G.shieldUntil) {
      st.textContent = Math.ceil((G.shieldUntil - now) / 1000) + 's';
    } else {
      st.textContent = '';
    }
  }

  const key = items.map(i => i.text).join('|');
  if (key === _lastBuffKey) return;
  _lastBuffKey = key;

  const bar = document.getElementById('buffBar');
  if (!bar) return;
  bar.innerHTML = items.map(i =>
    '<div class="buff-chip ' + i.cls + '"><i>' + i.icon + '</i>' + i.text + '</div>'
  ).join('');
}

function loop(ts) {
  const dt = Math.min((ts - (G.lastTs || ts)) / 1000, 0.05);
  G.lastTs = ts;

  if (G.running && !G.paused && !G.over) {
    G.elapsed = performance.now() - G.startTime;
    updateTimerDisplay();
    updateBuffBar();
  }

  if (G.running && !G.paused && !G.preparing && !G.over) {
    update(dt);
  }
  syncEntities();
  requestAnimationFrame(loop);
}

function pickWanderTarget(e) {
  const cfg = ENEMY_CFG[e.type];
  if (e.type === 'blue') {
    e.tx = clamp(e.homeX + (Math.random() - 0.5) * 2 * cfg.wanderR, 8, 92);
    e.ty = clamp(e.homeY + (Math.random() - 0.5) * 12, cfg.yMin, cfg.yMax);
  } else {
    e.tx = clamp(8 + Math.random() * 84, 8, 92);
    e.ty = clamp(cfg.yMin + Math.random() * (cfg.yMax - cfg.yMin), cfg.yMin, cfg.yMax);
  }
}

function wanderEnemy(e, dt) {
  const dx = e.tx - e.x;
  const dy = e.ty - e.y;
  const d = Math.hypot(dx, dy);

  if (d < 1.2) {
    e.wanderTimer += dt;
    if (e.wanderTimer > 0.35) {
      e.wanderTimer = 0;
      pickWanderTarget(e);
    }
  } else {
    const sp = Math.min(e.speed * dt, d);
    e.x += dx / d * sp;
    e.y += dy / d * sp;
    e.wanderTimer = 0;
  }
  e.x = clamp(e.x, 6, 94);
  e.y = clamp(e.y, 36, 86);
}

function update(dt) {
  const now = performance.now();
  const slowOn = now < G.slowUntil;
  const shieldOn = now < G.shieldUntil;
  const fireFactor = slowOn ? 0.42 : 1;

  for (const e of G.enemies) {
    if (!e.alive) continue;

    wanderEnemy(e, dt);

    if (G.rulePhase) continue;

    const cfg = ENEMY_CFG[e.type];
    e.fireTimer -= dt * fireFactor;
    e.aimingPlayer = e.nextAimed && e.fireTimer < 0.8 && e.fireTimer > 0;

    if (e.fireTimer <= 0) {
      spawnProjectile(e, e.nextAimed, cfg.projSpeed, cfg.projDmg, e.type);
      e.fireTimer = cfg.fireMin + Math.random() * (cfg.fireMax - cfg.fireMin);
      e.nextAimed = Math.random() < cfg.aimProb;
      e.aimingPlayer = false;
    }
  }

  for (const p of G.projectiles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const dx = p.x - PLAYER_X;
    const dy = p.y - PLAYER_Y;
    const dist = Math.hypot(dx, dy);

    if (shieldOn && dist < 8) {
      p.dead = true;
      spawnShieldShatter(p.x, p.y);
      sfxShieldBreak();
    } else if (dist < 4.5) {
      p.dead = true;
      damagePlayer(p.dmg, p);
    }

    if (p.x < -12 || p.x > 112 || p.y < -12 || p.y > 112) p.dead = true;
  }

  G.projectiles = G.projectiles.filter(p => {
    if (p.dead) { if (p.el) p.el.remove(); return false; }
    return true;
  });

  if (!G.rulePhase && !G.chestActive && G.nextChestTime > 0 && now > G.nextChestTime) {
    spawnChest();
  }
}

function spawnProjectile(fromEnemy, aimed, speed, dmg, type) {
  let tx, ty;
  if (aimed) {
    tx = PLAYER_X;
    ty = PLAYER_Y;
  } else {
    tx = clamp(fromEnemy.x + (Math.random() - 0.5) * 110, -15, 115);
    ty = -12;
  }

  const dx = tx - fromEnemy.x;
  const dy = ty - fromEnemy.y;
  const d = Math.hypot(dx, dy) || 1;

  const p = {
    x: fromEnemy.x,
    y: fromEnemy.y,
    vx: dx / d * speed,
    vy: dy / d * speed,
    dmg: dmg || 6,
    dead: false,
    el: null
  };

  const el = document.createElement('div');
  el.className = 'proj ' + type;
  el.style.left = p.x + '%';
  el.style.bottom = p.y + '%';
  arena.appendChild(el);
  p.el = el;
  G.projectiles.push(p);

  beep(type === 'red' ? 480 : type === 'orange' ? 700 : 950, .05, 'square', .03);
}

function showToast(emoji, name, desc, color) {

function randomBg() {
  let next = G.currentBg;
  let guard = 0;
  while (next === G.currentBg && guard++ < 20) {
    next = BG_LIST[Math.floor(Math.random() * BG_LIST.length)];
  }
  arena.classList.remove.apply(arena.classList, BG_LIST);
  arena.classList.add(next);
  G.currentBg = next;
}

function reviveEnemies(exclude) {
  const dead = G.enemies.filter(e => !e.alive && e !== exclude);
  if (!dead.length) return 0;

  const n = Math.min(dead.length, 2 + Math.floor(Math.random() * 2));
  const picked = shuffle(dead).slice(0, n);

  picked.forEach(e => {
    e.alive = true;
    e.mystery = false;
    e.x = clamp(10 + Math.random() * 80, 10, 90);
    e.y = clamp(42 + Math.random() * 36, 42, 78);
    e.tx = e.x;
    e.ty = e.y;
    e.wanderTimer = 0;
    e.aimingPlayer = false;
    e.fireTimer = ENEMY_CFG[e.type].fireMin * (0.7 + Math.random() * 0.6);

    if (e.el) {
      e.el.classList.remove('die', 'mystery', 'hit');
      e.el.style.display = '';
      e.el.style.left = e.x + '%';
      e.el.style.bottom = e.y + '%';
      void e.el.offsetWidth;
    }
    if (e.aimLine) e.aimLine.style.display = 'none';

    spawnParticles(e.x, e.y, '#f59e0b', 10);
  });

  updateHUD();
  return picked.length;
}

function triggerMystery(enemy) {
  let pool = MYSTERY_EFFECTS.slice();
  if (!G.enemies.some(e => !e.alive && e !== enemy)) {
    pool = pool.filter(x => x.id !== 'revive');
  }

  const eff = pool[Math.floor(Math.random() * pool.length)];
  const now = performance.now();

  switch (eff.id) {
    case 'shield':
      G.shieldUntil = Math.max(G.shieldUntil, now) + 30000;
      break;
    case 'slow':
      G.slowUntil = Math.max(G.slowUntil, now) + 20000;
      break;
    case 'bg':
      randomBg();
      break;
    case 'revive':
      reviveEnemies(enemy);
      break;
    case 'speaker':
      addItem('speaker', 1);
      break;
    case 'highlight':
      addItem('highlight', 1);
      break;
  }

  showToast(eff.emoji, eff.name, eff.desc, eff.color);
  sfxMystery();
}

function scheduleNextChest() {
  const delay = 15000 + Math.random() * 13000;
  G.nextChestTime = performance.now() + delay;
  G.chestActive = false;
}

function spawnChest() {
  if (G.chestActive) return;
  G.chestActive = true;

  const chest = document.createElement('div');
  chest.className = 'chest';

  const leftPct = 22 + Math.random() * 56;

  chest.innerHTML =
    '<div class="chest-aura"></div>' +
    '<div class="chest-ring"></div>' +
    '<div class="chest-icon">🎁</div>';

  chest.style.left = leftPct + '%';
  chest.style.top = '-100px';

  arena.appendChild(chest);

  sfxChestDrop();

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      chest.style.top = '56%';
    });
  });

  chest.addEventListener('transitionend', function onLand(e) {
    if (e.propertyName !== 'top') return;
    chest.removeEventListener('transitionend', onLand);
    chest.classList.add('landed');
  });

  chest.addEventListener('click', (e) => {
    e.stopPropagation();
    if (chest.classList.contains('opened')) return;
    openChest(chest);
  });

  setTimeout(() => {
    if (chest.parentNode && !chest.classList.contains('opened') && !chest.classList.contains('burst')) {
      chest.classList.add('fadeout');
      sfxChestVanished();
      setTimeout(() => {
        if (chest.parentNode) chest.remove();
        G.chestActive = false;
        scheduleNextChest();
      }, 600);
    }
  }, 7800);
}

function openChest(chest) {
  if (chest.classList.contains('opened')) return;

  chest.classList.remove('landed');
  chest.style.animation = 'none';
  chest.classList.add('opened');

  sfxChestOpen();

  setTimeout(() => {
    const rect = chest.getBoundingClientRect();
    burstStars(rect.left + rect.width / 2, rect.top + rect.height / 2);

    chest.classList.add('burst');
    setTimeout(() => {
      if (chest.parentNode) chest.remove();
    }, 520);

    grantChestTreasure();

    G.chestActive = false;
    scheduleNextChest();
  }, 380);
}

function burstStars(cx, cy) {
  const icons = ['⭐', '✨', '💫', '🌟', '✦', '★', '💎'];
  const colors = ['#fbbf24', '#38bdf8', '#f472b6', '#a78bfa', '#4ade80', '#fde68a'];

  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div');

    s.style.left = cx + 'px';

    s.style.fontSize = (14 + Math.random() * 14) + 'px';

    const ang = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 110;
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');

    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1150);
  }

function grantChestTreasure() {
  const r = Math.random();

  if (r < 0.4) {
    G.shieldUntil = Math.max(G.shieldUntil, performance.now()) + 30000;
    showToast('🛡️', '护盾激活！', '30 秒内免疫所有攻击', '#38bdf8');

}

const RULE_BATCHES = [
  [
    { text: '点击敌人 → 破解单词 → 答对击破', cls: '' },
    { text: '答错自动放入复习仓，可点底部复习', cls: '' }
  ],

  ],

  ]
];

function clearRuleTimers() {
  _rulesTimers.forEach(t => clearTimeout(t));
  _rulesTimers = [];
}

function showRules() {
  const panel = document.getElementById('rulesPanel');
  if (!panel) return;

  clearRuleTimers();
  panel.classList.remove('show');
  panel.innerHTML = '';
  G.rulePhase = true;

  let batchIndex = 0;

  function showBatch() {
    if (batchIndex >= RULE_BATCHES.length) {
      panel.classList.remove('show');
      const t = setTimeout(() => {
        panel.innerHTML = '';
        G.rulePhase = false;
      }, 500);
      _rulesTimers.push(t);
      return;
    }

    const batch = RULE_BATCHES[batchIndex];
    panel.innerHTML = batch.map((r, i) =>
      '<div class="rule-line ' + r.cls + '" style="animation-delay:' + (i * 0.32) + 's">' + r.text + '</div>'
    ).join('');
    panel.classList.add('show');

    const stayMs = Math.max(2400, batch.length * 1300 + 1200);

    const t1 = setTimeout(() => {
      panel.classList.remove('show');
      const t2 = setTimeout(() => {
        batchIndex++;
        showBatch();
      }, 480);
      _rulesTimers.push(t2);
    }, stayMs);
    _rulesTimers.push(t1);
  }

  const t0 = setTimeout(showBatch, 200);
  _rulesTimers.push(t0);
}

function hideRules() {
  clearRuleTimers();
  const panel = document.getElementById('rulesPanel');
  if (!panel) { G.rulePhase = false; return; }
  panel.classList.remove('show');
  G.rulePhase = false;
  setTimeout(() => {
    if (!panel.classList.contains('show')) panel.innerHTML = '';
  }, 500);
}
