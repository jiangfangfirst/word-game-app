  avatarEmoji.textContent = EMOJI[enemy.type];
  wordMeaning.textContent = enemy.word.m || '';

  fbEl.className = 'feedback';
  fbEl.textContent = '';

  updateItemButtons();
  clearKeyboardHint();
  showPhonBubble('');

  renderQuestion();
  renderKeyboard();

  sfxOpen();
  modalMask.classList.add('show');
}

function closeChallenge(noSound) {
  if (!C.enemy && !modalMask.classList.contains('show')) return;
  if (!noSound) sfxClose();
  modalMask.classList.remove('show');
  clearKeyboardHint();
  showPhonBubble('');
  C.enemy = null;
  G.paused = false;
}

function renderQuestion() {
  const e = C.enemy;
  if (!e) return;
  const w = e.word;

  const html = makeBlank(w.en || '', w.w);
  qArea.innerHTML =
    '<div class="q-en" id="qEn">' + html + '</div>' +
    '<div class="q-cn">' + (w.cn || '') + '</div>';
  C.seg = _lastSeg;
  C.segFirst = _lastSegFirst;
  updateBlank();
}

function renderKeyboard() {
  const rows = ['abcdefg', 'hijklmn', 'opqrstu', 'vwxyz'];
  let html = '';
  rows.forEach(r => {
    r.split('').forEach(l => {
      html += '<button class="key" data-key="' + l + '">' + l + '</button>';
    });
  });
  html += '<button class="key space" data-key=" ">空格</button>';
  html += '<button class="key del" data-act="del">⌫</button>';
  html += '<button class="key confirm" data-act="ok">确认</button>';
  keyboardEl.innerHTML = html;

  keyboardEl.querySelectorAll('[data-key]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (C.answered) return;
      pressChar(btn.dataset.key);
    });
  });
  keyboardEl.querySelector('[data-act="del"]').addEventListener('click', () => {
    if (C.answered) return;
    C.typed = C.typed.slice(0, -1);
    updateBlank(); sfxKey();
  });
  keyboardEl.querySelector('[data-act="ok"]').addEventListener('click', () => {
    if (C.answered) return;
    submitAnswer();
  });
}

function pressChar(ch) {
  if (!C.enemy) return;
  const maxLen = C.enemy.word.w.length + 2;
  if (C.typed.length >= maxLen) return;

  if (ch === ' ') {
    C.typed += ' ';
  } else if (!C.typed && C.segFirst) {
    C.typed += ch.toUpperCase();
  } else {
    C.typed += ch.toLowerCase();
  }
  updateBlank();
  sfxKey();
}

function updateBlank() {
  const b = document.getElementById('blankSpace');
  if (!b) return;
  if (!C.typed) {
    b.innerHTML = '<span class="caret"></span>';
    return;
  }
  const ok = isCorrect(C.typed, C.enemy.word.w, C.seg);
  b.innerHTML = escapeHtml(C.typed) + '<span class="caret"></span>';
  b.style.color = ok ? '#10b981' : '#e8edf5';
}

function useSpeaker() {
  if (!C.enemy) return;
  if (!useItem('speaker')) return;
  speakCurrent();
  showPhonBubble(C.enemy.word.p || '');
}

function useHighlight() {
  if (!C.enemy) return;
  if (!useItem('highlight')) return;

  const letters = new Set(
    (C.enemy.word.w || '').toLowerCase().replace(/[^a-z]/g, '').split('')
  );

  keyboardEl.querySelectorAll('[data-key]').forEach(btn => {
    const k = btn.dataset.key;
    if (letters.has(k)) btn.classList.add('hint');
  });

  beep(1300, .05, 'sine', .06);
  beep(1700, .08, 'sine', .05, .05);
}

let _speakAudio = null;
function speakCurrent() {
  if (!C.enemy) return;
  try {
    if (!_speakAudio) _speakAudio = new Audio();
    _speakAudio.src = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(C.enemy.word.w) + '&type=1';
    _speakAudio.play().catch(() => {});
  } catch (e) {}
}

function handleWrongAnswer(e) {
  const correctWord = e.word.w;
  const isReview = G.isReview;

  G.streak = 0;

  if (isReview) {
    const newWord = pickReplacementWordReview(correctWord);
    if (newWord) e.word = newWord;
  } else {
    addToReview(e.tier, correctWord);
    const newWord = pickReplacementWord(e.tier, correctWord);
    if (newWord) e.word = newWord;
  }

  if (e.el) {
    const tag = e.el.querySelector('.enemy-tag');
    if (tag) tag.textContent = e.word.m || e.word.cn || '';
  }

  wordMeaning.textContent = e.word.m || '';

  C.typed = '';
  C.seg = '';
  C.segFirst = false;
  clearKeyboardHint();
  showPhonBubble('');
  renderQuestion();
  updateBlank();

  if (e.el) {
    e.el.classList.add('hit');
    setTimeout(() => e.el && e.el.classList.remove('hit'), 320);
  }

  fbEl.className = 'feedback err';
  fbEl.innerHTML =
    '✗ 正确答案：<b>' + escapeHtml(correctWord) + '</b><br>' +
    '<span style="font-size:11px;opacity:.85">' +
    (isReview
      ? '该词保留在复习仓，再试一次'
      : '该词已加入复习仓，已换新单词') +
    '</span>';
}

function submitAnswer() {
  const e = C.enemy;
  if (!e || !e.alive) return;

  const ok = isCorrect(C.typed, e.word.w, C.seg);
  G.answerCount++;

  if (ok) {
    G.correctCount++;
    C.answered = true;
    sfxGood();
    sfxBreak();

    e.alive = false;
    if (e.el) {
      e.el.classList.add('die');
      setTimeout(() => { if (e.el) e.el.style.display = 'none'; }, 440);
    }
    if (e.aimLine) e.aimLine.style.display = 'none';

    const color = e.type === 'blue' ? '#38bdf8' : e.type === 'orange' ? '#fb923c' : '#f87171';
    spawnParticles(e.x, e.y, color, 14);

    if (G.isReview) {
      removeFromReview(e.tier, e.word.w);
    }
    markMastered(e.tier, e.word.w.toLowerCase());

    G.streak = (G.streak || 0) + 1;
    if (G.streak >= 5) {
      G.streak = 0;
      setTimeout(() => {
        addItem('highlight', 1);
        showToast('⌨️', '连击奖励！', '连续答对 5 个 · 键盘高亮 +1', '#fbbf24');
      }, 520);
    }

    addKillCount();
    G.killCount++;
    updateHUD();

    const healAmt = HEAL[e.type] || 0;
    healPlayer(healAmt);
    setTimeout(() => spawnParticles(e.x, e.y, '#4ade80', 8), 120);

    if (e.mystery) {
      setTimeout(() => triggerMystery(e), 220);
    }

    fbEl.className = 'feedback ok';
    fbEl.innerHTML = '✓ 正确！敌人已击破　<span style="color:#4ade80;font-weight:800">+' + healAmt + ' HP</span>' +
      (e.mystery ? '　<span style="color:#fbbf24;font-weight:800">✦ 神秘掉落</span>' : '');

    setTimeout(() => {
      closeChallenge(true);
      checkLevelClear();
    }, 520);

  } else {
    sfxBad();
    handleWrongAnswer(e);
  }
}

/* =========================================================
   13. Ready / Go
   ========================================================= */
function showReadyGo(cb) {
  const overlay = document.getElementById('readyOverlay');
  if (!overlay) { if (typeof cb === 'function') cb(); return; }

  overlay.classList.add('show');
  overlay.innerHTML = '<div class="ready-word">Ready?</div>';
  sfxReady();

  setTimeout(() => {
    overlay.innerHTML = '<div class="ready-word go">Go!</div>';
    sfxGo();
    setTimeout(() => {
      overlay.classList.remove('show');
      overlay.innerHTML = '';
      if (typeof cb === 'function') cb();
    }, 620);
  }, 1050);
}

/* =========================================================
   14. 关卡管理
   ========================================================= */
function startLevel(levelNum, isReview) {
  G.isReview = !!isReview;
  G.level = levelNum;
  G.reviewLevel = levelNum;
  G.running = true;
  G.paused = true;
  G.preparing = true;
  G.rulePhase = false;
  G.streak = 0;
  G.over = false;
  G.hp = G.maxHp;
  G.enemies = [];
  G.projectiles = [];
  G.killCount = 0;
  G.answerCount = 0;
  G.correctCount = 0;
  G.shieldUntil = 0;
  G.slowUntil = 0;
  G.chestActive = false;
  G.nextChestTime = 0;
  _lastBuffKey = '';

  G.startTime = performance.now();
  G.elapsed = 0;
  _lastTimerSec = -1;
  const tEl = document.getElementById('timerBadge');
  if (tEl) tEl.textContent = '用时0秒';

  const playerEl = document.getElementById('player');
  if (playerEl) playerEl.classList.remove('shielded');

  clearEntities();
  hideRules();

  let enemies;

  if (G.isReview) {
    const items = getReviewItems();
    G.reviewTotalLevels = Math.max(1, Math.ceil(items.length / TOTAL_PER_LEVEL));

    if (!items.length) {
      G.isReview = false;
      G.running = false;
      updateHUD();
      showToast('✅', '复习仓已清空', '所有错词都掌握了', '#4ade80');
      setTimeout(() => startLevel(STORE.level || 1, false), 600);
      return;
    }

    enemies = buildReviewLevel(levelNum, items);
  } else {
    enemies = buildLevel(levelNum);
  }

  if (!enemies || !enemies.length) {
    G.running = false;
    updateHUD();
    showToast('⚠️', '暂无可用单词', '请重置进度后重试', '#f59e0b');
    return;
  }

  G.enemies = enemies;
  enemies.forEach(createEnemyEl);

  const prefixEl = document.getElementById('levelPrefix');
  const levelNumEl = document.getElementById('levelNum');
  const totalEl = document.getElementById('totalLevels');
  const badgeEl = document.getElementById('levelBadge');

  if (G.isReview) {
    badgeEl.classList.add('review');
    if (prefixEl) prefixEl.textContent = '复习第';
    if (levelNumEl) levelNumEl.textContent = levelNum;
    if (totalEl) totalEl.textContent = G.reviewTotalLevels;
  } else {
    badgeEl.classList.remove('review');
    if (prefixEl) prefixEl.textContent = '第';
    if (levelNumEl) levelNumEl.textContent = levelNum;
    if (totalEl) totalEl.textContent = TOTAL_LEVELS;
  }

  updateHUD();

  document.getElementById('resultMask').classList.remove('show');
  document.getElementById('resultCard').classList.remove('lose');

  const p = document.getElementById('player');
  p.style.left = PLAYER_X + '%';
  p.style.bottom = PLAYER_Y + '%';

  showReadyGo(() => {
    G.paused = false;
    G.preparing = false;
    G.startTime = performance.now();
    G.elapsed = 0;
    _lastTimerSec = -1;

    G.rulePhase = true;
    showRules();

    const ruleDelay = 12000;
    setTimeout(() => {
      if (G.running && !G.over) {
        scheduleNextChest();
        G.nextChestTime = performance.now() + 6000 + Math.random() * 8000;
      }
    }, ruleDelay);
  });
}

function updateHUD() {
  const pct = Math.max(0, G.hp / G.maxHp * 100);
  const fill = document.getElementById('playerHpFill');
  if (fill) fill.style.width = pct + '%';

  const left = G.enemies.filter(e => e.alive).length;
  const el = document.getElementById('enemyLeft');
  if (el) el.textContent = left;

  updateRankHUD();
  updateItemBag();
}

function updateRankHUD() {
  const total = STORE.totalKills || 0;
  const r = getRank(total);
  const key = r.sun + '|' + r.moon + '|' + r.star + '|' + _userName;

  const box = document.getElementById('rankBadge');
  if (!box) return;

  if (key === _lastRankKey) return;
  _lastRankKey = key;

  const userNameHtml =
    '<span class="user-name" title="' + escapeHtml(_userName) + '">' +
    escapeHtml(_userName) +
    '</span>';

  let html = userNameHtml;

  if (r.sun > 0) {
    html += '<span class="rank-item sun"><i>☀️</i><span class="rank-num">' + r.sun + '</span></span>';
  }
  if (r.moon > 0) {
    html += '<span class="rank-item moon"><i>🌙</i><span class="rank-num">' + r.moon + '</span></span>';
  }
  if (r.star > 0 || html === userNameHtml) {
    html += '<span class="rank-item star"><i>⭐</i><span class="rank-num">' + r.star + '</span></span>';
  }
  box.innerHTML = html;
}

function checkLevelClear() {
  if (G.over) return;
  if (G.enemies.every(e => !e.alive)) {
    G.running = false;
    G.rulePhase = false;
    hideRules();
    G.elapsed = performance.now() - G.startTime;
    updateTimerDisplay();
    const p = document.getElementById('player');
    p.style.bottom = (TREASURE_Y - 10) + '%';
    setTimeout(() => showResult(true), 850);
  }
}

function gameOver() {
  if (G.over) return;
  G.over = true;
  G.running = false;
  G.rulePhase = false;
  hideRules();
  G.elapsed = performance.now() - G.startTime;
  setTimeout(() => showResult(false), 450);
}

function countUp(el, to, dur, suffix) {
  const start = performance.now();
  const sfx = suffix || '';
  function tick(now) {
    const p = Math.min((now - start) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * eased) + sfx;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function calcStars(win, acc, hp) {
  if (!win) return 0;
  if (acc >= 90 && hp >= 60) return 3;
  if (acc >= 70 || hp >= 30) return 2;
  return 1;
}

function showResult(win) {
  const mask = document.getElementById('resultMask');
  const card = document.getElementById('resultCard');
  const icon = document.getElementById('resultIcon');
  const badge = document.getElementById('resultBadge');
  const title = document.getElementById('resultTitle');
  const starsEl = document.getElementById('resultStars');
  const mainBtn = document.getElementById('resultMainBtn');
  const subBtn = document.getElementById('resultSubBtn');

  const acc = G.answerCount > 0 ? Math.round(G.correctCount / G.answerCount * 100) : 0;
  const hp = Math.round(G.hp);

  card.classList.toggle('lose', !win);

  const starCount = calcStars(win, acc, hp);
  let starsHtml = '';
  for (let i = 0; i < 3; i++) {
    const on = i < starCount;
    starsHtml += '<span class="result-star' + (on ? '' : ' off') + '" style="animation-delay:' + (0.45 + i * 0.12) + 's">★</span>';
  }
  starsEl.innerHTML = starsHtml;

  if (win) {
    if (G.isReview) {
      const remaining = getReviewItems();

      if (remaining.length > 0) {
        icon.textContent = '📚';
        badge.textContent = '复习通关';
        title.textContent = '复习第 ' + G.reviewLevel + ' 关 · 完成';
        mainBtn.textContent = '继续复习';
        mainBtn.onclick = () => {
          sfxClick();
          const total = Math.max(1, Math.ceil(remaining.length / TOTAL_PER_LEVEL));
          G.reviewTotalLevels = total;
          const nextLv = Math.min(G.reviewLevel + 1, total);
          startLevel(nextLv, true);
        };
        subBtn.textContent = '返回闯关';
        subBtn.onclick = () => {
          sfxClick();
          G.isReview = false;
          startLevel(STORE.level || 1, false);
        };
      } else {
        icon.textContent = '🎉';
        badge.textContent = '全部掌握';
        title.textContent = '复习仓已清空！';
        mainBtn.textContent = '返回闯关';
        mainBtn.onclick = () => {
          sfxClick();
          G.isReview = false;
          startLevel(STORE.level || 1, false);
        };
        subBtn.textContent = '重玩本关';
        subBtn.onclick = () => { sfxClick(); startLevel(G.reviewLevel, true); };
      }
    } else {
      icon.textContent = '🏆';
      badge.textContent = starCount === 3 ? '完美通关' : starCount === 2 ? '顺利通关' : '险胜通关';
      title.textContent = '第 ' + G.level + ' 关 · 夺宝成功';
      mainBtn.textContent = '进入第 ' + (G.level + 1) + ' 关';
      mainBtn.onclick = () => {
        sfxClick();
        const s = loadStore();
        s.level = Math.max(s.level, G.level + 1);
        saveStore(s);
        startLevel(G.level + 1, false);
      };
      subBtn.textContent = '重玩本关';
      subBtn.onclick = () => { sfxClick(); startLevel(G.level, false); };
    }
  } else {
    icon.textContent = '💀';
    badge.textContent = 'HP 归零';
    title.textContent = G.isReview ? '复习失败 · 血量耗尽' : '血量耗尽 · 挑战失败';
    mainBtn.textContent = '重试本关';
    mainBtn.onclick = () => { sfxClick(); startLevel(G.isReview ? G.reviewLevel : G.level, G.isReview); };
    subBtn.textContent = G.isReview ? '返回闯关' : '返回第 1 关';
    subBtn.onclick = () => {
      sfxClick();
      if (G.isReview) {
        G.isReview = false;
        startLevel(STORE.level || 1, false);
      } else {
        startLevel(1, false);
      }
    };
  }

  document.getElementById('rsKill').textContent = '0';
  document.getElementById('rsAcc').textContent = '0%';
  document.getElementById('rsHp').textContent = '0';

  mask.classList.add('show');

  if (win) sfxWinFanfare(); else sfxLose();

  setTimeout(() => {
    countUp(document.getElementById('rsKill'), G.killCount, 600);
    countUp(document.getElementById('rsAcc'), acc, 700, '%');
    countUp(document.getElementById('rsHp'), hp, 800);
  }, 480);

  if (win && starCount > 0) {
    for (let i = 0; i < starCount; i++) {
      setTimeout(sfxStar, 480 + i * 130);
    }
  }
}

/* =========================================================
   15. 入口
   ========================================================= */
function startGame() {
  ac();
  sfxClick();
  document.getElementById('splashMask').classList.add('hide');
  startLevel(STORE.level || 1, false);
}

function startReview() {
  if (!localStorage.getItem('dd_auth')) { location.href = 'login.html'; return; }

  ac();
  sfxClick();

  const items = getReviewItems();
  if (!items.length) {
    showToast('📚', '复习仓为空', '继续闯关积累错词吧', '#a78bfa');
    return;
  }

  document.getElementById('splashMask').classList.add('hide');
  startLevel(1, true);
}

function backHome() {
  sfxClick();

  G.running = false;
  G.paused = true;
  G.preparing = false;
  G.rulePhase = false;
  G.over = true;
  G.chestActive = false;
  G.nextChestTime = 0;

  hideRules();

  if (modalMask.classList.contains('show')) {
    modalMask.classList.remove('show');
  }
  if (C.enemy) {
    clearKeyboardHint();
    showPhonBubble('');
    C.enemy = null;
  }

  document.getElementById('resultMask').classList.remove('show');

  clearEntities();
  document.getElementById('readyOverlay').classList.remove('show');
  document.getElementById('readyOverlay').innerHTML = '';

  document.getElementById('splashMask').classList.remove('hide');
}

function resetProgress() {
  sfxClick();
  if (!confirm('确定要重置全部闯关进度吗？')) return;
  STORE = defaultStore();
  saveStore(STORE);
  _lastRankKey = '';
  alert('已重置，将从第 1 关开始');
  document.getElementById('levelNum').textContent = '1';
  updateRankHUD();
  updateReviewCount();
  updateItemBag();
}

/* 退出登录：清登录态，保留学习进度与设备 ID */
function logout() {
  const ok = confirm('确定要退出登录吗？\n学习进度会保留，下次用同一学习码登录即可继续。');
  if (!ok) return;

  sfxClick();

  localStorage.removeItem('dd_auth');
  localStorage.removeItem('dd_login_time');
  localStorage.removeItem('dd_name');

  location.href = 'login.html';
}

document.addEventListener('keydown', ev => {
  if (!modalMask.classList.contains('show')) return;
  if (C.answered) return;

  if (ev.key === 'Backspace') {
    ev.preventDefault();
    C.typed = C.typed.slice(0, -1);
    updateBlank(); sfxKey();
  } else if (ev.key === 'Enter') {
    ev.preventDefault();
    submitAnswer();
  } else if (ev.key === ' ') {
    ev.preventDefault();
    pressChar(' ');
  } else if (/^[a-zA-Z]$/.test(ev.key)) {
    pressChar(ev.key);
  }
});

document.addEventListener('click', function once() {
  ac();
  document.removeEventListener('click', once);
});

requestAnimationFrame(loop);

(function init() {
  document.getElementById('levelNum').textContent = STORE.level || 1;
  document.getElementById('totalLevels').textContent = TOTAL_LEVELS;
  document.getElementById('enemyLeft').textContent = TOTAL_PER_LEVEL;
  const fill = document.getElementById('playerHpFill');
  if (fill) fill.style.width = '100%';
  updateRankHUD();
  updateReviewCount();
  updateItemBag();
  updateItemButtons();
})();
</script>
