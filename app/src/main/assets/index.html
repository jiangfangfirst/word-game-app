  html += '<button class="key del" data-act="del">⌫</button>';
  html += '<button class="key confirm" data-act="ok">确认</button>';
  keyboardEl.innerHTML = html;
  keyboardEl.querySelectorAll('[data-key]').forEach(btn => {
    btn.addEventListener('click', () => { if (C.answered) return; pressChar(btn.dataset.key); });
  });
  keyboardEl.querySelector('[data-act="del"]').addEventListener('click', () => {
    if (C.answered) return;
    C.typed = C.typed.slice(0, -1);
    updateBlank(); sfxKey();
  });
  keyboardEl.querySelector('[data-act="ok"]').addEventListener('click', () => {
    if (C.answered) return;
    submitAnswer();
  });
}
function pressChar(ch) {
  if (!C.enemy) return;
  const maxLen = C.enemy.word.w.length + 2;
  if (C.typed.length >= maxLen) return;
  if (ch === ' ') { C.typed += ' '; }
  else if (!C.typed && C.segFirst) { C.typed += ch.toUpperCase(); }
  else { C.typed += ch.toLowerCase(); }
  updateBlank(); sfxKey();
}
function updateBlank() {
  const b = document.getElementById('blankSpace');
  if (!b) return;
  if (!C.typed) { b.innerHTML = '<span class="caret"></span>'; return; }
  const ok = isCorrect(C.typed, C.enemy.word.w, C.seg);
  b.innerHTML = escapeHtml(C.typed) + '<span class="caret"></span>';
  b.style.color = ok ? '#10b981' : '#e8edf5';
}
function useSpeaker() {
  if (!C.enemy) return;
  const s = loadStore();
  if (!s.items || (s.items.speaker || 0) <= 0) { showToast('🎺', '缺少道具', '打怪掉落宝箱有概率获得', '#f59e0b'); return; }
  if (!useItem('speaker')) return;
  speakCurrent();
  showPhonBubble(C.enemy.word.p || '');
}
function useHighlight() {
  if (!C.enemy) return;
  const s = loadStore();
  if (!s.items || (s.items.highlight || 0) <= 0) { showToast('⌨️', '缺少道具', '打怪掉落宝箱有概率获得', '#f59e0b'); return; }
  if (!useItem('highlight')) return;
  const letters = new Set((C.enemy.word.w || '').toLowerCase().replace(/[^a-z]/g, '').split(''));
  keyboardEl.querySelectorAll('[data-key]').forEach(btn => { if (letters.has(btn.dataset.key)) btn.classList.add('hint'); });
  beep(1300, .05, 'sine', .06); beep(1700, .08, 'sine', .05, .05);
}
function useFirstLetter() {
  if (!C.enemy) return;
  const s = loadStore();
  if (!s.items || (s.items.firstLetter || 0) <= 0) { showToast('💡', '缺少道具', '打怪掉落宝箱有概率获得', '#f59e0b'); return; }
  if (!useItem('firstLetter')) return;
  const word = C.enemy.word.w;
  if (!word) return;
  C.typed = word[0] || '';
  if (C.segFirst) C.typed = C.typed.toUpperCase();
  updateBlank(); sfxKey();
  beep(1200, .1, 'sine', .08);
}
let _speakAudio = null;
function speakCurrent() {
  if (!C.enemy) return;
  try {
    if (!_speakAudio) _speakAudio = new Audio();
    _speakAudio.src = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(C.enemy.word.w) + '&type=1';
    _speakAudio.play().catch(() => {});
  } catch (e) {}
}
function handleWrongAnswer(e) {
  const correctWord = e.word.w;
  const oldMeaning = e.word.m || e.word.cn || '';
  const isReview = G.isReview;
  G.streak = 0;
  updateStreakBar();
  G.enemies.forEach(en => { if (en.el) en.el.classList.remove('streak-warning'); });
  if (isReview) {
    const items = getReviewItems();
    if (items.length === 1) {
      if (e.el) { e.el.classList.add('hit'); setTimeout(() => e.el && e.el.classList.remove('hit'), 320); }
      setFeedback('err', '✗ 上一题「' + escapeHtml(oldMeaning) + '」的正确答案：<b>' + escapeHtml(correctWord) + '</b><br><span style="font-size:12px;opacity:.85">这是最后一个生词，请牢记后再试！</span>');
      C.typed = ''; updateBlank();
      clearTimeout(_fbTimer); _fbTimer = null;
      return;
    }
    const newWord = pickReplacementWordReview(correctWord);
    if (newWord) e.word = newWord;
  } else {
    addToReview(e.tier, correctWord);
    const newWord = pickReplacementWord(e.tier, correctWord);
    if (newWord) e.word = newWord;
  }
  if (e.el) {
    const tag = e.el.querySelector('.enemy-tag');
    if (tag) tag.textContent = e.word.m || e.word.cn || '';
  }
  wordMeaning.textContent = e.word.m || '';
  C.typed = ''; C.seg = ''; C.segFirst = false;
  clearKeyboardHint();
  showPhonBubble('');
  renderQuestion();
  updateBlank();
  if (e.el) { e.el.classList.add('hit'); setTimeout(() => e.el && e.el.classList.remove('hit'), 320); }
  setFeedback('err', '✗ 上一题「' + escapeHtml(oldMeaning) + '」的正确答案：<b>' + escapeHtml(correctWord) + '</b><br><span style="font-size:12px;opacity:.85">' + (isReview ? '该词保留在复习仓，再试一次' : '该词已加入复习仓，已换新单词') + '</span>');
  clearTimeout(_fbTimer); _fbTimer = null;
}
function submitAnswer() {
  const e = C.enemy;
  if (!e || !e.alive) return;
  clearTimeout(_fbTimer);
  const ok = isCorrect(C.typed, e.word.w, C.seg);
  G.answerCount++;
  if (ok) {
    G.correctCount++;
    C.answered = true;
    sfxGood(); sfxBreak();
    if (e.isElite || e === G.bloatingEnemy) {
      showToast('🏆', '成功拆除能量源！', '获得海量奖励！', '#fbbf24');
      healPlayer(30); addItem('speaker', 1); addItem('highlight', 1);
      G.bloatingEnemy = null; e.isElite = false;
    }
    e.alive = false;
    if (e.el) {
      e.el.classList.add('die');
      e.el.classList.remove('streak-warning');
      setTimeout(() => { if (e.el) e.el.style.display = 'none'; }, 440);
    }
    if (e.aimLine) e.aimLine.style.display = 'none';
    const color = e.type === 'blue' ? '#38bdf8' : e.type === 'orange' ? '#fb923c' : e.type === 'red' ? '#f87171' : e.type === 'green' ? '#10b981' : e.type === 'black' ? '#94a3b8' : '#a855f7';
    spawnParticles(e.x, e.y, color, 14);
    if (G.isReview) removeFromReview(e.tier, e.word.w);
    markMastered(e.tier, e.word.w.toLowerCase());
    G.streak = (G.streak || 0) + 1;
    updateStreakBar();
    if (G.streak >= 5) {
      G.streak = 0;
      updateStreakBar();
      G.enemies.forEach(en => { if (en.el) en.el.classList.remove('streak-warning'); });
      setTimeout(() => {
        if (G.chests.length === 0) { spawnChest(); showToast('🎁', '连击奖励！', '连续答对 5 个 · 掉落宝箱', '#fbbf24'); }
        else { addItem('speaker', 1); showToast('🎺', '连击奖励！', '场上已有宝箱 · 获得喇叭 +1', '#38bdf8'); }
      }, 520);
    } else if (G.streak === 4) {
      showToast('⚡', '连击预警！', '再答对 1 个即可获得宝箱！', '#fbbf24');
      sfxStreakWarn();
      G.enemies.forEach(en => { if (en.alive && en.el) en.el.classList.add('streak-warning'); });
    }
    addKillCount();
    G.killCount++;
    updateHUD();
    let healAmt = HEAL[e.type] || 0;
    if (e.type === 'green') healAmt = Math.round(G.maxHp * 0.2);
    healPlayer(healAmt);
    setTimeout(() => spawnParticles(e.x, e.y, '#4ade80', 8), 120);
    if (e.mystery) setTimeout(() => triggerMystery(e), 220);
    setFeedback('ok', '✓ 正确！敌人已击破　<span style="color:#4ade80;font-weight:800">+' + healAmt + ' HP</span>' + (e.mystery ? '　<span style="color:#fbbf24;font-weight:800">✦ 神秘掉落</span>' : ''));
    setTimeout(() => {
      if (C.enemy === e) { closeChallenge(true); checkLevelClear(); }
    }, 520);
  } else {
    sfxBad();
    handleWrongAnswer(e);
  }
}

function showReadyGo(cb) {

  }, 1050);

/* =========================================================
   13. 关卡管理
   ========================================================= */
function startLevel(levelNum, isReview) {
  G.isReview = !!isReview;
  G.level = levelNum;
  G.reviewLevel = levelNum;
  G.running = true;
  G.paused = true;
  G.preparing = true;
  G.rulePhase = false;
  G.streak = 0;
  G.over = false;
  G.hp = G.maxHp;
  G.enemies = [];
  G.projectiles = [];
  G.heroProjectiles = [];
  G.killCount = 0;
  G.answerCount = 0;
  G.correctCount = 0;
  G.shieldUntil = 0;
  G.slowUntil = 0;
  G.chests = [];
  G.chestActive = false;
  G.bloatingEnemy = null;
  G.bloatTime = 0;
  G.pauseOffset = 0;
  _lastBuffKey = '';
  _lastShieldSec = -1;
  G.startTime = performance.now();
  G.elapsed = 0;
  _lastTimerSec = -1;
  const tEl = document.getElementById('timerBadge');
  if (tEl) tEl.textContent = '用时0秒';
  updateStreakBar();
  updateHUD();
  const playerEl = document.getElementById('player');
  if (playerEl) playerEl.classList.remove('shielded');
  clearEntities();
  initCharacterSkills();
  hideRules();

  let enemies;
  if (G.isReview) {
    const items = getReviewItems();
    G.reviewTotalLevels = Math.max(1, Math.ceil(items.length / TOTAL_PER_LEVEL));
    if (!items.length) {
      G.isReview = false; G.running = false;
      updateHUD();
      showToast('✅', '复习仓已清空', '所有错词都掌握了', '#4ade80');
      setTimeout(() => startLevel(STORE.level || 1, false), 600);
      return;
    }
    enemies = buildReviewLevel(levelNum, items);
  } else {
    enemies = buildLevel(levelNum);
  }

  if (!enemies || !enemies.length) {
    G.running = false; updateHUD();
    showToast('⚠️', '暂无可用单词', '请重置进度后重试', '#f59e0b');
    return;
  }

  G.enemies = enemies;
  enemies.forEach(createEnemyEl);

  const prefixEl = document.getElementById('levelPrefix');
  const levelNumEl = document.getElementById('levelNum');
  const totalEl = document.getElementById('totalLevels');
  const badgeEl = document.getElementById('levelBadge');
    const unitEl = document.getElementById('lvUnit');
  if (G.isReview) {
    badgeEl.classList.add('review');
    if (prefixEl) prefixEl.textContent = '复习第';
    if (levelNumEl) levelNumEl.textContent = levelNum;
    if (totalEl) totalEl.textContent = G.reviewTotalLevels;
    if (unitEl) unitEl.textContent = '关';
  } else {
    badgeEl.classList.remove('review');
    if (prefixEl) prefixEl.textContent = '第';
    if (levelNumEl) levelNumEl.textContent = levelNum;
    if (totalEl) totalEl.textContent = getRemainingWords();
    if (unitEl) unitEl.textContent = '词';
  }
  updateHUD();
  document.getElementById('resultMask').classList.remove('show');
  document.getElementById('resultCard').classList.remove('lose');
  const p = document.getElementById('player');
  p.style.left = PLAYER_X + '%';
  p.style.bottom = PLAYER_Y + '%';
  setTimeout(updateArenaSize, 0);

  showReadyGo(() => {
    G.paused = false;
    G.preparing = false;
    G.startTime = performance.now();
    G.elapsed = 0;
    _lastTimerSec = -1;
    updateArenaSize();
    G.rulePhase = true;
    showRules();
  });
}
function updateRankHUD() {
  const total = STORE.totalKills || 0;
  const r = getRank(total);
  const key = r.sun + '|' + r.moon + '|' + r.star + '|' + _userName;
  const box = document.getElementById('rankBadge');
  if (!box) return;
  if (key === _lastRankKey) return;
  _lastRankKey = key;
  const userNameHtml = '<span class="user-name" title="' + escapeHtml(_userName) + '">' + escapeHtml(_userName) + '</span>';
  let html = userNameHtml;
  if (r.sun > 0) html += '<span class="rank-item sun"><i>☀️</i><span class="rank-num">' + r.sun + '</span></span>';
  if (r.moon > 0) html += '<span class="rank-item moon"><i>🌙</i><span class="rank-num">' + r.moon + '</span></span>';
  if (r.star > 0 || html === userNameHtml) html += '<span class="rank-item star"><i>⭐</i><span class="rank-num">' + r.star + '</span></span>';
  box.innerHTML = html;
}
function checkLevelClear() {
  if (G.over || !G.running) return;
  if (G.enemies.length > 0 && G.enemies.every(e => !e.alive)) {
    G.running = false;
    G.rulePhase = false;
    hideRules();
    G.elapsed = performance.now() - G.startTime - G.pauseOffset;
    updateTimerDisplay();

    /* 主关卡通关时立即保存进度，避免点"返回首页"后回到第 1 关 */
    if (!G.isReview) {
      const s = loadStore();
      s.level = Math.max(s.level, G.level + 1);
      STORE = s;
      saveStore(s);
    }

    const p = document.getElementById('player');
    if (p) p.style.bottom = (TREASURE_Y - 10) + '%';
    setTimeout(() => showResult(true), 850);
  }
}
function gameOver() {
  if (G.over) return;
  G.over = true;
  G.running = false;
  G.rulePhase = false;
  hideRules();
  G.elapsed = performance.now() - G.startTime - G.pauseOffset;
  setTimeout(() => showResult(false), 450);
}
function countUp(el, to, dur, suffix) {
  const start = performance.now();
  const sfx = suffix || '';
  function tick(now) {
    const p = Math.min((now - start) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * eased) + sfx;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function calcStars(win, acc, hp) {
  if (!win) return 0;
  if (acc >= 90 && hp >= 60) return 3;
  if (acc >= 70 || hp >= 30) return 2;
  return 1;
}
function showResult(win) {
  const mask = document.getElementById('resultMask');
  const card = document.getElementById('resultCard');
  const icon = document.getElementById('resultIcon');
  const badge = document.getElementById('resultBadge');
  const title = document.getElementById('resultTitle');
  const starsEl = document.getElementById('resultStars');
  const mainBtn = document.getElementById('resultMainBtn');
  const subBtn = document.getElementById('resultSubBtn');
  const acc = G.answerCount > 0 ? Math.round(G.correctCount / G.answerCount * 100) : 0;
  const hp = Math.round(G.hp);
  card.classList.toggle('lose', !win);
  const starCount = calcStars(win, acc, hp);
  let starsHtml = '';
  for (let i = 0; i < 3; i++) {
    const on = i < starCount;
    starsHtml += '<span class="result-star' + (on ? '' : ' off') + '" style="animation-delay:' + (0.45 + i * 0.12) + 's">★</span>';
  }
  starsEl.innerHTML = starsHtml;

  if (win) {
    if (G.isReview) {
      const remaining = getReviewItems();
      if (remaining.length > 0) {
        icon.textContent = '📚'; badge.textContent = '复习通关';
        title.textContent = '复习第 ' + G.reviewLevel + ' 关 · 完成';
        mainBtn.textContent = '继续复习';
        mainBtn.onclick = () => {
          sfxClick();
          const total = Math.max(1, Math.ceil(remaining.length / TOTAL_PER_LEVEL));
          G.reviewTotalLevels = total;
          const nextLv = Math.min(G.reviewLevel + 1, total);
          startLevel(nextLv, true);
        };
        subBtn.textContent = '返回闯关';
        subBtn.onclick = () => { sfxClick(); G.isReview = false; startLevel(STORE.level || 1, false); };
      } else {
        icon.textContent = '🎉'; badge.textContent = '全部掌握';
        title.textContent = '复习仓已清空！';
        mainBtn.textContent = '返回闯关';
        mainBtn.onclick = () => { sfxClick(); G.isReview = false; startLevel(STORE.level || 1, false); };
        subBtn.textContent = '重玩本关';
        subBtn.onclick = () => { sfxClick(); startLevel(G.reviewLevel, true); };
      }
    } else {
      icon.textContent = '🏆';
      badge.textContent = starCount === 3 ? '完美通关' : starCount === 2 ? '顺利通关' : '险胜通关';
      title.textContent = '第 ' + G.level + ' 关 · 夺宝成功';
      mainBtn.textContent = '进入第 ' + (G.level + 1) + ' 关';
      mainBtn.onclick = () => {
        sfxClick();
        const s = loadStore();
        s.level = Math.max(s.level, G.level + 1);
        saveStore(s);
        startLevel(G.level + 1, false);
      };
      subBtn.textContent = '重玩本关';
      subBtn.onclick = () => { sfxClick(); startLevel(G.level, false); };
    }
  } else {
    icon.textContent = '💀';
    badge.textContent = 'HP 归零';
    title.textContent = G.isReview ? '复习失败 · 血量耗尽' : '血量耗尽 · 挑战失败';
    mainBtn.textContent = '重试本关';
    mainBtn.onclick = () => { sfxClick(); startLevel(G.isReview ? G.reviewLevel : G.level, G.isReview); };
    subBtn.textContent = G.isReview ? '返回闯关' : '返回第 1 关';
    subBtn.onclick = () => {
      sfxClick();
      if (G.isReview) { G.isReview = false; startLevel(STORE.level || 1, false); }
      else startLevel(1, false);
    };
  }

  document.getElementById('rsKill').textContent = '0';
  document.getElementById('rsAcc').textContent = '0%';
  document.getElementById('rsHp').textContent = '0';
  mask.classList.add('show');
  if (win) sfxWinFanfare(); else sfxLose();
  setTimeout(() => {
    countUp(document.getElementById('rsKill'), G.killCount, 600);
    countUp(document.getElementById('rsAcc'), acc, 700, '%');
    countUp(document.getElementById('rsHp'), hp, 800);
  }, 480);
  if (win && starCount > 0) for (let i = 0; i < starCount; i++) setTimeout(sfxStar, 480 + i * 130);
}

  if (!modalMask.classList.contains('show')) return;
  if (C.answered) return;
  if (ev.key === 'Backspace') { ev.preventDefault(); C.typed = C.typed.slice(0, -1); updateBlank(); sfxKey(); }
  else if (ev.key === 'Enter') { ev.preventDefault(); submitAnswer(); }
  else if (ev.key === ' ') { ev.preventDefault(); pressChar(' '); }
  else if (/^[a-zA-Z]$/.test(ev.key)) pressChar(ev.key);
});
document.addEventListener('click', function once() { ac(); document.removeEventListener('click', once); });

requestAnimationFrame(loop);

(function init() {
  document.getElementById('levelNum').textContent = STORE.level || 1;
  document.getElementById('totalLevels').textContent = getRemainingWords();
  const lvUnitEl = document.getElementById('lvUnit');
  if (lvUnitEl) lvUnitEl.textContent = '词';
  document.getElementById('enemyLeft').textContent = TOTAL_PER_LEVEL;
  const fill = document.getElementById('playerHpFill');
  if (fill) fill.style.width = '100%';
  updateRankHUD();
  updateReviewCount();
  updateItemBag();
  updateItemButtons();
  updateHUD();
  updateStreakBar();
})();
</script>
