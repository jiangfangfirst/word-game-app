<style>
:root {
  --gold: #fbbf24; --gold-2: #f59e0b; --gold-deep: #d97706;
  --green: #10b981; --green-2: #059669; --blue: #38bdf8;
  --blue-2: #0ea5e9; --blue-deep: #0369a1; --orange: #f97316;
  --red: #ef4444; --purple: #a78bfa; --bg-0: #0b1220;
  --bg-1: #0f172a; --bg-2: #1b2540; --line: rgba(148,163,184,.16);
  --txt: #e2e8f0; --txt-dim: #94a3b8; --txt-mute: #64748b;
  --ease-spring: cubic-bezier(.34,1.56,.64,1); --ease-out: cubic-bezier(.22,1,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; background: var(--bg-0); color: var(--txt); display: flex; flex-direction: column; user-select: none; -webkit-font-smoothing: antialiased; font-size: 16px; }

.hud { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(180deg, rgba(30,41,59,.98), rgba(15,23,42,.94)); border-bottom: 1px solid var(--line); z-index: 20; min-height: 60px; }
.level-badge { font-size: 16px; font-weight: 800; color: var(--gold); background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.32); border-radius: 8px; padding: 6px 14px; white-space: nowrap; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transition: color .3s, background .3s, border-color .3s; }
.level-badge.review { color: #c4b5fd; background: rgba(167,139,250,.14); border-color: rgba(167,139,250,.42); }
.lv-total { font-size: 13px; font-weight: 600; color: rgba(251,191,36,.6); margin-left: 2px; letter-spacing: .1px; }
.level-badge.review .lv-total { color: rgba(196,181,253,.65); }
.rank-badge { display: flex; align-items: center; gap: 8px; margin-left: auto; margin-right: 6px; min-height: 24px; }
.rank-badge .user-name { font-size: 15px; font-weight: 700; color: #e2e8f0; letter-spacing: .3px; line-height: 1; padding-right: 10px; margin-right: 2px; border-right: 1px solid rgba(148,163,184,.24); white-space: nowrap; max-width: 100px; overflow: hidden; text-overflow: ellipsis; display: inline-block; }
.rank-item { display: inline-flex; align-items: center; gap: 2px; line-height: 1; }
.rank-item i { font-style: normal; font-size: 18px; line-height: 1; filter: drop-shadow(0 0 6px rgba(251,191,36,.4)); }
.rank-item .rank-num { font-size: 14px; font-weight: 800; color: #cbd5e1; font-variant-numeric: tabular-nums; letter-spacing: -.2px; }
.rank-item.sun .rank-num { color: #fde68a; }
.rank-item.moon .rank-num { color: #bae6fd; }
.rank-item.star .rank-num { color: #fcd34d; }
.enemy-count { font-size: 14px; color: var(--txt-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.enemy-count b { color: #f87171; font-size: 16px; }

.arena { flex: 1 1 auto; position: relative; overflow: hidden; background: linear-gradient(180deg, #1e1b4b 0%, #312e81 34%, #3b0764 68%, #0f172a 100%); transition: background .5s ease; }
.arena.bg-1 { background: linear-gradient(180deg, #042f2e 0%, #134e4a 34%, #0f766e 66%, #021716 100%); }
.arena.bg-2 { background: linear-gradient(180deg, #2e1065 0%, #4c1d95 34%, #7e22ce 66%, #1a0b33 100%); }
.arena.bg-3 { background: linear-gradient(180deg, #450a0a 0%, #7f1d1d 34%, #9a3412 66%, #1c0a0a 100%); }
.arena.bg-4 { background: linear-gradient(180deg, #082f49 0%, #0c4a6e 34%, #0369a1 66%, #041a29 100%); }
.arena.bg-5 { background: linear-gradient(180deg, #1a2e05 0%, #365314 34%, #4d7c0f 66%, #0b1503 100%); }
.arena::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .85; background-image: radial-gradient(1.5px 1.5px at 18% 14%, rgba(255,255,255,.75) 50%, transparent 50%), radial-gradient(1.5px 1.5px at 44% 7%, rgba(255,255,255,.5) 50%, transparent 50%), radial-gradient(1px 1px at 69% 19%, rgba(255,255,255,.6) 50%, transparent 50%), radial-gradient(1.5px 1.5px at 86% 11%, rgba(255,255,255,.5) 50%, transparent 50%), radial-gradient(1px 1px at 10% 29%, rgba(255,255,255,.4) 50%, transparent 50%), radial-gradient(1.5px 1.5px at 58% 27%, rgba(255,255,255,.5) 50%, transparent 50%), radial-gradient(1px 1px at 33% 21%, rgba(255,255,255,.45) 50%, transparent 50%), radial-gradient(1px 1px at 77% 33%, rgba(255,255,255,.4) 50%, transparent 50%); }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 14%; background: linear-gradient(180deg, rgba(49,46,129,.9) 0%, #1e1b4b 55%, #0c0a18 100%); border-top: 1px solid rgba(139,92,246,.3); }
.ground::after { content: ''; position: absolute; top: -2px; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(167,139,250,.65), transparent); }
.path-line { position: absolute; left: 50%; top: 6%; bottom: 6%; width: 2px; background: repeating-linear-gradient(180deg, rgba(167,139,250,.5) 0 7px, transparent 7px 14px); transform: translateX(-50%); opacity: .35; pointer-events: none; animation: pathScroll 1.4s linear infinite; will-change: transform; }
@keyframes pathScroll { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-14px); } }

.ready-overlay { position: absolute; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 34%; pointer-events: none; opacity: 0; transition: opacity .2s ease; }
.ready-overlay.show { opacity: 1; }
.ready-word { font-size: clamp(52px, 15vw, 96px); font-weight: 900; letter-spacing: 4px; background: linear-gradient(135deg, #38bdf8, #a78bfa, #f472b6); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 8px 28px rgba(56,189,248,.55)); animation: readyIn .6s cubic-bezier(.34,1.56,.64,1); }
.ready-word.go { background: linear-gradient(135deg, #fbbf24, #f97316, #ef4444); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 8px 28px rgba(251,191,36,.65)); animation: goIn .55s cubic-bezier(.34,1.56,.64,1); }
@keyframes readyIn { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes goIn { 0% { transform: scale(.6) translateY(10px); opacity: 0; } 55% { transform: scale(1.2) translateY(0); opacity: 1; } 100% { transform: scale(1.05); opacity: 1; } }

.rules-panel { position: absolute; left: 50%; bottom: 23%; transform: translateX(-50%); z-index: 15; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; opacity: 0; transition: opacity .45s ease; max-width: 92%; }
.rules-panel.show { opacity: 1; }
.rule-line { font-size: 14px; font-weight: 600; color: rgba(226,232,240,.9); background: rgba(15,23,42,.82); border: 1px solid rgba(148,163,184,.22); border-radius: 8px; padding: 6px 14px; white-space: nowrap; letter-spacing: .2px; opacity: 0; animation: ruleIn .42s ease-out forwards; box-shadow: 0 2px 10px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.05); line-height: 1.4; }
.rule-line.gold { color: rgba(251,191,36,.95); border-color: rgba(251,191,36,.34); background: rgba(30,24,10,.82); }
.rule-line.blue { color: rgba(125,211,252,.95); border-color: rgba(56,189,248,.34); background: rgba(8,25,42,.82); }
@keyframes ruleIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.chest { position: absolute; width: 90px; height: 90px; margin-left: -45px; top: -120px; z-index: 50; cursor: pointer; display: flex; align-items: center; justify-content: center; will-change: top; -webkit-tap-highlight-color: transparent; pointer-events: auto; transition: top .9s cubic-bezier(.34,1.56,.64,1); }
.chest.paused { filter: grayscale(.8) brightness(.7); pointer-events: none; animation-play-state: paused !important; }
.chest.paused * { animation-play-state: paused !important; }
.chest-icon { position: relative; font-size: 54px; line-height: 1; filter: drop-shadow(0 0 20px rgba(251,191,36,.9)) drop-shadow(0 4px 10px rgba(0,0,0,.6)); z-index: 2; transition: transform .15s ease; }
.chest-aura { position: absolute; inset: -10px; border-radius: 50%; background: radial-gradient(circle, rgba(251,191,36,.5) 0%, rgba(251,191,36,0) 68%); opacity: 0; transition: opacity .4s ease; pointer-events: none; }
.chest-ring { position: absolute; inset: 2px; border-radius: 50%; border: 2px dashed rgba(251,191,36,.8); opacity: 0; pointer-events: none; transition: opacity .4s ease; }
.chest.landed { animation: chestBob 1.5s ease-in-out infinite; }
.chest.landed .chest-aura { opacity: 1; animation: chestAuraPulse 1.4s ease-in-out infinite; }
.chest.landed .chest-ring { opacity: .85; animation: chestRingSpin 3s linear infinite; }
.chest.landed .chest-icon { filter: drop-shadow(0 0 22px rgba(251,191,36,1)) drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
@keyframes chestBob { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.02); } }
@keyframes chestAuraPulse { 0%,100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.2); opacity: 1; } }
@keyframes chestRingSpin { to { transform: rotate(360deg); } }
.chest.opened { animation: none; pointer-events: none; cursor: default; }
.chest.opened .chest-ring, .chest.opened .chest-aura { animation: none; opacity: 0; transition: opacity .2s; }
.chest.opened .chest-icon { animation: chestShake .38s ease-in-out; }
@keyframes chestShake { 0%,100% { transform: rotate(0) scale(1); } 20% { transform: rotate(-10deg) scale(1.15); } 40% { transform: rotate(10deg) scale(1.22); } 60% { transform: rotate(-8deg) scale(1.28); } 80% { transform: rotate(8deg) scale(1.35); } }
.chest.fadeout { opacity: 0; transition: opacity .55s ease, top .9s ease; }
.chest.burst { animation: chestBurstAnim .5s cubic-bezier(.22,1,.36,1) forwards; pointer-events: none; }
@keyframes chestBurstAnim { 0% { transform: scale(1); opacity: 1; filter: brightness(1); } 40% { transform: scale(1.5); opacity: 1; filter: brightness(2.4); } 100% { transform: scale(2.8); opacity: 0; filter: brightness(3.2); } }
.burst-star { position: fixed; pointer-events: none; z-index: 999; filter: drop-shadow(0 0 10px currentColor); animation: burstFly 1.05s cubic-bezier(.22,1,.36,1) forwards; will-change: transform, opacity; }
@keyframes burstFly { 0% { transform: translate(-50%,-50%) scale(0) rotate(0deg); opacity: 0; } 18% { transform: translate(-50%,-50%) scale(1.3) rotate(30deg); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.4) rotate(240deg); opacity: 0; } }

.player { position: absolute; left: 50%; bottom: 12%; margin-left: calc(clamp(46px, 12vw, 68px) / -2); line-height: 1; z-index: 30; transition: bottom .75s var(--ease-spring); text-align: center; display: flex; flex-direction: column; align-items: center; }
.player-emoji { position: relative; display: inline-flex; align-items: center; justify-content: center; width: clamp(46px, 12vw, 68px); height: clamp(46px, 12vw, 68px); line-height: 1; filter: drop-shadow(0 0 16px rgba(56,189,248,.6)); animation: playerIdle 1.8s ease-in-out infinite; will-change: transform; }
@keyframes playerIdle { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.04); } }
.avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2.5px solid rgba(56,189,248,.9); box-shadow: 0 0 20px rgba(56,189,248,.7), inset 0 0 10px rgba(0,0,0,.3); background: #1e293b; }
.shield-aura { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid rgba(56,189,248,.85); box-shadow: 0 0 36px rgba(56,189,248,.9), inset 0 0 26px rgba(56,189,248,.5); display: none; pointer-events: none; animation: auraPulse 1.2s ease-in-out infinite; }
.player.shielded .shield-aura { display: block; }
@keyframes auraPulse { 0%,100% { transform: scale(1); opacity: .72; } 50% { transform: scale(1.15); opacity: 1; } }
.shield-timer { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); font-size: 14px; font-weight: 800; color: #7dd3fc; background: rgba(15,23,42,.92); border: 1px solid rgba(56,189,248,.5); border-radius: 999px; padding: 2px 8px; letter-spacing: .1px; box-shadow: 0 1px 6px rgba(0,0,0,.5), 0 0 10px rgba(56,189,248,.35); white-space: nowrap; display: none; pointer-events: none; z-index: 3; font-variant-numeric: tabular-nums; line-height: 1.3; }
.player.shielded .shield-timer { display: block; }
.item-bag { position: absolute; left: calc(100% - 4px); bottom: 0px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; z-index: 4; }
.item-chip { display: flex; align-items: center; gap: 3px; padding: 4px 10px; border-radius: 8px; background: rgba(15,23,42,.92); border: 1px solid rgba(56,189,248,.42); font-size: 14px; font-weight: 800; color: #7dd3fc; box-shadow: 0 1px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); animation: itemPop .35s var(--ease-spring); line-height: 1; white-space: nowrap; }
.item-chip b { color: #fbbf24; font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; }
@keyframes itemPop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.player-status { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; z-index: 3; }
.status-label { display: flex; justify-content: space-between; width: 162px; font-size: 11px; font-weight: 700; color: #cbd5e1; margin-bottom: 1px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.timer-badge { font-size: 13px; font-weight: 800; color: #7dd3fc; background: rgba(15,23,42,.92); border: 1px solid rgba(56,189,248,.42); border-radius: 999px; padding: 3px 10px; white-space: nowrap; letter-spacing: .3px; box-shadow: 0 2px 10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 2px; }
.player-hp { width: 162px; height: 12px; border-radius: 6px; background: rgba(2,6,23,.8); border: 1px solid rgba(148,163,184,.34); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.5); }
.player-hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #f97316, #22c55e); background-size: 162px 100%; transition: width .28s var(--ease-out); box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.streak-bar-wrap { width: 162px; display: none; flex-direction: column; }
.streak-bar-wrap.show { display: flex; }
.streak-bar-fill { height: 6px; width: 0%; background: linear-gradient(90deg, #fbbf24, #f59e0b); transition: width .3s var(--ease-spring); box-shadow: 0 0 8px rgba(251,191,36,.8); border-radius: 3px; }
.treasure { position: absolute; left: 50%; bottom: 88%; margin-left: calc(clamp(46px, 12vw, 68px) / -2); font-size: clamp(40px, 11vw, 64px); line-height: 1; z-index: 11; filter: drop-shadow(0 0 20px rgba(251,191,36,.85)); animation: treasureFloat 2s ease-in-out infinite; will-change: transform; }
@keyframes treasureFloat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

.enemy { position: absolute; width: clamp(52px, 14vw, 76px); height: clamp(52px, 14vw, 76px); margin-left: calc(clamp(52px, 14vw, 76px) / -2); margin-bottom: calc(clamp(52px, 14vw, 76px) / -2); z-index: 10; cursor: pointer; transition: transform .12s; }
.enemy:active { transform: scale(.9); }
.enemy-inner { width: 100%; height: 100%; transform-origin: center center; transition: transform .3s ease; }
.enemy.bloating .enemy-inner { transform: scale(1.8); transition: transform 120s linear; }
.enemy.bloating .enemy-orb::before { content: ''; position: absolute; inset: -12px; border-radius: 50%; border: 2px solid rgba(239,68,68,.9); pointer-events: none; animation: eliteRingPulse 1s ease-in-out infinite; }
@keyframes eliteRingPulse { 0%,100% { opacity: .4; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.1); } }
.enemy.streak-warning .enemy-orb::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid #fbbf24; pointer-events: none; animation: streakRingPulse .6s ease-in-out infinite; }
@keyframes streakRingPulse { 0%,100% { opacity: .35; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.1); } }
.enemy-orb { width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: clamp(24px, 6.5vw, 36px); animation: floatY 1.6s ease-in-out infinite; position: relative; }
@keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.enemy.mystery::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 2px dashed rgba(251,191,36,.85); pointer-events: none; z-index: 1; animation: mysteryGlow 1.4s ease-in-out infinite; }
@keyframes mysteryGlow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.enemy-tag { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); font-size: clamp(10px, 2.8vw, 12px); font-weight: 700; line-height: 1; letter-spacing: .1px; padding: 3px 6px; border-radius: 5px; white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.enemy.blue .enemy-tag { color: #dff3ff; background: rgba(7,89,133,.88); border: 1px solid rgba(125,211,252,.55); box-shadow: 0 1px 4px rgba(0,0,0,.45); }
.enemy.orange .enemy-tag { color: #ffe9d4; background: rgba(154,52,18,.9); border: 1px solid rgba(253,186,116,.55); box-shadow: 0 1px 4px rgba(0,0,0,.45); }
.enemy.red .enemy-tag { color: #ffe0e0; background: rgba(127,29,29,.92); border: 1px solid rgba(252,165,165,.55); box-shadow: 0 1px 4px rgba(0,0,0,.45); }
.enemy.blue .enemy-orb { background: radial-gradient(circle at 34% 30%, #7dd3fc, #0ea5e9 55%, #075985); box-shadow: 0 0 22px rgba(56,189,248,.85), inset 0 -5px 10px rgba(0,0,0,.35); border: 2px solid rgba(186,230,253,.6); animation: floatY 1.6s ease-in-out infinite var(--d1, 0s); }
.enemy.orange .enemy-orb { background: radial-gradient(circle at 34% 30%, #fdba74, #f97316 55%, #9a3412); box-shadow: 0 0 24px rgba(249,115,22,.9), inset 0 -5px 10px rgba(0,0,0,.35); border: 2px solid rgba(254,215,170,.6); animation: floatY 1.6s ease-in-out infinite var(--d1, 0s); }
.enemy.red .enemy-orb { background: radial-gradient(circle at 34% 30%, #fca5a5, #ef4444 55%, #7f1d1d); box-shadow: 0 0 26px rgba(239,68,68,.9), inset 0 -5px 10px rgba(0,0,0,.35); border: 2px solid rgba(254,202,202,.6); animation: floatY 1.6s ease-in-out infinite var(--d1, 0s); }
.enemy.red.aiming .enemy-orb { filter: brightness(1.4); }
.enemy.die { pointer-events: none; animation: dieBreak .42s forwards; }
@keyframes dieBreak { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.4); opacity: .95; filter: brightness(2.2); } 100% { transform: scale(0); opacity: 0; } }
.enemy.hit .enemy-orb { animation: hitShake .26s; }
@keyframes hitShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes spawnBounce { 0% { transform: scale(0) translateY(-50px); opacity: 0; } 60% { transform: scale(1.3) translateY(10px); opacity: 1; } 100% { transform: scale(1) translateY(0); opacity: 1; } }

.aim-line { position: absolute; height: 2px; pointer-events: none; z-index: 5; transform-origin: 0 50%; animation: aimBlink .5s ease-in-out infinite; border-radius: 1px; }
.aim-line.aim-blue { background: linear-gradient(90deg, rgba(56,189,248,.7), rgba(56,189,248,0)); }
.aim-line.aim-orange { background: linear-gradient(90deg, rgba(249,115,22,.8), rgba(249,115,22,0)); }
.aim-line.aim-red { background: linear-gradient(90deg, rgba(239,68,68,.9), rgba(239,68,68,0)); height: 2.5px; }
@keyframes aimBlink { 0%,100% { opacity: .22; } 50% { opacity: .7; } }

.proj { position: absolute; width: 15px; height: 15px; margin-left: -7px; margin-bottom: -7px; border-radius: 50%; z-index: 8; pointer-events: none; }
.proj.blue { background: radial-gradient(circle at 35% 32%, #bae6fd, #0ea5e9 60%, #075985); box-shadow: 0 0 16px rgba(56,189,248,1); }
.proj.orange { background: radial-gradient(circle at 35% 32%, #fed7aa, #f97316 60%, #9a3412); box-shadow: 0 0 16px rgba(249,115,22,1); width: 17px; height: 17px; margin-left: -8px; margin-bottom: -8px; }
.proj.red { background: radial-gradient(circle at 35% 32%, #fecaca, #ef4444 60%, #7f1d1d); box-shadow: 0 0 20px rgba(239,68,68,1); width: 18px; height: 18px; margin-left: -9px; margin-bottom: -9px; }
.proj::before { content: ''; position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.35) 0%, transparent 70%); animation: projGlow .5s ease-in-out infinite; }
@keyframes projGlow { 0%,100% { transform: scale(.8); opacity: .5; } 50% { transform: scale(1.4); opacity: 1; } }

.shield-shatter { position: fixed; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; border: 2px solid rgba(56,189,248,.92); box-shadow: 0 0 14px rgba(56,189,248,.8), inset 0 0 10px rgba(56,189,248,.5); pointer-events: none; z-index: 30; animation: shatterRing .5s ease-out forwards; }
@keyframes shatterRing { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(3.2); opacity: 0; } }

.buff-bar { position: absolute; left: 12px; top: 12px; z-index: 40; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.buff-chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: .2px; background: rgba(15,23,42,.92); border: 1px solid rgba(56,189,248,.45); color: #7dd3fc; box-shadow: 0 3px 12px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); white-space: nowrap; animation: chipIn .3s var(--ease-spring); font-variant-numeric: tabular-nums; }

@keyframes chipIn { from { transform: translateX(-14px) scale(.85); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }

.toast-wrap { position: absolute; left: 50%; top: 15%; transform: translateX(-50%); z-index: 45; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; width: max-content; max-width: 92%; }

@keyframes toastIn { 0% { transform: translateY(-14px) scale(.8); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
@keyframes toastOut { to { transform: translateY(-12px) scale(.92); opacity: 0; } }

.toast-text { display: flex; flex-direction: column; gap: 3px; }

.toast-text span { font-size: 13px; color: var(--txt-dim); line-height: 1.2; }

.footer { flex: 0 0 auto; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 14px; color: var(--txt-mute); text-align: center; background: rgba(15,23,42,.96); border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.review-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 999px; border: 1px solid rgba(167,139,250,.42); background: rgba(167,139,250,.12); color: #c4b5fd; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .18s var(--ease-out); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }

.review-btn:active { transform: scale(.95); }
.review-btn b { color: #fbbf24; font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
.home-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 999px; border: 1px solid rgba(56,189,248,.42); background: rgba(56,189,248,.12); color: #7dd3fc; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .18s var(--ease-out); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.home-btn:hover { background: rgba(56,189,248,.22); border-color: rgba(56,189,248,.68); color: #bae6fd; }

.app-modal-mask { position: fixed; inset: 0; z-index: 9999; background: rgba(2,6,23,.78); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .26s ease; padding: 24px; }

.modal-mask { position: fixed; inset: 0; z-index: 500; background: radial-gradient(circle at 50% 100%, rgba(30,27,75,.85) 0%, rgba(2,6,23,.94) 62%); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .26s ease; }

.pause-hint-mask { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(28px, 7vw, 36px); font-weight: 900; color: rgba(255, 255, 255, 0.15); pointer-events: none; z-index: 0; letter-spacing: 8px; white-space: nowrap; }
.modal { position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: linear-gradient(180deg, #1b2540 0%, #0f172a 52%, #0b1220 100%); border-radius: 24px 24px 0 0; border: 1px solid rgba(148,163,184,.22); border-bottom: none; padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -24px 70px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06); transform: translateY(100%); transition: transform .34s var(--ease-out); scrollbar-width: none; z-index: 1; }

.modal::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 74%; height: 1px; background: linear-gradient(90deg, transparent, rgba(56,189,248,.65), rgba(167,139,250,.65), transparent); pointer-events: none; }
.modal-grip { width: 44px; height: 5px; border-radius: 3px; background: rgba(148,163,184,.3); margin: 6px auto 16px; box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
.modal-top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; position: relative; }

.word-avatar.red { background: radial-gradient(circle at 34% 30%, #fca5a5, #ef4444 55%, #7f1d1d); box-shadow: 0 0 18px rgba(239,68,68,.8), inset 0 -4px 8px rgba(0,0,0,.35); border: 2px solid rgba(254,202,202,.6); }

.modal-close { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(148,163,184,.25); background: rgba(148,163,184,.08); color: var(--txt-dim); font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto; transition: all .22s var(--ease-out); font-family: inherit; }
.modal-close:hover { background: rgba(239,68,68,.18); color: #fca5a5; border-color: rgba(239,68,68,.42); transform: rotate(90deg); }
.modal-close:active { transform: rotate(90deg) scale(.9); }

.phon-bubble { position: absolute; top: 100px; left: 50%; transform: translateX(-50%) translateY(-6px); padding: 6px 16px; border-radius: 999px; background: rgba(56,189,248,.16); border: 1px solid rgba(56,189,248,.45); color: #7dd3fc; font-size: 16px; font-family: "Lucida Sans Unicode", "Segoe UI", sans-serif; letter-spacing: .3px; opacity: 0; pointer-events: none; transition: opacity .28s ease, transform .28s ease; z-index: 10; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.5), 0 0 18px rgba(56,189,248,.3); font-weight: 600; }
.phon-bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.q-area { margin-top: 2px; background: rgba(2,6,23,.42); border: 1px solid rgba(148,163,184,.1); border-radius: 16px; padding: 24px 20px; min-height: 140px; display: flex; flex-direction: column; justify-content: center; box-shadow: inset 0 2px 10px rgba(0,0,0,.28); position: relative; overflow: hidden; }
.q-area::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(148,163,184,.18), transparent); }
.q-en { font-size: clamp(18px, 5vw, 22px); line-height: 1.9; color: #e8edf5; margin-bottom: 12px; word-break: break-word; letter-spacing: .3px; }
.q-cn { font-size: clamp(14px, 4vw, 16px); color: var(--txt-dim); margin-bottom: 2px; }
.blank { display: inline-block; border-bottom: 3px solid var(--green); text-align: center; font-weight: 800; color: #f8fafc; padding: 0 12px; min-width: 100px; vertical-align: middle; min-height: 1.35em; letter-spacing: .8px; transition: color .15s, border-color .15s; }
.blank .caret { display: inline-block; width: 3px; height: 1em; background: var(--green); vertical-align: -2px; margin-left: 2px; border-radius: 1px; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

.feedback { margin-top: 0; padding: 0 18px; border-radius: 12px; font-size: 16px; line-height: 1.6; display: block; opacity: 0; overflow: hidden; box-sizing: border-box; border: 1px solid transparent; transition: margin-top .3s cubic-bezier(.22,1,.36,1), opacity .25s ease; }
.feedback.ok, .feedback.err { margin-top: 16px; padding: 14px 18px; opacity: 1; }
.feedback.ok { background: linear-gradient(135deg, rgba(16,185,129,.16), rgba(5,150,105,.1)); color: #6ee7b7; border-color: rgba(16,185,129,.38); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.feedback.err { background: linear-gradient(135deg, rgba(239,68,68,.16), rgba(185,28,28,.1)); color: #fca5a5; border-color: rgba(239,68,68,.38); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.feedback b { color: #fff; font-size: 18px; letter-spacing: .3px; }

.keyboard { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 20px; }
.key { position: relative; height: 52px; border-radius: 12px; background: linear-gradient(180deg, rgba(51,65,85,.94), rgba(30,41,59,.98)); color: #e2e8f0; font-size: 22px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(148,163,184,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -1px 0 rgba(0,0,0,.2), 0 2px 0 rgba(0,0,0,.42), 0 3px 6px rgba(0,0,0,.25); transition: transform .08s ease, box-shadow .08s ease, background .15s ease, color .15s ease, border-color .15s ease; font-family: inherit; overflow: hidden; }
.key:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 1px 6px rgba(0,0,0,.35), 0 0 0 rgba(0,0,0,.42); background: linear-gradient(180deg, rgba(56,189,248,.42), rgba(30,64,110,.96)); color: #fff; border-color: rgba(56,189,248,.35); }
.key.hint { background: linear-gradient(180deg, rgba(251,191,36,.55), rgba(180,83,9,.85)); color: #fff; border-color: rgba(251,191,36,.72); text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.key.del { background: linear-gradient(180deg, rgba(51,65,85,.94), rgba(30,41,59,.98)); color: #fca5a5; border: 1px solid rgba(239,68,68,.28); }
.key.del:active { background: linear-gradient(180deg, rgba(239,68,68,.62), rgba(127,29,29,.95)); color: #fff; border-color: rgba(239,68,68,.62); }
.key.space { grid-column: span 2; font-size: 15px; font-weight: 700; color: var(--txt-dim); letter-spacing: 1px; background: linear-gradient(180deg, rgba(41,54,73,.85), rgba(24,33,48,.95)); }
.key.confirm { grid-column: span 6; background: linear-gradient(180deg, #38bdf8 0%, #0ea5e9 52%, #0369a1 100%); color: #fff; font-size: 20px; font-weight: 900; letter-spacing: 3px; border: 1px solid rgba(125,211,252,.42); box-shadow: inset 0 1px 0 rgba(255,255,255,.42), inset 0 -2px 8px rgba(7,45,80,.3), 0 2px 0 rgba(3,45,80,.9), 0 6px 20px rgba(56,189,248,.32); text-shadow: 0 1px 2px rgba(0,0,0,.32); }
.key.confirm:active { transform: translateY(2px); background: linear-gradient(180deg, #0ea5e9 0%, #0369a1 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 2px 8px rgba(7,45,80,.35), 0 1px 0 rgba(3,45,80,.9); }
.key.confirm::after, .btn-primary::after, .splash-start::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(110deg, transparent 34%, rgba(255,255,255,.42) 50%, transparent 66%); pointer-events: none; transform: translateX(150%); animation: shineSlide 3.4s ease-in-out infinite; will-change: transform; }
@keyframes shineSlide { 0%, 55% { transform: translateX(150%); } 100% { transform: translateX(-150%); } }

.result-mask { position: fixed; inset: 0; z-index: 600; background: radial-gradient(circle at 50% 42%, rgba(30,27,75,.85) 0%, rgba(2,6,23,.94) 72%); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.result-mask.show { opacity: 1; pointer-events: auto; }
.result-card { position: relative; width: 100%; max-width: 380px; background: linear-gradient(180deg, #1b2540 0%, #0f172a 58%, #0b1220 100%); border: 1px solid rgba(251,191,36,.3); border-radius: 24px; padding: 32px 26px 26px; text-align: center; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.82), 0 0 70px rgba(251,191,36,.14), inset 0 1px 0 rgba(255,255,255,.08); transform: scale(.9) translateY(14px); opacity: 0; transition: transform .46s var(--ease-spring), opacity .32s ease; }
.result-mask.show .result-card { transform: scale(1) translateY(0); opacity: 1; }
.result-card.lose { border-color: rgba(239,68,68,.36); box-shadow: 0 30px 80px rgba(0,0,0,.82), 0 0 70px rgba(239,68,68,.18), inset 0 1px 0 rgba(255,255,255,.08); }
.result-rays { position: absolute; left: 50%; top: -14%; width: 400px; height: 400px; margin-left: -200px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(251,191,36,.13) 0deg 7deg, transparent 7deg 21deg); animation: raysSpin 26s linear infinite; pointer-events: none; opacity: .75; -webkit-mask-image: radial-gradient(circle, #000 16%, transparent 68%); mask-image: radial-gradient(circle, #000 16%, transparent 68%); }
.result-card.lose .result-rays { background: repeating-conic-gradient(from 0deg, rgba(239,68,68,.11) 0deg 7deg, transparent 7deg 21deg); }
@keyframes raysSpin { to { transform: rotate(360deg); } }
.result-icon-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
.result-icon-glow { position: absolute; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(251,191,36,.45) 0%, transparent 64%); animation: glowPulse 2.6s ease-in-out infinite; }
.result-card.lose .result-icon-glow { background: radial-gradient(circle, rgba(239,68,68,.42) 0%, transparent 64%); }
@keyframes glowPulse { 0%,100% { transform: scale(1); opacity: .65; } 50% { transform: scale(1.18); opacity: 1; } }
.result-icon { position: relative; font-size: 64px; line-height: 1; filter: drop-shadow(0 6px 18px rgba(251,191,36,.55)); }
.result-card.lose .result-icon { filter: drop-shadow(0 6px 18px rgba(239,68,68,.55)); }
.result-mask.show .result-icon { animation: iconPop .62s var(--ease-spring) .14s both; }
@keyframes iconPop { 0% { transform: scale(0) rotate(-28deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
.result-badge { display: inline-block; font-size: 14px; font-weight: 900; letter-spacing: 1.5px; padding: 5px 15px; border-radius: 999px; margin-bottom: 10px; background: rgba(251,191,36,.13); color: var(--gold); border: 1px solid rgba(251,191,36,.36); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.result-card.lose .result-badge { background: rgba(239,68,68,.13); color: #fca5a5; border-color: rgba(239,68,68,.36); }
.result-title { font-size: 22px; font-weight: 900; margin-bottom: 14px; color: #f8fafc; letter-spacing: .3px; }
.result-card.lose .result-title { color: #fecaca; }
.result-stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; min-height: 28px; }
.result-star { font-size: 28px; line-height: 1; filter: drop-shadow(0 0 9px rgba(251,191,36,.75)); }
.result-mask.show .result-star { animation: starPop .5s var(--ease-spring) both; }
.result-star.off { filter: grayscale(1) brightness(.36); opacity: .55; }
@keyframes starPop { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
.result-stats { display: flex; gap: 10px; margin-bottom: 24px; }
.result-stat { flex: 1; background: linear-gradient(180deg, rgba(148,163,184,.1), rgba(148,163,184,.04)); border-radius: 14px; padding: 12px 8px 10px; border: 1px solid rgba(148,163,184,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
.result-mask.show .result-stat { animation: statIn .42s var(--ease-out) both; }
.result-stat:nth-child(1) { animation-delay: .34s; }
.result-stat:nth-child(2) { animation-delay: .44s; }
.result-stat:nth-child(3) { animation-delay: .54s; }
@keyframes statIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.result-stat b { display: block; font-size: 24px; font-weight: 900; color: var(--gold); margin-bottom: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.result-card.lose .result-stat b { color: #f87171; }
.result-stat span { font-size: 13px; color: var(--txt-mute); letter-spacing: .5px; }
.result-actions { display: flex; flex-direction: column; gap: 12px; }
.btn-primary { position: relative; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 48%, #d97706 100%); color: #1f1300; font-size: 18px; font-weight: 900; letter-spacing: 1.5px; cursor: pointer; overflow: hidden; font-family: inherit; border: 1px solid rgba(255,224,140,.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 8px rgba(120,53,15,.35), 0 2px 0 rgba(146,64,14,.9), 0 8px 26px rgba(245,158,11,.36); transition: transform .12s ease, box-shadow .12s ease, filter .12s ease; }

/* =========================================================
   我方星形子弹：加大 + 多层光芒 + 脉冲光晕
   结构：父元素只负责定位；::before 是星形本体；::after 是外圈光晕
   ========================================================= */
.hero-proj {
  position: absolute;
  width: 22px;
  height: 22px;
  margin: -11px 0 0 -11px;
  z-index: 25;
  pointer-events: none;
}

/* 星形本体（clip-path 裁剪 + 跟随星形轮廓的多层光）
   注意：不能用 box-shadow，会被 clip-path 一起裁掉，必须用 filter: drop-shadow */
.hero-proj::before {
  content: '';
  position: absolute;
  inset: 0;
  background: #fbbf24;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  filter:
    drop-shadow(0 0 5px #fbbf24)
    drop-shadow(0 0 12px #fbbf24)
    drop-shadow(0 0 22px rgba(251,191,36,.7));
  z-index: 2;
  animation: heroProjPulse .7s ease-in-out infinite;
}

/* 外圈光晕（在父元素外面扩展，父元素没裁剪，所以能正常显示） */
.hero-proj::after {
  content: '';
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(251,191,36,.65) 0%,
    rgba(251,191,36,.22) 42%,
    transparent 72%);
  z-index: 1;
  pointer-events: none;
  animation: heroProjHalo .9s ease-in-out infinite;
}

/* 光芒脉冲：整体亮度一呼一吸 */
@keyframes heroProjPulse {
  0%, 100% {
    filter:
      drop-shadow(0 0 5px #fbbf24)
      drop-shadow(0 0 12px #fbbf24)
      drop-shadow(0 0 22px rgba(251,191,36,.7));
  }
  50% {
    filter:
      drop-shadow(0 0 10px #fbbf24)
      drop-shadow(0 0 22px #fbbf24)
      drop-shadow(0 0 38px rgba(251,191,36,1));
  }
}

/* 外圈光晕：缩放 + 明暗脉动 */
@keyframes heroProjHalo {
  0%, 100% { transform: scale(.82); opacity: .55; }
  50%      { transform: scale(1.18); opacity: 1; }
}

/* =========================================================
   003 急速星芒 —— 蓝色，略小，偏冷
   ========================================================= */
.hero-proj.fast {
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
}
.hero-proj.fast::before {
  background: #38bdf8;
  filter:
    drop-shadow(0 0 5px #38bdf8)
    drop-shadow(0 0 12px #38bdf8)
    drop-shadow(0 0 22px rgba(56,189,248,.7));
  animation-name: heroProjPulseFast;
}
.hero-proj.fast::after {
  background: radial-gradient(circle,
    rgba(56,189,248,.65) 0%,
    rgba(56,189,248,.22) 42%,
    transparent 72%);
}
@keyframes heroProjPulseFast {
  0%, 100% {
    filter:
      drop-shadow(0 0 5px #38bdf8)
      drop-shadow(0 0 12px #38bdf8)
      drop-shadow(0 0 22px rgba(56,189,248,.7));
  }
  50% {
    filter:
      drop-shadow(0 0 10px #38bdf8)
      drop-shadow(0 0 22px #38bdf8)
      drop-shadow(0 0 38px rgba(56,189,248,1));
  }
}

/* =========================================================
   004 重击星芒 —— 红色，更大，更烈
   ========================================================= */
.hero-proj.strong {
  width: 28px;
  height: 28px;
  margin: -14px 0 0 -14px;
}
.hero-proj.strong::before {
  background: #ef4444;
  filter:
    drop-shadow(0 0 7px #ef4444)
    drop-shadow(0 0 16px #ef4444)
    drop-shadow(0 0 30px rgba(239,68,68,.8));
  animation-name: heroProjPulseStrong;
}
.hero-proj.strong::after {
  inset: -18px;
  background: radial-gradient(circle,
    rgba(239,68,68,.7) 0%,
    rgba(239,68,68,.25) 44%,
    transparent 76%);
}
@keyframes heroProjPulseStrong {
  0%, 100% {
    filter:
      drop-shadow(0 0 7px #ef4444)
      drop-shadow(0 0 16px #ef4444)
      drop-shadow(0 0 30px rgba(239,68,68,.8));
  }
  50% {
    filter:
      drop-shadow(0 0 14px #ef4444)
      drop-shadow(0 0 30px #ef4444)
      drop-shadow(0 0 50px rgba(239,68,68,1));
  }
}

<script>
/* =========================================================
   0. 角色数据 & 选择逻辑 & 技能状态
   ========================================================= */
const CHAR_DATA = [
  { id: '001', name: '兵王冷毅', desc: '【浴火重生】死亡后自动满血复活，最多两次。' },
  { id: '002', name: '冒险之剑', desc: '【定点爆破】战斗中获取炸弹，可对敌人造成大范围伤害。' },
  { id: '003', name: '安智理', desc: '【急速星芒】自动发射高频子弹，威力较弱但连绵不绝。' },
  { id: '004', name: '桀骜速风', desc: '【重击星芒】自动发射低频星形子弹，速度慢但威力极强。' },
  { id: '005', name: '婉离疏', desc: '【时间音波】释放音波，让全体敌人静止30秒，任你输出。' },
  { id: '006', name: '蒙奇路飞', desc: '【吞噬符咒】使用符咒，让随机一名敌人渐隐消失。' },
  { id: '007', name: '幻纱之灵', desc: '【狂风呼啸】召唤飓风，将随机三名敌人吹飞出屏幕。' }
];

let currentAvatar = localStorage.getItem('dd_avatar') || '001.png';
let charId = currentAvatar.replace('.png', '');

const CHAR_SKILLS = {
  reviveLeft: 2, bombLeft: 2, charmLeft: 2, hurricaneLeft: 2, freezeUntil: 0, heroFireTimer: 0
};

(function initCharSelect() {
  const track = document.getElementById('charTrack');
  const mainImg = document.getElementById('mainAvatarImg');
  const nameEl = document.getElementById('charNameDisplay');
  const descEl = document.getElementById('charDescDisplay');

  let currentIndex = CHAR_DATA.findIndex(c => c.id === charId);
  if (currentIndex === -1) currentIndex = 0;

  CHAR_DATA.forEach((char, index) => {
    const div = document.createElement('div');
    div.className = 'char-item';
    const img = document.createElement('img');
    img.src = char.id + '.png';
    img.onerror = function() { this.src = 'data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgMTAwIDEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0NSIgZmlsbD0iIzQ3NTU2OSIvPjx0ZXh0IHg9IjUwIiB5PSI2NSIgZm9udC1zaXplPSI1MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZmZiI+77yfPC90ZXh0Pjwvc3ZnPg=='; };
    div.appendChild(img);
    div.addEventListener('click', () => {
      if (Math.abs(startX - endX) > 10) return;
      selectChar(index);
    });
    track.appendChild(div);
  });

  const items = Array.from(track.children);

  function getCenterOffset(index) {
    const itemWidth = 64;
    const gap = 20;
    const itemSpace = itemWidth + gap;
    return -(index * itemSpace + itemWidth / 2);
  }

  function selectChar(index, animate = true) {
    currentIndex = index;
    currentAvatar = CHAR_DATA[index].id + '.png';
    charId = CHAR_DATA[index].id;
    localStorage.setItem('dd_avatar', currentAvatar);
    if (mainImg) mainImg.src = currentAvatar;
    if (nameEl) nameEl.textContent = CHAR_DATA[index].name;
    if (descEl) descEl.textContent = CHAR_DATA[index].desc;
    items.forEach((item, i) => { item.classList.toggle('active', i === index); });
    if (animate) track.style.transition = 'transform 0.4s cubic-bezier(0.22, 1, 0.36, 1)';
    else track.style.transition = 'none';
    track.style.transform = `translate(${getCenterOffset(index)}px, -50%)`;
    if (typeof sfxClick === 'function') sfxClick();
  }

  setTimeout(() => selectChar(currentIndex, false), 50);

  let isDragging = false;
  let startX = 0, startY = 0, endX = 0;
  let currentTranslate = 0, prevTranslate = 0;

  track.addEventListener('touchstart', touchStart, { passive: true });
  track.addEventListener('touchmove', touchMove, { passive: false });
  track.addEventListener('touchend', touchEnd);
  track.addEventListener('mousedown', touchStart);
  window.addEventListener('mousemove', touchMove);
  window.addEventListener('mouseup', touchEnd);

  function touchStart(e) {
    if (e.type === 'mousedown' && e.button !== 0) return;
    startX = getPositionX(e);
    startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    endX = startX;
    const style = window.getComputedStyle(track);
    const matrix = new DOMMatrixReadOnly(style.transform);
    prevTranslate = matrix.m41;
    isDragging = true;
    track.classList.add('dragging');
  }
  function touchMove(e) {
    if (!isDragging) return;
    const currentX = getPositionX(e);
    const currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    const diffX = currentX - startX, diffY = currentY - startY;
    if (e.type === 'touchmove' && Math.abs(diffX) > Math.abs(diffY)) e.preventDefault();
    currentTranslate = prevTranslate + diffX;
    const minOffset = getCenterOffset(CHAR_DATA.length - 1);
    const maxOffset = getCenterOffset(0);
    if (currentTranslate > maxOffset) currentTranslate = maxOffset + (currentTranslate - maxOffset) * 0.3;
    else if (currentTranslate < minOffset) currentTranslate = minOffset + (currentTranslate - minOffset) * 0.3;
    track.style.transform = `translate(${currentTranslate}px, -50%)`;
    endX = currentX;
  }
  function touchEnd() {
    if (!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');
    const itemSpace = 84;
    let approxIndex = Math.round(-(currentTranslate + 32) / itemSpace);
    if (approxIndex < 0) approxIndex = 0;
    if (approxIndex >= CHAR_DATA.length) approxIndex = CHAR_DATA.length - 1;
    selectChar(approxIndex, true);
  }
  function getPositionX(e) {
    return e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
  }
})();

/* =========================================================
   1. 数据与存储
   ========================================================= */
const _auth = localStorage.getItem('dd_auth') || 'guest';
const _userName = (localStorage.getItem('dd_name') || '同学').trim();
const GRADE_MAP = {
  basic: { data: (typeof WORDS_BASIC !== 'undefined' ? WORDS_BASIC : []), label: '基础', type: 'blue' },
  core:  { data: (typeof WORDS_CORE  !== 'undefined' ? WORDS_CORE  : []), label: '核心', type: 'orange' },
  extra: { data: (typeof WORDS_EXTRA !== 'undefined' ? WORDS_EXTRA : []), label: '拓展', type: 'red' }
};
const STORE_KEY = 'dd_vg10_' + _auth;

function defaultStore() {
  return {
    level: 1,
    mastered: { basic: [], core: [], extra: [] },
    review: { basic: [], core: [], extra: [] },
    missedByAI: { basic: [], core: [], extra: [] },
    items: { speaker: 0, highlight: 0, firstLetter: 0 },
    speakerMilestone: 0,
    bestHp: 100,
    totalKills: 0
  };
}
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const j = JSON.parse(raw);
      let items = j.items || { speaker: 0, highlight: 0 };
      if (items.firstLetter === undefined) items.firstLetter = 0;
            return {
        level: j.level || 1,
        mastered: j.mastered || { basic: [], core: [], extra: [] },
        review: j.review || { basic: [], core: [], extra: [] },
        missedByAI: j.missedByAI || { basic: [], core: [], extra: [] },
        items: items,
        speakerMilestone: j.speakerMilestone || 0,
        bestHp: j.bestHp || 100,
        totalKills: j.totalKills || 0
      };
    }
  } catch (e) {}
  return defaultStore();
}
function saveStore(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }
let STORE = loadStore();

function markMastered(tier, word) {
  const s = loadStore();
  if (!s.mastered[tier]) s.mastered[tier] = [];
  const w = (word || '').toLowerCase();
  if (w && !s.mastered[tier].includes(w)) s.mastered[tier].push(w);
  STORE = s; saveStore(s);
}
function addToReview(tier, word) {
  const s = loadStore();
  if (!s.review) s.review = { basic: [], core: [], extra: [] };
  if (!s.review[tier]) s.review[tier] = [];
  const w = (word || '').toLowerCase();
  if (w && !s.review[tier].includes(w)) s.review[tier].push(w);
  STORE = s; saveStore(s); updateReviewCount();
}
function addMissedByAI(tier, word) {
  const s = loadStore();
  const w = (word || '').toLowerCase();
  if (!w) return;
  // 已经掌握的词不需要补回
  if ((s.mastered[tier] || []).includes(w)) return;
  if (!s.missedByAI) s.missedByAI = { basic: [], core: [], extra: [] };
  if (!s.missedByAI[tier]) s.missedByAI[tier] = [];
  if (!s.missedByAI[tier].includes(w)) s.missedByAI[tier].push(w);
  STORE = s; saveStore(s);
}

function getRemainingWords() {
  const s = loadStore();
  const total = GRADE_MAP.basic.data.length + GRADE_MAP.core.data.length + GRADE_MAP.extra.data.length;
  const masteredCount =
    ((s.mastered && s.mastered.basic && s.mastered.basic.length) || 0) +
    ((s.mastered && s.mastered.core && s.mastered.core.length) || 0) +
    ((s.mastered && s.mastered.extra && s.mastered.extra.length) || 0);
  return Math.max(0, total - masteredCount);
}
function removeFromReview(tier, word) {
  const s = loadStore();
  if (!s.review || !s.review[tier]) return;
  const w = (word || '').toLowerCase();
  const idx = s.review[tier].indexOf(w);
  if (idx > -1) { s.review[tier].splice(idx, 1); STORE = s; saveStore(s); updateReviewCount(); }
}
function getReviewItems() {
  const s = loadStore();
  const items = [];
  ['basic','core','extra'].forEach(tier => {
    const list = (s.review && s.review[tier]) || [];
    list.forEach(w => {
      const pool = GRADE_MAP[tier].data;
      const full = pool.find(x => (x.w || '').toLowerCase() === w.toLowerCase());
      if (full) items.push({ word: full, tier: tier, type: GRADE_MAP[tier].type });
    });
  });
  return items;
}
function updateReviewCount() {
  const s = loadStore();
  const total = (s.review?.basic?.length || 0) + (s.review?.core?.length || 0) + (s.review?.extra?.length || 0);
  const el = document.getElementById('reviewCount');
  if (el) el.textContent = total;
}
function addKillCount() {
  const s = loadStore();
  s.totalKills = (s.totalKills || 0) + 1;
  if (s.speakerMilestone == null) s.speakerMilestone = 0;
  const diff = s.totalKills - s.speakerMilestone;
  if (diff >= 5) {
    const gain = Math.floor(diff / 5);
    if (!s.items) s.items = { speaker: 0, highlight: 0, firstLetter: 0 };
    s.items.speaker = (s.items.speaker || 0) + gain;
    s.speakerMilestone += gain * 5;
    setTimeout(() => { showToast('🎺', '获得喇叭 ×' + gain, '每击败 5 个单词自动获得', '#38bdf8'); updateItemBag(); updateItemButtons(); }, 420);
  }
  STORE = s; saveStore(s);
}
function getRank(total) {
  const sun  = Math.floor(total / 1000);
  const moon = Math.floor((total % 1000) / 100);
  const star = Math.floor((total % 100) / 20);
  return { sun, moon, star };
}
function addItem(type, n) {
  const s = loadStore();
  if (!s.items) s.items = { speaker: 0, highlight: 0, firstLetter: 0 };
  s.items[type] = (s.items[type] || 0) + (n || 1);
  STORE = s; saveStore(s); updateItemBag(); updateItemButtons();
}
function useItem(type) {
  const s = loadStore();
  if (!s.items || (s.items[type] || 0) <= 0) return false;
  s.items[type]--;
  STORE = s; saveStore(s); updateItemBag(); updateItemButtons();
  return true;
}
function updateItemBag() {
  const s = loadStore();
  const bag = document.getElementById('itemBag');
  if (!bag) return;
  const sp = (s.items && s.items.speaker) || 0;
  const hl = (s.items && s.items.highlight) || 0;
  const fl = (s.items && s.items.firstLetter) || 0;
  let html = '';
  if (sp > 0) html += '<span class="item-chip">🎺<b>' + sp + '</b></span>';
  if (hl > 0) html += '<span class="item-chip">⌨️<b>' + hl + '</b></span>';
  if (fl > 0) html += '<span class="item-chip">💡<b>' + fl + '</b></span>';
  bag.innerHTML = html;
}
function updateItemButtons() {
  const s = loadStore();
  const sp = (s.items && s.items.speaker) || 0;
  const hl = (s.items && s.items.highlight) || 0;
  const fl = (s.items && s.items.firstLetter) || 0;
  const speakerBtn = document.getElementById('speakerBtn');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickWords(pool, tier, n) {
  const store = loadStore();
  const mastered = store.mastered[tier] || [];
  const missed = (store.missedByAI && store.missedByAI[tier]) || [];
  const isMastered = w => mastered.includes((w.w || '').toLowerCase());
  const isMissed = w => missed.includes((w.w || '').toLowerCase());

  // 优先级 1：missedByAI 里的词（AI 干掉/替换掉的，优先补回）
  const priority1 = pool.filter(w => isMissed(w) && !isMastered(w));
  // 优先级 2：未掌握的常规词（排除优先级 1）
  const priority2 = pool.filter(w => !isMastered(w) && !isMissed(w));
  // 优先级 3：全部兜底
  const priority3 = pool.slice();

  const result = [];
  const p1 = shuffle(priority1);
  while (result.length < n && p1.length) result.push(p1.pop());
  if (result.length < n) {
    const p2 = shuffle(priority2);
    while (result.length < n && p2.length) result.push(p2.pop());
  }
  if (result.length < n) {
    const p3 = shuffle(priority3);
    while (result.length < n && p3.length) result.push(p3.pop());
  }
  return result;
}

function applyPendingVerify(mixed) {
  let pending = [];
  try { pending = JSON.parse(sessionStorage.getItem('dd_pending_verify') || '[]'); } catch (e) {}
  if (!pending.length) return mixed;
  const pendingByTier = { basic: [], core: [], extra: [] };
  const seen = new Set();
  pending.forEach(w => {
    const key = (w || '').toLowerCase();
    if (!key || seen.has(key)) return;
    seen.add(key);
    ['basic', 'core', 'extra'].forEach(t => {
      const full = GRADE_MAP[t].data.find(x => (x.w || '').toLowerCase() === key);
      if (full && !pendingByTier[t].some(x => (x.w || '').toLowerCase() === key)) pendingByTier[t].push(full);
    });
  });
  const leftover = [];
  ['basic', 'core', 'extra'].forEach(t => {
    const list = pendingByTier[t];
    if (!list.length) return;
    let k = 0;
    for (let i = 0; i < mixed.length && k < list.length; i++) {
      if (mixed[i].tier === t && !mixed[i].mystery) {
        mixed[i] = { word: list[k], type: GRADE_MAP[t].type, tier: t, mystery: false };
        k++;
      }
    }
    for (let j = k; j < list.length; j++) leftover.push((list[j].w || '').toLowerCase());
  });
  try {
    if (leftover.length) sessionStorage.setItem('dd_pending_verify', JSON.stringify(leftover));
    else sessionStorage.removeItem('dd_pending_verify');
  } catch (e) {
    try { sessionStorage.removeItem('dd_pending_verify'); } catch (e2) {}
  }
  return mixed;
}

function placeEnemies(list) {
  const placed = [];
  list.forEach((e, i) => {

    // 随机战斗位置：下方 42%~82% 范围内，简单去重避免叠在一起

    do {
      x = 8 + Math.random() * 84;   // 8 ~ 92
      y = 42 + Math.random() * 40;  // 42 ~ 82
      tries++;
    } while (
      tries < 8 &&
      placed.some(p => Math.abs(p.x - x) < 8 && Math.abs(p.y - y) < 8)
    );
    placed.push({ x, y });

    e.id = i;
    e.x = x; e.y = y;
    e.homeX = x; e.homeY = y;

function buildLevel(levelNum) {
  const blueWords   = pickWords(GRADE_MAP.basic.data, 'basic', COMPOSITION.blue);
  const orangeWords = pickWords(GRADE_MAP.core.data,  'core',  COMPOSITION.orange);
  const redWords    = pickWords(GRADE_MAP.extra.data, 'extra', COMPOSITION.red);
  const list = [];
  const addWord = (w, t, tier) => {
    let type = t; const tag = Number(w.tag3);
    if (tag === 1) type = 'green'; else if (tag === 2) type = 'black'; else if (tag === 3) type = 'purple';
    list.push({ word: w, type: type, tier: tier, mystery: false });
  };
  blueWords.forEach(w => addWord(w, 'blue', 'basic'));
  orangeWords.forEach(w => addWord(w, 'orange', 'core'));
  redWords.forEach(w => addWord(w, 'red', 'extra'));
  const mixed = shuffle(list);
  const mysteryCount = Math.min(6, Math.max(3, Math.round(mixed.length * MYSTERY_RATE)));
  const mysteryIdx = new Set();
  while (mysteryIdx.size < mysteryCount && mysteryIdx.size < mixed.length) mysteryIdx.add(Math.floor(Math.random() * mixed.length));
  mysteryIdx.forEach(i => { mixed[i].mystery = true; });
  applyPendingVerify(mixed);

  /* 本关已抽到的词，从 missedByAI 中移除（已补回） */
  const s = loadStore();
  if (!s.missedByAI) s.missedByAI = { basic: [], core: [], extra: [] };
  mixed.forEach(item => {
    const tier = item.tier;
    const k = (item.word.w || '').toLowerCase();
    if (!k) return;
    const arr = s.missedByAI[tier];
    if (!arr) return;
    const idx = arr.indexOf(k);

  placeEnemies(mixed);

  if (charId === '002') { renderSkillItem('💣', useBomb); renderSkillItem('💣', useBomb); }
  if (charId === '005') { renderSkillItem('🎵', useSoundWave); }
  if (charId === '006') { renderSkillItem('📜', useCharm); renderSkillItem('📜', useCharm); }
  if (charId === '007') { renderSkillItem('🌀', useHurricane); renderSkillItem('🌀', useHurricane); }
}
function renderSkillItem(icon, onClick) {
  const div = document.createElement('div');
  div.className = 'skill-item'; div.textContent = icon; div.onclick = onClick;
  document.getElementById('skillSlot').appendChild(div);
}
function removeSkillItem(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }

function useBomb() {
  if (CHAR_SKILLS.bombLeft <= 0 || !G.running || G.paused) return;
  CHAR_SKILLS.bombLeft--;
  const items = document.querySelectorAll('.skill-item');
  for (let i = 0; i < items.length; i++) { if (items[i].textContent === '💣') { removeSkillItem(items[i]); break; } }
  sfxHit();

  const w = _arenaW || arena.clientWidth || 1;
  const h = _arenaH || arena.clientHeight || 1;

  // 爆炸中心（逻辑坐标：x 从左往右、y 从下往上，单位 %）
  const cxPct = 50;
  const cyPct = 60;

  // 换算成像素（从左上角算）
  const cxPx = cxPct / 100 * w;
  const cyPx = (1 - cyPct / 100) * h;

  // 判定半径：屏幕短边的 35%，视觉与逻辑共用同一个值
  const radius = Math.min(w, h) * 0.35;

  // 视觉爆炸：直接用像素定位，和判定圆心完全重合
  const blast = document.createElement('div');
  blast.className = 'bomb-blast';
  blast.style.left = cxPx + 'px';
  blast.style.top  = cyPx + 'px';
  blast.style.setProperty('--blast-scale', ((radius * 2) / 40).toFixed(2));
  arena.appendChild(blast);
  setTimeout(() => blast.remove(), 850);

  // 判定：真实像素距离
  let hitCount = 0;
  G.enemies.forEach(e => {
    if (!e.alive) return;
    const ex = e.x / 100 * w;
    const ey = (1 - e.y / 100) * h;
    const dist = Math.hypot(ex - cxPx, ey - cyPx);
    if (dist < radius) {
      e.hp -= 50;
      updateEnemyHpUi(e);
      popEnemyDamage(e.x, e.y, 50);
      hitCount++;
      if (e.hp <= 0) skillKillEnemy(e);
    }
  });

  if (hitCount === 0) {
    showToast('💣', '爆炸落空', '范围内没有敌人', '#f59e0b');
  }
}
function useSoundWave() {
  if (CHAR_SKILLS.freezeUntil > performance.now() || !G.running || G.paused) return;

}
function useCharm() {
  if (!G.running || G.paused) return;

  if (!alive.length) return;

function skillKillEnemy(e) {

  e.cleaned = true; e.alive = false; e.hp = 0;
  if (e.el && !e.el.classList.contains('charm-fading') && !e.el.classList.contains('hurricane-flying')) {

   6. 渲染 & 主循环

const entityLayer = document.getElementById('entityLayer');
const arena = document.getElementById('arena');

let _arenaW = 1, _arenaH = 1;
function updateArenaSize() {
  _arenaW = arena.clientWidth || 1;
  _arenaH = arena.clientHeight || 1;
}
window.addEventListener('resize', updateArenaSize);
setTimeout(updateArenaSize, 0);

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function createEnemyEl(e) {
  const div = document.createElement('div');
  div.className = 'enemy ' + e.type + (e.mystery ? ' mystery' : '');

  // 直接放在最终位置
  div.style.left = e.x + '%';
  div.style.bottom = e.y + '%';

  const meaning = e.word.m || e.word.cn || '';
  div.innerHTML =
    '<div class="enemy-inner">' +
      '<div class="enemy-hp"><div class="enemy-hp-fill"></div></div>' +
      '<div class="enemy-orb">' + EMOJI[e.type] +
        '<span class="enemy-tag">' + escapeHtml(meaning) + '</span>' +
      '</div>' +
    '</div>';
  div.style.setProperty('--d1', `-${Math.random() * 2}s`);

  div.addEventListener('click', ev => {
    ev.stopPropagation();
    if (G.preparing) return;
    if (e.entering) return;                    // ← 入场期间禁止点击
    if (G.paused || !G.running || !e.alive) return;
    openChallenge(e);
  });

  entityLayer.appendChild(div);
  e.el = div;
  updateEnemyHpUi(e);

  const line = document.createElement('div');
  line.className = 'aim-line aim-' + e.type;
  line.style.display = 'none';
  arena.appendChild(line);
  e.aimLine = line;

  // 弹出式入场：scale(0) → scale(1) + 淡入
  if (e.entering) {
    div.style.opacity = '0';
    div.style.transform = 'scale(0)';
    setTimeout(() => {
      if (!e.el || !e.alive) return;
      div.style.transition =
        'transform 0.55s cubic-bezier(.34,1.56,.64,1), ' +
        'opacity 0.3s ease';

      div.style.opacity = '1';
      setTimeout(() => {
        if (!e.el) return;
        e.entering = false;
        div.style.transition = '';
        div.style.transform = '';
        div.style.opacity = '';
      }, 600);
    }, e.entryDelay || 0);

function updateEnemyHpUi(e) {
  if (!e.el) return;
  const fill = e.el.querySelector('.enemy-hp-fill');
  if (!fill) return;
  const pct = Math.max(0, Math.min(1, e.hp / e.maxHp));
  fill.style.width = (pct * 100) + '%';
  fill.style.background = pct > 0.5 ? '#10b981' : pct > 0.25 ? '#fbbf24' : '#ef4444';
}
function clearEntities() {
  entityLayer.innerHTML = '';
  document.querySelectorAll('.aim-line').forEach(l => l.remove());
  document.querySelectorAll('.proj').forEach(p => p.remove());
  document.querySelectorAll('.hero-proj').forEach(p => p.remove());
  document.getElementById('buffBar').innerHTML = '';
  document.getElementById('toastWrap').innerHTML = '';
  G.chests.forEach(c => { if (c.el) c.el.remove(); });
  G.chests = [];
  G.chestActive = false;
  G.bloatingEnemy = null;
  G.heroProjectiles = [];
}

function syncEntities() {
  if (!G.running || G.paused || G.preparing || G.over) return;
  const W = _arenaW, H = _arenaH;
  const px = PLAYER_X / 100 * W;
  const py = (1 - PLAYER_Y / 100) * H;

  for (const e of G.enemies) {
    if (!e.el) continue;
    if (!e.alive) {
      if (e.el.style.display !== 'none') e.el.style.display = 'none';
      if (e.aimLine && e.aimLine.style.display !== 'none') e.aimLine.style.display = 'none';
      continue;
    }
    if (e.entering) continue;
    if (e.el.style.display === 'none') e.el.style.display = '';
    const lx = e.x + '%', ly = e.y + '%';
    if (e.el.style.left !== lx) e.el.style.left = lx;
    if (e.el.style.bottom !== ly) e.el.style.bottom = ly;
    e.el.classList.toggle('aiming', e.aimingPlayer);

    if (e.aimLine) {
      if (e.aimingPlayer) {
        const ex = e.x / 100 * W;
        const ey = (1 - e.y / 100) * H;
        const lx2 = px - ex, ly2 = py - ey;
        const len = Math.hypot(lx2, ly2);
        const ang = Math.atan2(ly2, lx2) * 180 / Math.PI;
        e.aimLine.style.left = ex + 'px';
        e.aimLine.style.top = ey + 'px';
        e.aimLine.style.width = len + 'px';
        e.aimLine.style.transform = 'rotate(' + ang + 'deg)';
        if (e.aimLine.style.display !== 'block') e.aimLine.style.display = 'block';
      } else if (e.aimLine.style.display !== 'none') {
        e.aimLine.style.display = 'none';
      }
    }
  }
  for (const p of G.projectiles) {
    if (!p.el) continue;
    const lx = p.x + '%', ly = p.y + '%';
    if (p.el.style.left !== lx) p.el.style.left = lx;
    if (p.el.style.bottom !== ly) p.el.style.bottom = ly;
  }
  for (const p of G.heroProjectiles) {
    if (!p.el) continue;
    const lx = p.x + '%', ly = p.y + '%';
    if (p.el.style.left !== lx) p.el.style.left = lx;
    if (p.el.style.bottom !== ly) p.el.style.bottom = ly;
  }
}

function formatTime(ms) {
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return m > 0 ? ('用时' + m + '分' + s + '秒') : ('用时' + s + '秒');
}
function updateTimerDisplay() {
  const sec = Math.floor(G.elapsed / 1000);
  if (sec === _lastTimerSec) return;
  _lastTimerSec = sec;
  const el = document.getElementById('timerBadge');
  if (el) el.textContent = formatTime(G.elapsed);
}
function updateBuffBar() {
  const now = performance.now();
  const items = [];
  const shieldOn = now < G.shieldUntil;
  const slowOn = now < G.slowUntil;
  const frozen = now < CHAR_SKILLS.freezeUntil;
  if (shieldOn) items.push({ cls: '', icon: '🛡️', text: '护盾 ' + Math.ceil((G.shieldUntil - now) / 1000) + 's' });
  if (slowOn) items.push({ cls: 'slow', icon: '🐢', text: '敌缓 ' + Math.ceil((G.slowUntil - now) / 1000) + 's' });
  if (frozen) items.push({ cls: 'slow', icon: '❄️', text: '冻结 ' + Math.ceil((CHAR_SKILLS.freezeUntil - now) / 1000) + 's' });

  const playerEl = document.getElementById('player');
  if (playerEl) playerEl.classList.toggle('shielded', shieldOn);
  const st = document.getElementById('shieldTimer');
  if (st) {
    const sec = shieldOn ? Math.ceil((G.shieldUntil - now) / 1000) : -1;
    if (sec !== _lastShieldSec) { _lastShieldSec = sec; st.textContent = sec >= 0 ? sec + 's' : ''; }
  }
  const key = items.map(i => i.text).join('|');
  if (key === _lastBuffKey) return;
  _lastBuffKey = key;
  const bar = document.getElementById('buffBar');
  if (!bar) return;
  bar.innerHTML = items.map(i => '<div class="buff-chip ' + i.cls + '"><i>' + i.icon + '</i>' + i.text + '</div>').join('');
}
function updateStreakBar() {
  const wrap = document.getElementById('streakBarWrap');
  const fill = document.getElementById('streakBarFill');
  const text = document.getElementById('streakText');
  if (!wrap || !fill || !text) return;
  if (G.streak > 0) {
    wrap.classList.add('show');
    fill.style.width = (G.streak / 5 * 100) + '%';
    text.textContent = G.streak + '/5';
  } else {
    wrap.classList.remove('show');
    fill.style.width = '0%';
    text.textContent = '0/5';
  }
}
function updateHUD() {
  const pct = Math.max(0, G.hp / G.maxHp * 100);
  const fill = document.getElementById('playerHpFill');
  if (fill) fill.style.width = pct + '%';
  const hpText = document.getElementById('hpText');
  if (hpText) hpText.textContent = Math.round(G.hp) + '/' + G.maxHp;
  const left = G.enemies.filter(e => e.alive).length;
  const el = document.getElementById('enemyLeft');
  if (el) el.textContent = left;
  updateRankHUD();
  updateItemBag();
}
function loop(ts) {
  const dt = Math.min((ts - (G.lastTs || ts)) / 1000, 0.05);
  G.lastTs = ts;
  if (G.running && !G.paused && !G.over) {
    G.elapsed = performance.now() - G.startTime - G.pauseOffset;
    updateTimerDisplay();
    updateBuffBar();
  }
  if (G.running && !G.paused && !G.preparing && !G.over) update(dt);
  syncEntities();
  requestAnimationFrame(loop);
}

function pickWanderTarget(e) {
  const cfg = ENEMY_CFG[e.type];
  if (e.type === 'blue') {
    e.tx = clamp(e.homeX + (Math.random() - 0.5) * 2 * cfg.wanderR, 8, 92);
    e.ty = clamp(e.homeY + (Math.random() - 0.5) * 12, cfg.yMin, cfg.yMax);
  } else {
    e.tx = clamp(8 + Math.random() * 84, 8, 92);
    e.ty = clamp(cfg.yMin + Math.random() * (cfg.yMax - cfg.yMin), cfg.yMin, cfg.yMax);
  }
}
function wanderEnemy(e, dt) {
  const dx = e.tx - e.x, dy = e.ty - e.y;
  const d = Math.hypot(dx, dy);
  if (d < 1.2) {
    e.wanderTimer += dt;
    if (e.wanderTimer > 0.35) { e.wanderTimer = 0; pickWanderTarget(e); }
  } else {
    const sp = Math.min(e.speed * dt, d);
    e.x += dx / d * sp; e.y += dy / d * sp;
    e.wanderTimer = 0;
  }
  e.x = clamp(e.x, 6, 94);
  e.y = clamp(e.y, 36, 86);
}

function update(dt) {
  const now = performance.now();
  const isFrozen = now < CHAR_SKILLS.freezeUntil;
  const slowOn = now < G.slowUntil;
  const shieldOn = now < G.shieldUntil;
  const baseFireFactor = slowOn ? 0.42 : 1;

  const aliveEnemies = G.enemies.filter(e => e.alive);
  const aliveCount = aliveEnemies.length;
  const densityBoost = aliveCount > 0 ? Math.max(1, 15 / aliveCount) : 1;
  const fireFactor = baseFireFactor * densityBoost;

  /* 003 / 004 自动射击 */
  if (charId === '003' || charId === '004') {
    CHAR_SKILLS.heroFireTimer -= dt;
    if (CHAR_SKILLS.heroFireTimer <= 0) {
      const targets = aliveEnemies.filter(e => !e.killedBySkill);
      if (targets.length > 0) {
        const target = targets[Math.floor(Math.random() * targets.length)];
        if (charId === '003') { fireHeroProjectile(target, 10, 'fast'); CHAR_SKILLS.heroFireTimer = 0.6; }
        else { fireHeroProjectile(target, 50, 'strong'); CHAR_SKILLS.heroFireTimer = 2.5; }
      }
    }
  }

  /* 英雄子弹更新 */
  for (const p of G.heroProjectiles) {
    if (p.dead) continue;
    const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy);
    if (dist < 2) {
      p.dead = true;
      if (p.target && p.target.alive) {
        p.target.hp -= p.dmg;
        updateEnemyHpUi(p.target);
        if (p.target.hp <= 0) skillKillEnemy(p.target);
      }
    } else {
      const sp = p.speed * dt;
      p.x += dx / dist * sp; p.y += dy / dist * sp;
    }
  }
  G.heroProjectiles = G.heroProjectiles.filter(p => { if (p.dead) { if (p.el) p.el.remove(); return false; } return true; });

  /* 敌人 AI */
  for (const e of aliveEnemies) {
    if (e.entering) { e.aimingPlayer = false; continue; }
    if (isFrozen) { e.aimingPlayer = false; continue; }
    wanderEnemy(e, dt);
    const cfg = ENEMY_CFG[e.type];

    if (e.type === 'green') {
      e.fireTimer -= dt * fireFactor;
      e.aimingPlayer = false;
      if (e.fireTimer <= 0) {
        const others = aliveEnemies.filter(t => t !== e && t.type !== 'green');
        if (others.length > 0) spawnGreenProjectile(e, others[Math.floor(Math.random() * others.length)]);
        e.fireTimer = 8 + Math.random() * 4;
      }
      continue;
    }
    if (e.type === 'black') {
      e.actionTimer -= dt;
      if (e.actionTimer <= 0) {
        e.actionTimer = 6 + Math.random() * 5;
        const targets = aliveEnemies.filter(t => t !== e);
        if (targets.length > 0) swallowEnemy(e, targets[Math.floor(Math.random() * targets.length)]);
      }
      continue;
    }

    e.fireTimer -= dt * fireFactor;
    e.aimingPlayer = e.nextAimed && e.fireTimer < 0.8 && e.fireTimer > 0;
    if (e.fireTimer <= 0) {
      spawnProjectile(e, e.nextAimed, cfg.projSpeed, cfg.projDmg, e.type);
      e.fireTimer = cfg.fireMin + Math.random() * (cfg.fireMax - cfg.fireMin);
      e.nextAimed = Math.random() < cfg.aimProb;
      e.aimingPlayer = false;
    }
    if (e.type === 'purple') {
      e.mutateTimer -= dt;
      if (e.mutateTimer <= 0) { e.mutateTimer = 8 + Math.random() * 6; mutateEnemy(e); }
    }
  }

  if (aliveCount <= 15 && aliveCount > 0 && !G.bloatingEnemy) {
    const target = aliveEnemies.find(e => e.type !== 'black');
    if (target) {
      G.bloatingEnemy = target;
      G.bloatTime = 0;
      if (target.el) target.el.classList.add('bloating');
      showToast('🔥', '发现不稳定的能量源！', '120秒内击破有重赏，超时将分裂！', '#ef4444');
      beep(600, 0.2, 'sawtooth', 0.1);
    }
  }
  if (G.bloatingEnemy) {
    if (!G.bloatingEnemy.alive) G.bloatingEnemy = null;
    else { G.bloatTime += dt; if (G.bloatTime >= 120) explodeEnemy(G.bloatingEnemy); }
  }

  for (const p of G.projectiles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
        if (p.isGreen) {
      if (p.target && p.target.alive) {
        const dx = p.x - p.target.x, dy = p.y - p.target.y;
        if (Math.hypot(dx, dy) < 5) {
          p.dead = true;
          p.target.hp -= p.dmg;
          updateEnemyHpUi(p.target);
          if (p.target.hp <= 0) {
            addMissedByAI(p.target.tier, p.target.word.w);   // 友军击杀的词，记为未学
            skillKillEnemy(p.target);
          }
        }
      } else p.dead = true;
    } else {
      const dx = p.x - PLAYER_X, dy = p.y - PLAYER_Y, dist = Math.hypot(dx, dy);
      if (shieldOn && dist < 8) { p.dead = true; spawnShieldShatter(p.x, p.y); sfxShieldBreak(); }
      else if (dist < 4.5) { p.dead = true; damagePlayer(p.dmg); }
    }
    if (p.x < -12 || p.x > 112 || p.y < -12 || p.y > 112) p.dead = true;
  }
  G.projectiles = G.projectiles.filter(p => { if (p.dead) { if (p.el) p.el.remove(); return false; } return true; });

  const pausedDur = G.pauseOffset;
  for (let i = G.chests.length - 1; i >= 0; i--) {
    const c = G.chests[i];
    if (c.opened) continue;
    const activeTime = (now - c.createTime - pausedDur) / 1000;
    if (activeTime > c.life) {
      c.el.classList.add('fadeout');
      sfxChestVanished();
      setTimeout(() => {
        if (c.el.parentNode) c.el.remove();
        const idx = G.chests.indexOf(c);
        if (idx > -1) G.chests.splice(idx, 1);
        if (G.chests.length === 0) G.chestActive = false;
      }, 600);
    }
  }
}

function fireHeroProjectile(target, dmg, cls) {
  const p = { x: 50, y: PLAYER_Y, tx: target.x, ty: target.y, speed: cls === 'fast' ? 50 : 25, dmg: dmg, target: target, dead: false, el: null };

    case 'shield': G.shieldUntil = Math.max(G.shieldUntil, now) + 30000; break;

      _rulesTimers.push(t);

    const batch = RULE_BATCHES[batchIndex];

    const stayMs = Math.max(2400, batch.length * 1300 + 1200);
    const t1 = setTimeout(() => {
      panel.classList.remove('show');
      const t2 = setTimeout(() => { batchIndex++; showBatch(); }, 480);
      _rulesTimers.push(t2);
